re class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-fn\">type</span>(<span class=\"t-num\">42</span>)          <span class=\"t-com\"># &lt;class 'int'&gt;</span>\n<span class=\"t-fn\">type</span>(<span class=\"t-num\">3.14</span>)        <span class=\"t-com\"># &lt;class 'float'&gt;</span>\n<span class=\"t-fn\">type</span>(<span class=\"t-str\">\"texto\"</span>)     <span class=\"t-com\"># &lt;class 'str'&gt;</span>\n<span class=\"t-fn\">type</span>(<span class=\"t-chave\">True</span>)        <span class=\"t-com\"># &lt;class 'bool'&gt;</span>\n\n<span class=\"t-fn\">int</span>(<span class=\"t-str\">\"42\"</span>)         <span class=\"t-com\"># 42</span>\n<span class=\"t-fn\">float</span>(<span class=\"t-str\">\"3.14\"</span>)     <span class=\"t-com\"># 3.14</span>\n<span class=\"t-fn\">str</span>(<span class=\"t-num\">42</span>)           <span class=\"t-com\"># \"42\"</span>\n\nidade = <span class=\"t-fn\">int</span>(<span class=\"t-fn\">input</span>(<span class=\"t-str\">\"Sua idade: \"</span>))   <span class=\"t-com\"># input SEMPRE retorna texto</span></code></pre></figure>\n<p>Esquecer o <code>int()</code> no <code>input()</code> é o erro número um de quem começa em Python.</p>","ancoras":[],"minutos":4},{"id":"a4-3","codigo":"4.3","titulo":"Operadores e controle","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-num\">7</span> / <span class=\"t-num\">2</span>      <span class=\"t-com\"># 3.5   divisão normal</span>\n<span class=\"t-num\">7</span> // <span class=\"t-num\">2</span>     <span class=\"t-com\"># 3     divisão inteira (descarta a fração)</span>\n<span class=\"t-num\">7</span> % <span class=\"t-num\">2</span>      <span class=\"t-com\"># 1     resto</span>\n<span class=\"t-num\">2</span> ** <span class=\"t-num\">10</span>    <span class=\"t-com\"># 1024  potência</span>\n\n<span class=\"t-com\"># Lógicos escritos por extenso</span>\n<span class=\"t-chave\">if</span> idade &gt;= <span class=\"t-num\">18</span> <span class=\"t-chave\">and</span> tem_carteira:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Pode dirigir\"</span>)\n<span class=\"t-chave\">elif</span> idade &gt;= <span class=\"t-num\">16</span> <span class=\"t-chave\">or</span> autorizado:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Caso especial\"</span>)\n<span class=\"t-chave\">else</span>:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Não pode\"</span>)\n\n<span class=\"t-com\"># Encadeamento que só Python tem</span>\n<span class=\"t-chave\">if</span> <span class=\"t-num\">0</span> &lt;= nota &lt;= <span class=\"t-num\">10</span>:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Nota válida\"</span>)</code></pre></figure>\n<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\"># Laços</span>\n<span class=\"t-chave\">for</span> i <span class=\"t-chave\">in</span> <span class=\"t-fn\">range</span>(<span class=\"t-num\">5</span>):           <span class=\"t-com\"># 0,1,2,3,4</span>\n    <span class=\"t-fn\">print</span>(i)\n\n<span class=\"t-chave\">for</span> i <span class=\"t-chave\">in</span> <span class=\"t-fn\">range</span>(<span class=\"t-num\">1</span>, <span class=\"t-num\">11</span>):       <span class=\"t-com\"># 1 até 10</span>\n    <span class=\"t-fn\">print</span>(i)\n\n<span class=\"t-chave\">for</span> i <span class=\"t-chave\">in</span> <span class=\"t-fn\">range</span>(<span class=\"t-num\">0</span>, <span class=\"t-num\">21</span>, <span class=\"t-num\">2</span>):    <span class=\"t-com\"># de 2 em 2</span>\n    <span class=\"t-fn\">print</span>(i)\n\n<span class=\"t-chave\">for</span> fruta <span class=\"t-chave\">in</span> [<span class=\"t-str\">\"maçã\"</span>, <span class=\"t-str\">\"uva\"</span>]:\n    <span class=\"t-fn\">print</span>(fruta)\n\n<span class=\"t-chave\">for</span> indice, fruta <span class=\"t-chave\">in</span> <span class=\"t-fn\">enumerate</span>([<span class=\"t-str\">\"maçã\"</span>, <span class=\"t-str\">\"uva\"</span>]):\n    <span class=\"t-fn\">print</span>(f<span class=\"t-str\">\"{indice}: {fruta}\"</span>)\n\n<span class=\"t-chave\">while</span> resposta != <span class=\"t-str\">\"sair\"</span>:\n    resposta = <span class=\"t-fn\">input</span>(<span class=\"t-str\">\"Digite: \"</span>)</code></pre></figure>\n<p><code>break</code> sai do laço, <code>continue</code> pula para a próxima volta.</p>","ancoras":[],"minutos":4},{"id":"a4-4","codigo":"4.4","titulo":"Estruturas de dados","nivel":"Básico","quando":"","html":"<p>Python tem quatro coleções e saber escolher entre elas é metade do trabalho.</p>\n<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\"># LISTA — ordenada, mutável, aceita repetidos</span>\nnotas = [<span class=\"t-num\">7.5</span>, <span class=\"t-num\">8.0</span>, <span class=\"t-num\">6.5</span>]\nnotas.<span class=\"t-fn\">append</span>(<span class=\"t-num\">9.0</span>)\nnotas[<span class=\"t-num\">0</span>]           <span class=\"t-com\"># 7.5</span>\nnotas[-<span class=\"t-num\">1</span>]          <span class=\"t-com\"># 9.0  — índice negativo conta de trás</span>\nnotas[<span class=\"t-num\">1</span>:<span class=\"t-num\">3</span>]         <span class=\"t-com\"># [8.0, 6.5]  — fatiamento</span>\n\n<span class=\"t-com\"># TUPLA — ordenada, IMUTÁVEL</span>\ncoordenada = (<span class=\"t-num\">10</span>, <span class=\"t-num\">20</span>)\n<span class=\"t-com\"># coordenada[0] = 5   → ERRO</span>\n\n<span class=\"t-com\"># DICIONÁRIO — pares chave:valor</span>\npessoa = {<span class=\"t-str\">\"nome\"</span>: <span class=\"t-str\">\"Ana\"</span>, <span class=\"t-str\">\"idade\"</span>: <span class=\"t-num\">30</span>}\npessoa[<span class=\"t-str\">\"nome\"</span>]              <span class=\"t-com\"># \"Ana\"</span>\npessoa.<span class=\"t-fn\">get</span>(<span class=\"t-str\">\"email\"</span>, <span class=\"t-str\">\"n/a\"</span>)  <span class=\"t-com\"># valor padrão se a chave não existir</span>\npessoa[<span class=\"t-str\">\"email\"</span>] = <span class=\"t-str\">\"a@b.com\"</span> <span class=\"t-com\"># adiciona</span>\n<span class=\"t-chave\">for</span> chave, valor <span class=\"t-chave\">in</span> pessoa.<span class=\"t-fn\">items</span>():\n    <span class=\"t-fn\">print</span>(f<span class=\"t-str\">\"{chave}: {valor}\"</span>)\n\n<span class=\"t-com\"># CONJUNTO — sem ordem, sem repetidos</span>\nnumeros = {<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">3</span>}   <span class=\"t-com\"># vira {1, 2, 3}</span></code></pre></figure>\n<p>Truque prático: remover duplicados de uma lista em uma linha.</p>\n<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>lista_limpa = <span class=\"t-fn\">list</span>(<span class=\"t-fn\">set</span>([<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">3</span>]))   <span class=\"t-com\"># [1, 2, 3]</span></code></pre></figure>","ancoras":[],"minutos":4},{"id":"a4-5","codigo":"4.5","titulo":"Funções","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">def</span> <span class=\"t-fn\">calcular_media</span>(notas):\n    <span class=\"t-str\">\"\"</span><span class=\"t-str\">\"Calcula a média de uma lista de notas.\"</span><span class=\"t-str\">\"\"</span>     <span class=\"t-com\"># docstring</span>\n    <span class=\"t-chave\">if</span> <span class=\"t-chave\">not</span> notas:\n        <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>\n    <span class=\"t-chave\">return</span> <span class=\"t-fn\">sum</span>(notas) / <span class=\"t-fn\">len</span>(notas)\n\n\n<span class=\"t-chave\">def</span> <span class=\"t-fn\">saudar</span>(nome, saudacao=<span class=\"t-str\">\"Olá\"</span>):        <span class=\"t-com\"># parâmetro com padrão</span>\n    <span class=\"t-chave\">return</span> f<span class=\"t-str\">\"{saudacao}, {nome}!\"</span>\n\n<span class=\"t-fn\">saudar</span>(<span class=\"t-str\">\"Ana\"</span>)                            <span class=\"t-com\"># \"Olá, Ana!\"</span>\n<span class=\"t-fn\">saudar</span>(<span class=\"t-str\">\"Ana\"</span>, saudacao=<span class=\"t-str\">\"Bom dia\"</span>)        <span class=\"t-com\"># argumento nomeado</span>\n\n\n<span class=\"t-chave\">def</span> <span class=\"t-fn\">somar_tudo</span>(*numeros):                <span class=\"t-com\"># aceita quantidade variável</span>\n    <span class=\"t-chave\">return</span> <span class=\"t-fn\">sum</span>(numeros)\n\n<span class=\"t-chave\">def</span> <span class=\"t-fn\">config</span>(**opcoes):                    <span class=\"t-com\"># aceita nomeados variáveis</span>\n    <span class=\"t-fn\">print</span>(opcoes)                        <span class=\"t-com\"># vira um dicionário</span></code></pre></figure>\n<hr>","ancoras":[],"minutos":4},{"id":"a4-6","codigo":"4.6","titulo":"Compreensões de lista","nivel":"Intermediário","quando":"","html":"<p>O recurso mais característico de Python. Substitui laços inteiros:</p>\n<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\"># Comum</span>\nquadrados = []\n<span class=\"t-chave\">for</span> n <span class=\"t-chave\">in</span> <span class=\"t-fn\">range</span>(<span class=\"t-num\">10</span>):\n    quadrados.<span class=\"t-fn\">append</span>(n ** <span class=\"t-num\">2</span>)\n\n<span class=\"t-com\"># Compreensão — mesma coisa</span>\nquadrados = [n ** <span class=\"t-num\">2</span> <span class=\"t-chave\">for</span> n <span class=\"t-chave\">in</span> <span class=\"t-fn\">range</span>(<span class=\"t-num\">10</span>)]\n\n<span class=\"t-com\"># Com filtro</span>\npares = [n <span class=\"t-chave\">for</span> n <span class=\"t-chave\">in</span> <span class=\"t-fn\">range</span>(<span class=\"t-num\">20</span>) <span class=\"t-chave\">if</span> n % <span class=\"t-num\">2</span> == <span class=\"t-num\">0</span>]\n\n<span class=\"t-com\"># Transformando dados</span>\nnomes = [p[<span class=\"t-str\">\"nome\"</span>].<span class=\"t-fn\">upper</span>() <span class=\"t-chave\">for</span> p <span class=\"t-chave\">in</span> pessoas <span class=\"t-chave\">if</span> p[<span class=\"t-str\">\"idade\"</span>] &gt;= <span class=\"t-num\">18</span>]\n\n<span class=\"t-com\"># Também funciona para dicionário e conjunto</span>\nquadrados_dict = {n: n**<span class=\"t-num\">2</span> <span class=\"t-chave\">for</span> n <span class=\"t-chave\">in</span> <span class=\"t-fn\">range</span>(<span class=\"t-num\">5</span>)}</code></pre></figure>\n<p>Use quando for uma transformação simples. Se você precisar de duas condições e um <code>else</code> aninhado, volte para o <code>for</code> normal — legibilidade vence esperteza.</p>","ancoras":[],"minutos":4},{"id":"a4-7","codigo":"4.7","titulo":"Manipulação de texto","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>texto = <span class=\"t-str\">\"  Olá, Mundo!  \"</span>\n\ntexto.<span class=\"t-fn\">strip</span>()               <span class=\"t-com\"># tira espaços das pontas</span>\ntexto.<span class=\"t-fn\">lower</span>()               <span class=\"t-com\"># minúsculas</span>\ntexto.<span class=\"t-fn\">upper</span>()               <span class=\"t-com\"># maiúsculas</span>\ntexto.<span class=\"t-fn\">replace</span>(<span class=\"t-str\">\"Mundo\"</span>, <span class=\"t-str\">\"Brasil\"</span>)\ntexto.<span class=\"t-fn\">split</span>(<span class=\"t-str\">\",\"</span>)            <span class=\"t-com\"># divide em lista</span>\n<span class=\"t-str\">\",\"</span>.<span class=\"t-fn\">join</span>([<span class=\"t-str\">\"a\"</span>, <span class=\"t-str\">\"b\"</span>, <span class=\"t-str\">\"c\"</span>])   <span class=\"t-com\"># junta lista em texto: \"a,b,c\"</span>\ntexto.<span class=\"t-fn\">startswith</span>(<span class=\"t-str\">\"Olá\"</span>)\n<span class=\"t-str\">\"Mundo\"</span> <span class=\"t-chave\">in</span> texto            <span class=\"t-com\"># True</span>\n<span class=\"t-fn\">len</span>(texto)</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a4-8","codigo":"4.8","titulo":"Arquivos","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\"># Ler</span>\n<span class=\"t-chave\">with</span> <span class=\"t-fn\">open</span>(<span class=\"t-str\">\"dados.txt\"</span>, <span class=\"t-str\">\"r\"</span>, encoding=<span class=\"t-str\">\"utf-8\"</span>) <span class=\"t-chave\">as</span> arquivo:\n    conteudo = arquivo.<span class=\"t-fn\">read</span>()\n\n<span class=\"t-chave\">with</span> <span class=\"t-fn\">open</span>(<span class=\"t-str\">\"dados.txt\"</span>, <span class=\"t-str\">\"r\"</span>, encoding=<span class=\"t-str\">\"utf-8\"</span>) <span class=\"t-chave\">as</span> arquivo:\n    <span class=\"t-chave\">for</span> linha <span class=\"t-chave\">in</span> arquivo:\n        <span class=\"t-fn\">print</span>(linha.<span class=\"t-fn\">strip</span>())\n\n<span class=\"t-com\"># Escrever (\"w\" apaga tudo, \"a\" acrescenta ao fim)</span>\n<span class=\"t-chave\">with</span> <span class=\"t-fn\">open</span>(<span class=\"t-str\">\"saida.txt\"</span>, <span class=\"t-str\">\"w\"</span>, encoding=<span class=\"t-str\">\"utf-8\"</span>) <span class=\"t-chave\">as</span> arquivo:\n    arquivo.<span class=\"t-fn\">write</span>(<span class=\"t-str\">\"Primeira linha\\n\"</span>)\n\n<span class=\"t-com\"># CSV</span>\n<span class=\"t-chave\">import</span> csv\n<span class=\"t-chave\">with</span> <span class=\"t-fn\">open</span>(<span class=\"t-str\">\"dados.csv\"</span>, newline=<span class=\"t-str\">\"\"</span>, encoding=<span class=\"t-str\">\"utf-8\"</span>) <span class=\"t-chave\">as</span> f:\n    leitor = csv.<span class=\"t-fn\">DictReader</span>(f)\n    <span class=\"t-chave\">for</span> linha <span class=\"t-chave\">in</span> leitor:\n        <span class=\"t-fn\">print</span>(linha[<span class=\"t-str\">\"nome\"</span>])\n\n<span class=\"t-com\"># JSON</span>\n<span class=\"t-chave\">import</span> json\n<span class=\"t-chave\">with</span> <span class=\"t-fn\">open</span>(<span class=\"t-str\">\"dados.json\"</span>, encoding=<span class=\"t-str\">\"utf-8\"</span>) <span class=\"t-chave\">as</span> f:\n    dados = json.<span class=\"t-fn\">load</span>(f)</code></pre></figure>\n<p>O <code>with</code> fecha o arquivo automaticamente, mesmo se der erro no meio. Sempre use <code>with</code>.</p>","ancoras":[],"minutos":4},{"id":"a4-9","codigo":"4.9","titulo":"Erros e exceções","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">try</span>:\n    numero = <span class=\"t-fn\">int</span>(<span class=\"t-fn\">input</span>(<span class=\"t-str\">\"Digite um número: \"</span>))\n    resultado = <span class=\"t-num\">10</span> / numero\n\n<span class=\"t-chave\">except</span> ValueError:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Isso não é um número.\"</span>)\n\n<span class=\"t-chave\">except</span> ZeroDivisionError:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Não dá para dividir por zero.\"</span>)\n\n<span class=\"t-chave\">except</span> Exception <span class=\"t-chave\">as</span> erro:\n    <span class=\"t-fn\">print</span>(f<span class=\"t-str\">\"Erro inesperado: {erro}\"</span>)\n\n<span class=\"t-chave\">else</span>:\n    <span class=\"t-fn\">print</span>(f<span class=\"t-str\">\"Deu certo: {resultado}\"</span>)     <span class=\"t-com\"># roda se não houve erro</span>\n\n<span class=\"t-chave\">finally</span>:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Sempre executa\"</span>)</code></pre></figure>\n<p>Capture exceções <strong>específicas</strong>. Um <code>except Exception</code> genérico esconde bugs e você fica horas caçando um problema que o Python teria te contado.</p>","ancoras":[],"minutos":4},{"id":"a4-10","codigo":"4.10","titulo":"Classes","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">class</span> ContaBancaria:\n    taxa_juros = <span class=\"t-num\">0.01</span>          <span class=\"t-com\"># atributo de classe, compartilhado</span>\n\n    <span class=\"t-chave\">def</span> <span class=\"t-fn\">__init__</span>(<span class=\"t-chave\">self</span>, titular, saldo=<span class=\"t-num\">0</span>):\n        <span class=\"t-chave\">self</span>.titular = titular\n        <span class=\"t-chave\">self</span>.saldo = saldo\n        <span class=\"t-chave\">self</span>._historico = []           <span class=\"t-com\"># _ sinaliza \"uso interno\"</span>\n\n    <span class=\"t-chave\">def</span> <span class=\"t-fn\">depositar</span>(<span class=\"t-chave\">self</span>, valor):\n        <span class=\"t-chave\">if</span> valor &lt;= <span class=\"t-num\">0</span>:\n            <span class=\"t-chave\">raise</span> <span class=\"t-fn\">ValueError</span>(<span class=\"t-str\">\"Valor deve ser positivo\"</span>)\n        <span class=\"t-chave\">self</span>.saldo += valor\n        <span class=\"t-chave\">self</span>._historico.<span class=\"t-fn\">append</span>(f<span class=\"t-str\">\"Depósito: {valor}\"</span>)\n\n    <span class=\"t-chave\">def</span> <span class=\"t-fn\">sacar</span>(<span class=\"t-chave\">self</span>, valor):\n        <span class=\"t-chave\">if</span> valor &gt; <span class=\"t-chave\">self</span>.saldo:\n            <span class=\"t-chave\">raise</span> <span class=\"t-fn\">ValueError</span>(<span class=\"t-str\">\"Saldo insuficiente\"</span>)\n        <span class=\"t-chave\">self</span>.saldo -= valor\n\n    <span class=\"t-chave\">def</span> <span class=\"t-fn\">__str__</span>(<span class=\"t-chave\">self</span>):                 <span class=\"t-com\"># como o objeto vira texto no print</span>\n        <span class=\"t-chave\">return</span> f<span class=\"t-str\">\"Conta de {self.titular}: R$ {self.saldo:.2f}\"</span>\n\n\n<span class=\"t-chave\">class</span> <span class=\"t-fn\">ContaPoupanca</span>(ContaBancaria):\n    <span class=\"t-chave\">def</span> <span class=\"t-fn\">render_juros</span>(<span class=\"t-chave\">self</span>):\n        <span class=\"t-chave\">self</span>.saldo *= (<span class=\"t-num\">1</span> + <span class=\"t-chave\">self</span>.taxa_juros)\n\n\nconta = <span class=\"t-fn\">ContaPoupanca</span>(<span class=\"t-str\">\"Ana\"</span>, <span class=\"t-num\">1000</span>)\nconta.<span class=\"t-fn\">depositar</span>(<span class=\"t-num\">500</span>)\n<span class=\"t-fn\">print</span>(conta)         <span class=\"t-com\"># Conta de Ana: R$ 1500.00</span></code></pre></figure>\n<hr>","ancoras":[],"minutos":4},{"id":"a4-11","codigo":"4.11","titulo":"Módulos e ambiente virtual","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">python</span> -m venv venv          <span class=\"t-com\"># cria ambiente isolado</span>\nsource venv/bin/activate     <span class=\"t-com\"># ativa (Linux/Mac)</span>\nvenv\\Scripts\\activate        <span class=\"t-com\"># ativa (Windows)</span>\n<span class=\"t-chave\">pip</span> install requests\n<span class=\"t-chave\">pip</span> freeze &gt; requirements.txt</code></pre></figure>\n<p><strong>Sempre crie um ambiente virtual por projeto.</strong> Sem isso, as bibliotecas de projetos diferentes brigam entre si e você perde um fim de semana.</p>\n<p>Bibliotecas padrão úteis:</p>\n<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">import</span> os, sys, math, random, datetime, re, json, collections\n<span class=\"t-chave\">from</span> pathlib <span class=\"t-chave\">import</span> Path\n\nrandom.<span class=\"t-fn\">randint</span>(<span class=\"t-num\">1</span>, <span class=\"t-num\">100</span>)\ndatetime.datetime.<span class=\"t-fn\">now</span>().<span class=\"t-fn\">strftime</span>(<span class=\"t-str\">\"%d/%m/%Y\"</span>)\nre.<span class=\"t-fn\">findall</span>(r<span class=\"t-str\">\"\\d+\"</span>, <span class=\"t-str\">\"abc123def456\"</span>)      <span class=\"t-com\"># ['123', '456']</span></code></pre></figure>","ancoras":[],"minutos":4},{"id":"a4-12","codigo":"4.12","titulo":"Recursos avançados","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\"># Decorador — envolve uma função para adicionar comportamento</span>\n<span class=\"t-chave\">import</span> time\n\n<span class=\"t-chave\">def</span> <span class=\"t-fn\">cronometrar</span>(funcao):\n    <span class=\"t-chave\">def</span> <span class=\"t-fn\">wrapper</span>(*args, **kwargs):\n        inicio = time.<span class=\"t-fn\">time</span>()\n        resultado = <span class=\"t-fn\">funcao</span>(*args, **kwargs)\n        <span class=\"t-fn\">print</span>(f<span class=\"t-str\">\"Levou {time.time() - inicio:.2f}s\"</span>)\n        <span class=\"t-chave\">return</span> resultado\n    <span class=\"t-chave\">return</span> wrapper\n\n@cronometrar\n<span class=\"t-chave\">def</span> <span class=\"t-fn\">tarefa_lenta</span>():\n    time.<span class=\"t-fn\">sleep</span>(<span class=\"t-num\">2</span>)\n\n<span class=\"t-com\"># Gerador — produz valores sob demanda, sem carregar tudo na memória</span>\n<span class=\"t-chave\">def</span> <span class=\"t-fn\">numeros_infinitos</span>():\n    n = <span class=\"t-num\">0</span>\n    <span class=\"t-chave\">while</span> <span class=\"t-chave\">True</span>:\n        <span class=\"t-chave\">yield</span> n\n        n += <span class=\"t-num\">1</span>\n\n<span class=\"t-com\"># lambda — função anônima curta</span>\ndobrar = <span class=\"t-chave\">lambda</span> x: x * <span class=\"t-num\">2</span>\npessoas.<span class=\"t-fn\">sort</span>(key=<span class=\"t-chave\">lambda</span> p: p[<span class=\"t-str\">\"idade\"</span>])</code></pre></figure>\n<p>Decoradores usam closures — o mesmo conceito que você viu em JavaScript. As linguagens conversam mais do que parece.</p>","ancoras":[],"minutos":4},{"id":"a4-13","codigo":"4.13","titulo":"Para onde Python leva","nivel":"Avançado","quando":"","html":"<p>Depois da base, escolha <strong>uma</strong> trilha, não três:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Trilha</th><th>Bibliotecas</th><th>Para quem quer</th></tr></thead><tbody><tr><td>Automação</td><td><code>openpyxl</code>, <code>selenium</code>, <code>schedule</code></td><td>Resolver problema de trabalho</td></tr><tr><td>Web / Back-end</td><td>Flask, Django, FastAPI</td><td>Vaga de back-end</td></tr><tr><td>Dados</td><td>pandas, numpy, matplotlib</td><td>Análise, BI</td></tr><tr><td>Web scraping</td><td>requests, BeautifulSoup</td><td>Coleta de dados</td></tr></tbody></table></div>\n<p>Se o objetivo é emprego somado ao que você já tem de front-end, <strong>FastAPI ou Flask</strong> é a escolha que te transforma em desenvolvedor full-stack — o perfil mais contratado em empresa pequena e média.</p>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[{"titulo":"CLI de gerenciamento","rotulo":"Projeto 1","resumo":"<p>Sistema de cadastro (produtos, contatos, o que quiser) rodando no terminal. Menu, criar/listar/editar/excluir, persistência em JSON, tratamento de erro em toda entrada do usuário.</p>","requisitos":[],"criterio":""},{"titulo":"Automação real","rotulo":"Projeto 2","resumo":"<p>Um script que resolve um problema que você tem de verdade. Ler várias planilhas e gerar um relatório consolidado, renomear arquivos em lote, extrair dados de um site. O critério é: você usar de novo depois de pronto.</p>","requisitos":[],"criterio":""},{"titulo":"API REST","rotulo":"Projeto 3","resumo":"<p>Com FastAPI ou Flask: endpoints de CRUD, banco SQLite, documentação automática. Depois <strong>conecte o front-end do Módulo 3 nessa API</strong>. Quando essas duas peças conversarem, você é full-stack.</p>\n<hr>","requisitos":[],"criterio":""}],"checklist":["Sei quando usar lista, tupla, dicionário e conjunto","Escrevo compreensão de lista com filtro","Leio e escrevo arquivos usando <code>with</code>","Capturo exceções específicas, não genéricas","Crio classe com herança e <code>__init__</code>","Uso ambiente virtual em todo projeto","Tenho uma API que meu front-end do Módulo 3 consome"],"quiz":[{"p":"Qual coleção do Python escolher para uma coordenada <code>(10, 20)</code> que não deve mudar?","o":["Lista","Tupla","Dicionário","Conjunto"],"c":1,"e":"A tupla é ordenada e <strong>imutável</strong> — <code>coordenada[0] = 5</code> dá erro. Lista é ordenada e mutável; dicionário guarda pares chave:valor; conjunto não tem ordem nem repetidos."},{"p":"Por que sempre abrir arquivos com <code>with open(...)</code>?","o":["Porque é mais rápido que <code>open()</code> puro","Porque só assim dá para definir o encoding","Porque fecha o arquivo automaticamente, mesmo se der erro no meio","Porque permite ler e escrever ao mesmo tempo"],"c":2,"e":"O <code>with</code> garante o fechamento aconteça o que acontecer. Sem ele, uma exceção no meio da leitura deixa o arquivo aberto."},{"p":"O que há de errado em capturar <code>except Exception</code> como regra?","o":["Nada — é a forma recomendada de ser defensivo","Esconde bugs e faz você caçar por horas um problema que o Python já tinha apontado","Só funciona no Python 2","Impede o uso de <code>finally</code>"],"c":1,"e":"Capture exceções específicas — <code>ValueError</code>, <code>ZeroDivisionError</code>. O genérico engole a mensagem que teria resolvido seu problema em cinco segundos."},{"p":"Como escrever <code>[n * 2 for n in numeros if n % 2 == 0]</code> em palavras?","o":["Dobre todos os números e depois filtre os pares","Para cada número par da lista, coloque o dobro dele na lista nova","Some os pares e multiplique por dois","Crie uma lista com os números pares até <code>n * 2</code>"],"c":1,"e":"Compreensão de lista lê-se de trás para frente: o <code>for</code> percorre, o <code>if</code> filtra, e a expressão da frente transforma cada item que passou."},{"p":"O que <code>pessoa.get(\"email\", \"n/a\")</code> faz se a chave não existir?","o":["Levanta <code>KeyError</code>","Devolve <code>None</code>","Devolve <code>\"n/a\"</code>","Cria a chave com valor vazio"],"c":2,"e":"O segundo argumento do <code>get</code> é o valor padrão. Já <code>pessoa[\"email\"]</code> levantaria <code>KeyError</code> — a diferença que evita metade dos travamentos em código que lê JSON."}]},{"num":5,"nome":"Java","id":"m5","dificuldade":3,"tempo":"10 a 12 semanas","prereq":"Módulos 0, 3 e 4","faixa":{"nome":"Praticante","cor":"f3"},"objetivo":"escrever software orientado a objetos com tipagem estática, e entrar no mercado corporativo — que no Brasil é onde está a maior parte das vagas de back-end.","intro":"<p>Java parece Python com burocracia. Nas primeiras semanas você vai reclamar de escrever cinco linhas para fazer o que o Python fazia em uma. Depois de um mês, quando um programa seu passar de dois mil linhas, você vai entender para que serve a burocracia: o compilador pega hoje o erro que o Python só te mostraria em produção, na terça-feira, às três da manhã.</p>\n<p>Esta é a terceira linguagem de sintaxe parecida que você vê — JavaScript, C e Java compartilham as chaves, o ponto e vírgula e o <code>for</code>. A novidade aqui não é a sintaxe, é a <strong>disciplina</strong>: tudo tem tipo declarado, tudo vive dentro de uma classe, e o compilador não deixa passar.</p>\n<p><strong>Sobre Java vir depois do Python e antes do C:</strong> Java é o degrau intermediário perfeito. Ele te obriga a declarar tipo (como C vai obrigar) mas continua limpando a memória por você (como Python faz). Quando você chegar no C, metade do choque já terá passado.</p>\n<p><strong>Ferramentas:</strong> instale o <a href=\"https://adoptium.net/\" target=\"_blank\" rel=\"noopener noreferrer\">JDK 21<span class=\"ext\" aria-hidden=\"true\">↗</span></a> (versão LTS, gratuita) e o <a href=\"https://www.jetbrains.com/idea/download/\" target=\"_blank\" rel=\"noopener noreferrer\">IntelliJ IDEA Community<span class=\"ext\" aria-hidden=\"true\">↗</span></a>. O IntelliJ é gratuito na versão Community e é o melhor ambiente de Java que existe — não tente aprender Java no bloco de notas.</p>\n<hr>","aulas":[{"id":"a5-1","codigo":"5.1","titulo":"Como um programa Java é montado","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">public</span> <span class=\"t-chave\">class</span> OlaMundo {\n    <span class=\"t-chave\">public</span> <span class=\"t-chave\">static</span> <span class=\"t-tipo\">void</span> <span class=\"t-fn\">main</span>(String[] args) {\n        System.out.<span class=\"t-fn\">println</span>(<span class=\"t-str\">\"Olá, mundo\"</span>);\n    }\n}</code></pre></figure>\n<p>Cinco linhas e sete palavras reservadas para imprimir um texto. Em Python seria uma linha. Vamos por partes, porque cada peça tem motivo:</p>\n<ul><li><code>public class OlaMundo</code> — <strong>tudo em Java vive dentro de uma classe.</strong> Não existe código solto como em Python. O arquivo tem que se chamar <code>OlaMundo.java</code>, com o mesmo nome da classe pública. Essa regra é do compilador, não é estilo.</li><li><code>public static void main(String[] args)</code> — o ponto de entrada. A JVM procura exatamente essa assinatura para saber por onde começar. <code>static</code> significa que roda sem precisar criar um objeto; <code>String[] args</code> recebe o que você digitou na linha de comando.</li><li><code>System.out.println(...)</code> — <code>System</code> é uma classe, <code>out</code> é a saída padrão, <code>println</code> imprime com quebra de linha.</li></ul>\n<p><strong>Como rodar:</strong></p>\n<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>javac OlaMundo.java     <span class=\"t-com\"># compila → gera OlaMundo.class (bytecode)</span>\njava OlaMundo           <span class=\"t-com\"># executa o bytecode na JVM</span></code></pre></figure>\n<p>Repare que são <strong>duas etapas</strong>, como no C. Mas o <code>javac</code> não gera código de máquina: gera <em>bytecode</em>, uma linguagem intermediária que a <strong>JVM</strong> (Java Virtual Machine) executa. É daí que vem o slogan antigo <em>\"escreva uma vez, rode em qualquer lugar\"</em> — o mesmo <code>.class</code> roda no Windows, no Linux e no Mac sem recompilar, porque cada sistema tem sua própria JVM.</p>\n<p><em>(Android é a exceção que confunde todo mundo: apesar de você escrever Java, o <code>.class</code> não roda lá. Ele passa por uma conversão a mais, para um formato chamado DEX, executado pelo ART — o runtime do Android, que não é uma JVM.)</em></p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Sigla</th><th>O que é</th></tr></thead><tbody><tr><td><strong>JDK</strong></td><td>O kit do desenvolvedor: compilador + ferramentas + tudo que executa. É o que você instala</td></tr><tr><td><strong>JRE</strong></td><td>Só o necessário para <em>executar</em> Java, sem compilador</td></tr><tr><td><strong>JVM</strong></td><td>A máquina virtual que roda o bytecode</td></tr></tbody></table></div>\n<p>Você instala o JDK e tem os três. O JRE separado existia até o Java 8 — hoje ninguém baixa mais isso, mas o nome ainda aparece em documentação antiga e em pergunta de prova.</p>","ancoras":[],"minutos":4},{"id":"a5-2","codigo":"5.2","titulo":"Tipos: primitivo contra objeto","nivel":"Básico","quando":"","html":"<p>Java tem <strong>dois mundos de tipos</strong>, e confundir os dois é a origem de uma classe inteira de bugs.</p>\n<p><strong>Primitivos</strong> — guardam o valor direto, começam com letra minúscula, nunca são nulos:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Tipo</th><th>Guarda</th><th>Tamanho</th><th>Exemplo</th></tr></thead><tbody><tr><td><code>int</code></td><td>Inteiro</td><td>32 bits</td><td><code>42</code></td></tr><tr><td><code>long</code></td><td>Inteiro grande</td><td>64 bits</td><td><code>42L</code></td></tr><tr><td><code>double</code></td><td>Decimal</td><td>64 bits</td><td><code>3.14</code></td></tr><tr><td><code>float</code></td><td>Decimal menor</td><td>32 bits</td><td><code>3.14f</code></td></tr><tr><td><code>boolean</code></td><td>Verdadeiro/falso</td><td>—</td><td><code>true</code></td></tr><tr><td><code>char</code></td><td>Um caractere</td><td>16 bits</td><td><code>'a'</code></td></tr><tr><td><code>byte</code></td><td>Inteiro minúsculo</td><td>8 bits</td><td><code>127</code></td></tr><tr><td><code>short</code></td><td>Inteiro pequeno</td><td>16 bits</td><td><code>32000</code></td></tr></tbody></table></div>\n<p><strong>Objetos</strong> — guardam uma referência, começam com maiúscula, podem ser <code>null</code>:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> idade = <span class=\"t-num\">25</span>;              <span class=\"t-com\">// primitivo</span>\nInteger idadeObj = <span class=\"t-num\">25</span>;       <span class=\"t-com\">// objeto (autoboxing converte sozinho)</span>\nString nome = <span class=\"t-str\">\"Maria\"</span>;       <span class=\"t-com\">// objeto</span></code></pre></figure>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> a = <span class=\"t-num\">10</span>;\n<span class=\"t-tipo\">double</span> b = a;          <span class=\"t-com\">// OK — cabe, converte sozinho (widening)</span>\n<span class=\"t-tipo\">int</span> c = (<span class=\"t-tipo\">int</span>) <span class=\"t-num\">3.99</span>;    <span class=\"t-com\">// 3 — precisa de cast, e TRUNCA, não arredonda</span></code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>Atenção nessa pegadinha:</strong> divisão entre inteiros descarta a parte decimal.</aside>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> resultado = <span class=\"t-num\">7</span> / <span class=\"t-num\">2</span>;          <span class=\"t-com\">// 3, não 3.5</span>\n<span class=\"t-tipo\">double</span> certo = <span class=\"t-num\">7</span> / <span class=\"t-num\">2</span>;           <span class=\"t-com\">// 3.0 — ainda errado! a conta rodou como int</span>\n<span class=\"t-tipo\">double</span> melhor = <span class=\"t-num\">7</span> / <span class=\"t-num\">2.0</span>;        <span class=\"t-com\">// 3.5 — agora sim</span></code></pre></figure>\n<p>A regra: se os dois lados são <code>int</code>, a conta é de <code>int</code>. Converter depois não recupera o que já se perdeu.</p>\n<aside class=\"destaque destaque-alerta\"><strong>A armadilha do overflow:</strong> <code>int</code> vai até 2.147.483.647. Passar disso não dá erro — ele dá a volta e vira negativo.</aside>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> max = Integer.MAX_VALUE;\nSystem.out.<span class=\"t-fn\">println</span>(max + <span class=\"t-num\">1</span>);    <span class=\"t-com\">// -2147483648</span></code></pre></figure>\n<p>Para dinheiro, nunca use <code>double</code> (ele erra centavos por ser binário). Use <code>BigDecimal</code>.</p>","ancoras":[],"minutos":4},{"id":"a5-3","codigo":"5.3","titulo":"String, e o erro mais famoso do Java","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>String nome = <span class=\"t-str\">\"Maria\"</span>;\nnome.<span class=\"t-fn\">length</span>();              <span class=\"t-com\">// 5</span>\nnome.<span class=\"t-fn\">toUpperCase</span>();         <span class=\"t-com\">// \"MARIA\"</span>\nnome.<span class=\"t-fn\">charAt</span>(<span class=\"t-num\">0</span>);             <span class=\"t-com\">// 'M'</span>\nnome.<span class=\"t-fn\">substring</span>(<span class=\"t-num\">0</span>, <span class=\"t-num\">3</span>);       <span class=\"t-com\">// \"Mar\"</span>\nnome.<span class=\"t-fn\">contains</span>(<span class=\"t-str\">\"ari\"</span>);       <span class=\"t-com\">// true</span>\nnome.<span class=\"t-fn\">replace</span>(<span class=\"t-str\">\"a\"</span>, <span class=\"t-str\">\"@\"</span>);     <span class=\"t-com\">// \"M@ri@\"</span>\nnome.<span class=\"t-fn\">trim</span>();                <span class=\"t-com\">// remove espaços das pontas</span>\nnome.<span class=\"t-fn\">split</span>(<span class=\"t-str\">\",\"</span>);            <span class=\"t-com\">// devolve String[]</span>\nString.<span class=\"t-fn\">join</span>(<span class=\"t-str\">\"-\"</span>, <span class=\"t-str\">\"a\"</span>, <span class=\"t-str\">\"b\"</span>); <span class=\"t-com\">// \"a-b\"</span></code></pre></figure>\n<p><strong>String em Java é imutável.</strong> Nenhum método acima muda <code>nome</code> — todos devolvem uma String nova. Isso pega muita gente:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>String s = <span class=\"t-str\">\"abc\"</span>;\ns.<span class=\"t-fn\">toUpperCase</span>();\nSystem.out.<span class=\"t-fn\">println</span>(s);       <span class=\"t-com\">// \"abc\" — você jogou o resultado fora</span>\ns = s.<span class=\"t-fn\">toUpperCase</span>();         <span class=\"t-com\">// agora sim</span></code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>O erro mais comum de todo iniciante em Java:</strong> comparar String com <code>==</code>.</aside>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>String a = <span class=\"t-chave\">new</span> <span class=\"t-fn\">String</span>(<span class=\"t-str\">\"oi\"</span>);\nString b = <span class=\"t-chave\">new</span> <span class=\"t-fn\">String</span>(<span class=\"t-str\">\"oi\"</span>);\n\na == b          <span class=\"t-com\">// false — são dois objetos diferentes na memória</span>\na.<span class=\"t-fn\">equals</span>(b)     <span class=\"t-com\">// true  — mesmo conteúdo</span></code></pre></figure>\n<p><code>==</code> em objetos pergunta <em>\"são o mesmo objeto?\"</em>. <code>.equals()</code> pergunta <em>\"têm o mesmo conteúdo?\"</em>. Para texto você quase sempre quer o segundo.</p>\n<p>O que confunde é que às vezes <code>==</code> parece funcionar:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>String x = <span class=\"t-str\">\"oi\"</span>;\nString y = <span class=\"t-str\">\"oi\"</span>;\nx == y          <span class=\"t-com\">// true — as duas apontam para a MESMA String do pool</span></code></pre></figure>\n<p>Java guarda literais num <em>pool</em> e reaproveita. Então <code>==</code> funciona por acidente com literais e quebra com <code>new</code> ou com texto vindo de entrada do usuário. <strong>Use <code>.equals()</code> sempre</strong>, e você nunca precisa pensar nisso.</p>\n<p>Para montar texto em laço, <code>+</code> é lento (cria uma String nova a cada volta). Use <code>StringBuilder</code>:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>StringBuilder sb = <span class=\"t-chave\">new</span> <span class=\"t-fn\">StringBuilder</span>();\n<span class=\"t-chave\">for</span> (<span class=\"t-tipo\">int</span> i = <span class=\"t-num\">0</span>; i &lt; <span class=\"t-num\">1000</span>; i++) {\n    sb.<span class=\"t-fn\">append</span>(i).<span class=\"t-fn\">append</span>(<span class=\"t-str\">\", \"</span>);\n}\nString resultado = sb.<span class=\"t-fn\">toString</span>();</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a5-4","codigo":"5.4","titulo":"Controle de fluxo","nivel":"Básico","quando":"","html":"<p>Igual ao que você já viu em C e JavaScript, com duas adições modernas:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">if</span> (idade &gt;= <span class=\"t-num\">18</span>) { } <span class=\"t-chave\">else</span> <span class=\"t-chave\">if</span> (idade &gt;= <span class=\"t-num\">16</span>) { } <span class=\"t-chave\">else</span> { }\n\nString status = idade &gt;= <span class=\"t-num\">18</span> ? <span class=\"t-str\">\"adulto\"</span> : <span class=\"t-str\">\"menor\"</span>;       <span class=\"t-com\">// ternário</span>\n\n<span class=\"t-chave\">for</span> (<span class=\"t-tipo\">int</span> i = <span class=\"t-num\">0</span>; i &lt; <span class=\"t-num\">5</span>; i++) { }\n\n<span class=\"t-tipo\">int</span>[] numeros = {<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>};\n<span class=\"t-chave\">for</span> (<span class=\"t-tipo\">int</span> n : numeros) { }          <span class=\"t-com\">// for-each: percorre sem índice</span>\n\n<span class=\"t-chave\">while</span> (condicao) { }\n<span class=\"t-chave\">do</span> { } <span class=\"t-chave\">while</span> (condicao);</code></pre></figure>\n<p><strong>Switch moderno</strong> (Java 14+) — sem <code>break</code>, sem cair no caso seguinte:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>String tipo = <span class=\"t-chave\">switch</span> (dia) {\n    <span class=\"t-chave\">case</span> <span class=\"t-str\">\"sábado\"</span>, <span class=\"t-str\">\"domingo\"</span> -&gt; <span class=\"t-str\">\"Fim de semana\"</span>;\n    <span class=\"t-chave\">case</span> <span class=\"t-str\">\"sexta\"</span> -&gt; <span class=\"t-str\">\"Quase lá\"</span>;\n    <span class=\"t-chave\">default</span> -&gt; <span class=\"t-str\">\"Dia útil\"</span>;\n};</code></pre></figure>\n<p>Compare com o switch antigo, onde esquecer o <code>break</code> fazia a execução escorrer para o próximo caso — bug clássico que a seta <code>-&gt;</code> eliminou de vez.</p>","ancoras":[],"minutos":4},{"id":"a5-5","codigo":"5.5","titulo":"Arrays e a classe Arrays","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span>[] numeros = <span class=\"t-chave\">new</span> <span class=\"t-tipo\">int</span>[<span class=\"t-num\">5</span>];              <span class=\"t-com\">// 5 posições, tudo zero</span>\n<span class=\"t-tipo\">int</span>[] notas = {<span class=\"t-num\">7</span>, <span class=\"t-num\">8</span>, <span class=\"t-num\">9</span>, <span class=\"t-num\">10</span>};             <span class=\"t-com\">// criado já com valores</span>\n\nnotas[<span class=\"t-num\">0</span>];              <span class=\"t-com\">// 7</span>\nnotas.length;          <span class=\"t-com\">// 4  — atributo, não método! (String usa length())</span></code></pre></figure>\n<p>Array em Java tem <strong>tamanho fixo</strong>, decidido na criação. Precisa crescer? Use <code>ArrayList</code>, na Aula 5.8.</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">import</span> java.util.Arrays;\n\nArrays.<span class=\"t-fn\">sort</span>(notas);                      <span class=\"t-com\">// ordena no lugar</span>\nArrays.<span class=\"t-fn\">toString</span>(notas);                  <span class=\"t-com\">// \"[7, 8, 9, 10]\" — para imprimir</span>\nArrays.<span class=\"t-fn\">fill</span>(numeros, <span class=\"t-num\">1</span>);                 <span class=\"t-com\">// preenche tudo com 1</span>\nArrays.<span class=\"t-fn\">copyOf</span>(notas, <span class=\"t-num\">6</span>);                 <span class=\"t-com\">// copia com tamanho novo</span></code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>Atenção nessa pegadinha:</strong> imprimir array direto não mostra o conteúdo.</aside>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>System.out.<span class=\"t-fn\">println</span>(notas);               <span class=\"t-com\">// [I@1b6d3586  — o endereço</span>\nSystem.out.<span class=\"t-fn\">println</span>(Arrays.<span class=\"t-fn\">toString</span>(notas)); <span class=\"t-com\">// [7, 8, 9, 10]</span></code></pre></figure>\n<hr>","ancoras":[],"minutos":4},{"id":"a5-6","codigo":"5.6","titulo":"Classes e os quatro pilares","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">public</span> <span class=\"t-chave\">class</span> ContaBancaria {\n\n    <span class=\"t-chave\">private</span> String titular;        <span class=\"t-com\">// encapsulamento: ninguém mexe direto</span>\n    <span class=\"t-chave\">private</span> <span class=\"t-tipo\">double</span> saldo;\n\n    <span class=\"t-chave\">public</span> <span class=\"t-fn\">ContaBancaria</span>(String titular, <span class=\"t-tipo\">double</span> saldoInicial) {   <span class=\"t-com\">// construtor</span>\n        <span class=\"t-chave\">this</span>.titular = titular;\n        <span class=\"t-chave\">this</span>.saldo = saldoInicial;\n    }\n\n    <span class=\"t-chave\">public</span> <span class=\"t-tipo\">void</span> <span class=\"t-fn\">depositar</span>(<span class=\"t-tipo\">double</span> valor) {\n        <span class=\"t-chave\">if</span> (valor &lt;= <span class=\"t-num\">0</span>) {\n            <span class=\"t-chave\">throw</span> <span class=\"t-chave\">new</span> <span class=\"t-fn\">IllegalArgumentException</span>(<span class=\"t-str\">\"Valor deve ser positivo\"</span>);\n        }\n        <span class=\"t-chave\">this</span>.saldo += valor;\n    }\n\n    <span class=\"t-chave\">public</span> <span class=\"t-tipo\">boolean</span> <span class=\"t-fn\">sacar</span>(<span class=\"t-tipo\">double</span> valor) {\n        <span class=\"t-chave\">if</span> (valor &gt; saldo) <span class=\"t-chave\">return</span> <span class=\"t-chave\">false</span>;\n        saldo -= valor;\n        <span class=\"t-chave\">return</span> <span class=\"t-chave\">true</span>;\n    }\n\n    <span class=\"t-chave\">public</span> <span class=\"t-tipo\">double</span> <span class=\"t-fn\">getSaldo</span>() {     <span class=\"t-com\">// getter</span>\n        <span class=\"t-chave\">return</span> saldo;\n    }\n}</code></pre></figure>\n<p>Usando:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>ContaBancaria conta = <span class=\"t-chave\">new</span> <span class=\"t-fn\">ContaBancaria</span>(<span class=\"t-str\">\"Ana\"</span>, <span class=\"t-num\">100.0</span>);\nconta.<span class=\"t-fn\">depositar</span>(<span class=\"t-num\">50</span>);\nconta.<span class=\"t-fn\">getSaldo</span>();        <span class=\"t-com\">// 150.0</span>\nconta.saldo;             <span class=\"t-com\">// ERRO de compilação — é private</span></code></pre></figure>\n<p><strong>Os quatro pilares</strong>, que caem em toda entrevista:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Pilar</th><th>O que é</th><th>No exemplo acima</th></tr></thead><tbody><tr><td><strong>Encapsulamento</strong></td><td>Esconder o estado interno atrás de métodos</td><td><code>saldo</code> é <code>private</code>, só muda por <code>depositar</code>/<code>sacar</code></td></tr><tr><td><strong>Herança</strong></td><td>Uma classe aproveitar outra</td><td><code>ContaPoupanca extends ContaBancaria</code></td></tr><tr><td><strong>Polimorfismo</strong></td><td>O mesmo método se comportar diferente</td><td><code>sacar</code> exigindo saldo mínimo na poupança (Aula 5.7)</td></tr><tr><td><strong>Abstração</strong></td><td>Expor o que faz, esconder como faz</td><td>Quem usa não sabe se o saldo é <code>double</code> ou <code>BigDecimal</code></td></tr></tbody></table></div>\n<aside class=\"destaque destaque-regra\"><strong>Regra do encapsulamento:</strong> atributo é <code>private</code> por padrão. Só abra o que precisa, e abra por método — assim você pode validar, como o <code>depositar</code> faz ao recusar valor negativo.</aside>\n<aside class=\"destaque destaque-alerta\"><strong>Cuidado ao copiar este exemplo:</strong> o <code>saldo</code> aqui é <code>double</code> para o código caber na tela, mas na Aula 5.2 eu disse para nunca usar <code>double</code> com dinheiro — e continua valendo. Conta de verdade usa <code>BigDecimal</code>, que é mais verboso (<code>saldo.add(valor)</code> em vez de <code>saldo += valor</code>) e por isso atrapalharia a explicação de encapsulamento. Guarde a diferença: aqui o assunto é orientação a objetos, não precisão decimal.</aside>","ancoras":[],"minutos":4},{"id":"a5-7","codigo":"5.7","titulo":"Herança, interfaces e polimorfismo","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">public</span> <span class=\"t-chave\">class</span> ContaPoupanca <span class=\"t-chave\">extends</span> ContaBancaria {\n\n    <span class=\"t-chave\">private</span> <span class=\"t-tipo\">double</span> taxaJuros;\n\n    <span class=\"t-chave\">public</span> <span class=\"t-fn\">ContaPoupanca</span>(String titular, <span class=\"t-tipo\">double</span> saldo, <span class=\"t-tipo\">double</span> taxa) {\n        <span class=\"t-chave\">super</span>(titular, saldo);          <span class=\"t-com\">// chama o construtor do pai</span>\n        <span class=\"t-chave\">this</span>.taxaJuros = taxa;\n    }\n\n    @Override\n    <span class=\"t-chave\">public</span> <span class=\"t-tipo\">boolean</span> <span class=\"t-fn\">sacar</span>(<span class=\"t-tipo\">double</span> valor) {     <span class=\"t-com\">// sobrescreve o do pai</span>\n        <span class=\"t-chave\">if</span> (valor &gt; <span class=\"t-fn\">getSaldo</span>() - <span class=\"t-num\">10</span>) <span class=\"t-chave\">return</span> <span class=\"t-chave\">false</span>;   <span class=\"t-com\">// guarda saldo mínimo</span>\n        <span class=\"t-chave\">return</span> <span class=\"t-chave\">super</span>.<span class=\"t-fn\">sacar</span>(valor);\n    }\n}</code></pre></figure>\n<p>A anotação <code>@Override</code> não é obrigatória, mas <strong>use sempre</strong>: ela faz o compilador conferir que você realmente está sobrescrevendo algo. Sem ela, um erro de digitação no nome do método cria um método novo silenciosamente, e você passa a tarde procurando por que o comportamento não mudou.</p>\n<p><strong>Interface</strong> — um contrato, sem implementação:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">public</span> <span class=\"t-chave\">interface</span> Tributavel {\n    <span class=\"t-tipo\">double</span> <span class=\"t-fn\">calcularImposto</span>();          <span class=\"t-com\">// só a assinatura</span>\n}\n\n<span class=\"t-chave\">public</span> <span class=\"t-chave\">class</span> ContaPoupanca <span class=\"t-chave\">extends</span> ContaBancaria <span class=\"t-chave\">implements</span> Tributavel {\n    @Override\n    <span class=\"t-chave\">public</span> <span class=\"t-tipo\">double</span> <span class=\"t-fn\">calcularImposto</span>() {\n        <span class=\"t-chave\">return</span> <span class=\"t-fn\">getSaldo</span>() * <span class=\"t-num\">0.005</span>;\n    }\n}</code></pre></figure>\n<p><strong>Herança contra interface — quando usar cada uma:</strong></p>\n<ul><li>Herança responde <em>\"é um tipo de\"</em>. Poupança <strong>é uma</strong> conta.</li><li>Interface responde <em>\"consegue fazer\"</em>. Poupança <strong>consegue</strong> ser tributada.</li></ul>\n<p>Java só permite <strong>herdar de uma classe</strong>, mas <strong>implementar quantas interfaces quiser</strong>. Na dúvida, prefira interface — herança amarra sua classe a uma hierarquia que é difícil de desfazer depois.</p>\n<p><strong>Polimorfismo na prática</strong> — o poder de verdade disso:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>List&lt;ContaBancaria&gt; contas = List.<span class=\"t-fn\">of</span>(\n    <span class=\"t-chave\">new</span> <span class=\"t-fn\">ContaBancaria</span>(<span class=\"t-str\">\"Ana\"</span>, <span class=\"t-num\">100</span>),\n    <span class=\"t-chave\">new</span> <span class=\"t-fn\">ContaPoupanca</span>(<span class=\"t-str\">\"João\"</span>, <span class=\"t-num\">200</span>, <span class=\"t-num\">0.01</span>)\n);\n\n<span class=\"t-chave\">for</span> (ContaBancaria c : contas) {\n    c.<span class=\"t-fn\">sacar</span>(<span class=\"t-num\">50</span>);        <span class=\"t-com\">// cada uma usa a SUA versão de sacar</span>\n}</code></pre></figure>\n<p>O laço não sabe nem se importa com qual tipo concreto está tratando. Adicionar <code>ContaSalario</code> amanhã não muda uma linha aqui.</p>\n<p><strong>Classe abstrata</strong> fica no meio do caminho: tem código pronto <em>e</em> buracos a preencher.</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">public</span> <span class=\"t-chave\">abstract</span> <span class=\"t-chave\">class</span> Funcionario {\n\n    <span class=\"t-chave\">private</span> <span class=\"t-chave\">final</span> String matricula;\n\n    <span class=\"t-chave\">protected</span> <span class=\"t-fn\">Funcionario</span>(String matricula) {\n        <span class=\"t-chave\">this</span>.matricula = matricula;\n    }\n\n    <span class=\"t-chave\">public</span> <span class=\"t-chave\">abstract</span> <span class=\"t-tipo\">double</span> <span class=\"t-fn\">calcularSalario</span>();   <span class=\"t-com\">// filho é obrigado a escrever</span>\n\n    <span class=\"t-chave\">public</span> String <span class=\"t-fn\">cracha</span>() {                    <span class=\"t-com\">// já vem pronto</span>\n        <span class=\"t-chave\">return</span> <span class=\"t-str\">\"FUNC-\"</span> + matricula;\n    }\n}</code></pre></figure>\n<p>Não dá para fazer <code>new Funcionario()</code> — ela existe só para ser herdada.</p>","ancoras":[],"minutos":4},{"id":"a5-8","codigo":"5.8","titulo":"Collections: List, Set e Map","nivel":"Intermediário","quando":"","html":"<p>É aqui que Java fica produtivo. Esqueça arrays de tamanho fixo.</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">import</span> java.util.*;\n\n<span class=\"t-com\">// LIST — ordenada, aceita repetidos, cresce sozinha</span>\nList&lt;String&gt; nomes = <span class=\"t-chave\">new</span> ArrayList&lt;&gt;();\nnomes.<span class=\"t-fn\">add</span>(<span class=\"t-str\">\"Ana\"</span>);\nnomes.<span class=\"t-fn\">add</span>(<span class=\"t-str\">\"João\"</span>);\nnomes.<span class=\"t-fn\">get</span>(<span class=\"t-num\">0</span>);              <span class=\"t-com\">// \"Ana\"</span>\nnomes.<span class=\"t-fn\">size</span>();              <span class=\"t-com\">// 2  (array usa .length, lista usa .size())</span>\nnomes.<span class=\"t-fn\">remove</span>(<span class=\"t-str\">\"Ana\"</span>);\nnomes.<span class=\"t-fn\">contains</span>(<span class=\"t-str\">\"João\"</span>);    <span class=\"t-com\">// true</span>\n\n<span class=\"t-com\">// SET — sem repetidos, sem ordem garantida</span>\nSet&lt;String&gt; unicos = <span class=\"t-chave\">new</span> HashSet&lt;&gt;();\nunicos.<span class=\"t-fn\">add</span>(<span class=\"t-str\">\"Ana\"</span>);\nunicos.<span class=\"t-fn\">add</span>(<span class=\"t-str\">\"Ana\"</span>);         <span class=\"t-com\">// ignorado</span>\nunicos.<span class=\"t-fn\">size</span>();             <span class=\"t-com\">// 1</span>\n\n<span class=\"t-com\">// MAP — pares chave:valor</span>\nMap&lt;String, Integer&gt; idades = <span class=\"t-chave\">new</span> HashMap&lt;&gt;();\nidades.<span class=\"t-fn\">put</span>(<span class=\"t-str\">\"Ana\"</span>, <span class=\"t-num\">30</span>);\nidades.<span class=\"t-fn\">get</span>(<span class=\"t-str\">\"Ana\"</span>);                    <span class=\"t-com\">// 30</span>\nidades.<span class=\"t-fn\">get</span>(<span class=\"t-str\">\"Zé\"</span>);                     <span class=\"t-com\">// null</span>\nidades.<span class=\"t-fn\">getOrDefault</span>(<span class=\"t-str\">\"Zé\"</span>, <span class=\"t-num\">0</span>);         <span class=\"t-com\">// 0 — mais seguro</span>\nidades.<span class=\"t-fn\">containsKey</span>(<span class=\"t-str\">\"Ana\"</span>);            <span class=\"t-com\">// true</span>\n\n<span class=\"t-chave\">for</span> (Map.Entry&lt;String, Integer&gt; e : idades.<span class=\"t-fn\">entrySet</span>()) {\n    System.out.<span class=\"t-fn\">println</span>(e.<span class=\"t-fn\">getKey</span>() + <span class=\"t-str\">\": \"</span> + e.<span class=\"t-fn\">getValue</span>());\n}</code></pre></figure>\n<p><strong>Qual escolher:</strong></p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Preciso de</th><th>Use</th></tr></thead><tbody><tr><td>Lista ordenada, com repetidos</td><td><code>ArrayList</code></td></tr><tr><td>Muita inserção/remoção no meio</td><td><code>LinkedList</code></td></tr><tr><td>Garantir que não há repetidos</td><td><code>HashSet</code></td></tr><tr><td>Sem repetidos, mantendo ordem de inserção</td><td><code>LinkedHashSet</code></td></tr><tr><td>Busca por chave</td><td><code>HashMap</code></td></tr><tr><td>Busca por chave, ordenado por chave</td><td><code>TreeMap</code></td></tr></tbody></table></div>\n<aside class=\"destaque destaque-alerta\"><strong>A pegadinha que derruba gente experiente:</strong> se você usa seus próprios objetos como chave de <code>HashMap</code> ou dentro de <code>HashSet</code>, precisa sobrescrever <code>equals()</code> <strong>e</strong> <code>hashCode()</code> — os dois, sempre juntos.</aside>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>Set&lt;Pessoa&gt; pessoas = <span class=\"t-chave\">new</span> HashSet&lt;&gt;();\npessoas.<span class=\"t-fn\">add</span>(<span class=\"t-chave\">new</span> <span class=\"t-fn\">Pessoa</span>(<span class=\"t-str\">\"Ana\"</span>));\npessoas.<span class=\"t-fn\">add</span>(<span class=\"t-chave\">new</span> <span class=\"t-fn\">Pessoa</span>(<span class=\"t-str\">\"Ana\"</span>));\npessoas.<span class=\"t-fn\">size</span>();      <span class=\"t-com\">// 2! sem equals/hashCode, são objetos diferentes</span></code></pre></figure>\n<p>Sem isso, o <code>HashSet</code> usa a identidade do objeto e sua deduplicação simplesmente não acontece. O IntelliJ gera os dois métodos com <code>Alt+Insert</code> — mas entenda o porquê antes de gerar.</p>","ancoras":[],"minutos":4},{"id":"a5-9","codigo":"5.9","titulo":"Exceções","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> divisor = <span class=\"t-num\">0</span>;\n\n<span class=\"t-chave\">try</span> {\n    <span class=\"t-tipo\">int</span> resultado = <span class=\"t-num\">10</span> / divisor;       <span class=\"t-com\">// lança ArithmeticException</span>\n    System.out.<span class=\"t-fn\">println</span>(resultado);      <span class=\"t-com\">// nunca chega aqui</span>\n\n} <span class=\"t-chave\">catch</span> (ArithmeticException e) {\n    System.out.<span class=\"t-fn\">println</span>(<span class=\"t-str\">\"Divisão por zero\"</span>);\n\n} <span class=\"t-chave\">catch</span> (NullPointerException e) {      <span class=\"t-com\">// outro tipo, outro tratamento</span>\n    System.out.<span class=\"t-fn\">println</span>(<span class=\"t-str\">\"Objeto nulo: \"</span> + e.<span class=\"t-fn\">getMessage</span>());\n\n} <span class=\"t-chave\">finally</span> {\n    System.out.<span class=\"t-fn\">println</span>(<span class=\"t-str\">\"Sempre executa\"</span>);\n}</code></pre></figure>\n<p>Você pode empilhar quantos <code>catch</code> quiser — o primeiro cujo tipo bater é o que roda, e os outros são ignorados. Como aqui a divisão estoura logo na primeira linha, o resto do <code>try</code> nem é executado: exceção interrompe o bloco na hora.</p>\n<p>Java divide exceções em duas famílias, e essa divisão não existe em Python nem em JavaScript:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Família</th><th>Quem é</th><th>O compilador obriga a tratar?</th></tr></thead><tbody><tr><td><strong>Checked</strong></td><td><code>IOException</code>, <code>SQLException</code></td><td><strong>Sim</strong> — ou trata, ou declara <code>throws</code></td></tr><tr><td><strong>Unchecked</strong></td><td><code>NullPointerException</code>, <code>IllegalArgumentException</code></td><td>Não</td></tr></tbody></table></div>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Checked: o compilador NÃO deixa compilar sem tratar</span>\n<span class=\"t-chave\">public</span> <span class=\"t-tipo\">void</span> <span class=\"t-fn\">lerArquivo</span>() <span class=\"t-chave\">throws</span> IOException {\n    Files.<span class=\"t-fn\">readString</span>(Path.<span class=\"t-fn\">of</span>(<span class=\"t-str\">\"dados.txt\"</span>));\n}</code></pre></figure>\n<aside class=\"destaque destaque-regra\"><strong>Regra:</strong> capture exceções específicas, nunca <code>catch (Exception e)</code> genérico. O genérico engole a informação que resolveria seu problema em cinco segundos.</aside>\n<p><strong><code>try-with-resources</code></strong> fecha o que precisa ser fechado, mesmo se der erro — é o <code>with</code> do Python:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">try</span> (BufferedReader br = Files.<span class=\"t-fn\">newBufferedReader</span>(Path.<span class=\"t-fn\">of</span>(<span class=\"t-str\">\"dados.txt\"</span>))) {\n    System.out.<span class=\"t-fn\">println</span>(br.<span class=\"t-fn\">readLine</span>());\n}   <span class=\"t-com\">// fecha sozinho, aconteça o que acontecer</span></code></pre></figure>\n<p><strong>Sobre o NullPointerException:</strong> é o erro mais comum do Java, e a causa é sempre a mesma — você chamou um método em algo que era <code>null</code>. A Aula 5.12 mostra o <code>Optional</code>, que é a resposta moderna para isso.</p>","ancoras":[],"minutos":4},{"id":"a5-10","codigo":"5.10","titulo":"Generics","nivel":"Intermediário","quando":"","html":"<p>O <code>&lt;String&gt;</code> que você viu em <code>List&lt;String&gt;</code> é um <strong>generic</strong>: ele diz ao compilador que tipo vive dentro daquela coleção.</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>List&lt;String&gt; nomes = <span class=\"t-chave\">new</span> ArrayList&lt;&gt;();\nnomes.<span class=\"t-fn\">add</span>(<span class=\"t-str\">\"Ana\"</span>);\nnomes.<span class=\"t-fn\">add</span>(<span class=\"t-num\">42</span>);            <span class=\"t-com\">// ERRO de compilação — e ainda bem</span>\n\nString primeiro = nomes.<span class=\"t-fn\">get</span>(<span class=\"t-num\">0</span>);      <span class=\"t-com\">// sem cast, o compilador já sabe</span></code></pre></figure>\n<p>Generics chegaram no <strong>Java 5</strong>. Antes deles tudo era <code>Object</code> e você fazia cast na mão — e descobria o erro só ao rodar. O generic move esse erro para a compilação, que é onde erro é barato.</p>\n<p>Escrevendo o seu:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">public</span> <span class=\"t-chave\">class</span> Caixa&lt;T&gt; {\n    <span class=\"t-chave\">private</span> T conteudo;\n\n    <span class=\"t-chave\">public</span> <span class=\"t-tipo\">void</span> <span class=\"t-fn\">guardar</span>(T item) { <span class=\"t-chave\">this</span>.conteudo = item; }\n    <span class=\"t-chave\">public</span> T <span class=\"t-fn\">pegar</span>() { <span class=\"t-chave\">return</span> conteudo; }\n}\n\nCaixa&lt;String&gt; caixaTexto = <span class=\"t-chave\">new</span> Caixa&lt;&gt;();\ncaixaTexto.<span class=\"t-fn\">guardar</span>(<span class=\"t-str\">\"oi\"</span>);\nString s = caixaTexto.<span class=\"t-fn\">pegar</span>();     <span class=\"t-com\">// sem cast</span></code></pre></figure>\n<p><code>T</code> é só um nome convencional para \"algum tipo\". Você vai ver <code>E</code> (element), <code>K</code> (key) e <code>V</code> (value) pelas mesmas razões.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a5-11","codigo":"5.11","titulo":"Lambdas e Streams","nivel":"Avançado","quando":"","html":"<p>Este é o Java moderno, e é o que separa código de 2010 de código de hoje.</p>\n<p><strong>Lambda</strong> é uma função anônima curta — o mesmo conceito da arrow function do JavaScript:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Antes</span>\nCollections.<span class=\"t-fn\">sort</span>(nomes, <span class=\"t-chave\">new</span> Comparator&lt;String&gt;() {\n    <span class=\"t-chave\">public</span> <span class=\"t-tipo\">int</span> <span class=\"t-fn\">compare</span>(String a, String b) { <span class=\"t-chave\">return</span> a.<span class=\"t-fn\">compareTo</span>(b); }\n});\n\n<span class=\"t-com\">// Com lambda</span>\nnomes.<span class=\"t-fn\">sort</span>((a, b) -&gt; a.<span class=\"t-fn\">compareTo</span>(b));\n\n<span class=\"t-com\">// Melhor ainda</span>\nnomes.<span class=\"t-fn\">sort</span>(Comparator.<span class=\"t-fn\">naturalOrder</span>());</code></pre></figure>\n<p><strong>Stream</strong> é um encadeamento de operações sobre uma coleção — o <code>map</code>/<code>filter</code>/<code>reduce</code> que você já usou em JavaScript:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>List&lt;Produto&gt; produtos = List.<span class=\"t-fn\">of</span>(\n    <span class=\"t-chave\">new</span> <span class=\"t-fn\">Produto</span>(<span class=\"t-str\">\"Camisa\"</span>, <span class=\"t-str\">\"Roupa\"</span>, <span class=\"t-num\">50</span>, <span class=\"t-num\">3</span>),\n    <span class=\"t-chave\">new</span> <span class=\"t-fn\">Produto</span>(<span class=\"t-str\">\"Calça\"</span>, <span class=\"t-str\">\"Roupa\"</span>, <span class=\"t-num\">120</span>, <span class=\"t-num\">0</span>),\n    <span class=\"t-chave\">new</span> <span class=\"t-fn\">Produto</span>(<span class=\"t-str\">\"Boné\"</span>, <span class=\"t-str\">\"Acessório\"</span>, <span class=\"t-num\">30</span>, <span class=\"t-num\">7</span>)\n);\n\n<span class=\"t-tipo\">double</span> total = produtos.<span class=\"t-fn\">stream</span>()\n    .<span class=\"t-fn\">filter</span>(p -&gt; p.<span class=\"t-fn\">estoque</span>() &gt; <span class=\"t-num\">0</span>)\n    .<span class=\"t-fn\">mapToDouble</span>(p -&gt; p.<span class=\"t-fn\">preco</span>() * p.<span class=\"t-fn\">estoque</span>())\n    .<span class=\"t-fn\">sum</span>();</code></pre></figure>\n<p><em>(<code>Produto</code> aqui é um <strong>record</strong>, e por isso os acessos são <code>p.preco()</code> e não <code>p.getPreco()</code>. A Aula 5.12 mostra o que é — por ora, leia como uma classe de dados.)</em></p>\n<p>Lê-se de cima para baixo, exatamente como o encadeamento que você escreveu em JavaScript no Módulo 3. As linguagens conversam mais do que parece.</p>\n<p>Operações que você vai usar toda semana:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>lista.<span class=\"t-fn\">stream</span>()\n    .<span class=\"t-fn\">filter</span>(x -&gt; x &gt; <span class=\"t-num\">10</span>)           <span class=\"t-com\">// mantém quem passa</span>\n    .<span class=\"t-fn\">map</span>(x -&gt; x * <span class=\"t-num\">2</span>)               <span class=\"t-com\">// transforma cada item</span>\n    .<span class=\"t-fn\">sorted</span>()                      <span class=\"t-com\">// ordena</span>\n    .<span class=\"t-fn\">distinct</span>()                    <span class=\"t-com\">// remove repetidos</span>\n    .<span class=\"t-fn\">limit</span>(<span class=\"t-num\">5</span>)                      <span class=\"t-com\">// pega os 5 primeiros</span>\n    .<span class=\"t-fn\">toList</span>();                     <span class=\"t-com\">// devolve List</span>\n\nprodutos.<span class=\"t-fn\">stream</span>().<span class=\"t-fn\">anyMatch</span>(p -&gt; p.<span class=\"t-fn\">preco</span>() &gt; <span class=\"t-num\">100</span>);    <span class=\"t-com\">// algum?</span>\nprodutos.<span class=\"t-fn\">stream</span>().<span class=\"t-fn\">allMatch</span>(p -&gt; p.<span class=\"t-fn\">preco</span>() &gt; <span class=\"t-num\">10</span>);     <span class=\"t-com\">// todos?</span>\nprodutos.<span class=\"t-fn\">stream</span>().<span class=\"t-fn\">findFirst</span>();                        <span class=\"t-com\">// o primeiro (Optional)</span>\n\nMap&lt;String, List&lt;Produto&gt;&gt; porCategoria = produtos.<span class=\"t-fn\">stream</span>()\n    .<span class=\"t-fn\">collect</span>(Collectors.<span class=\"t-fn\">groupingBy</span>(Produto::categoria));</code></pre></figure>\n<p>O <code>Produto::categoria</code> é <strong>method reference</strong> — açúcar para <code>p -&gt; p.categoria()</code>.</p>\n<aside class=\"destaque destaque-alerta\"><strong>A pegadinha do stream:</strong> ele é <em>preguiçoso</em> e de <em>uso único</em>.</aside>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>Stream&lt;String&gt; s = nomes.<span class=\"t-fn\">stream</span>();\ns.<span class=\"t-fn\">filter</span>(n -&gt; n.<span class=\"t-fn\">length</span>() &gt; <span class=\"t-num\">3</span>);       <span class=\"t-com\">// não roda nada! falta operação final</span>\ns.<span class=\"t-fn\">toList</span>();                          <span class=\"t-com\">// IllegalStateException — já foi consumido</span></code></pre></figure>\n<p>Nada acontece até chegar uma operação terminal (<code>toList</code>, <code>sum</code>, <code>forEach</code>, <code>collect</code>). E depois que ela roda, aquele stream morreu — crie outro a partir da coleção.</p>\n<p><em>(O <code>.toList()</code> direto no stream existe a partir do Java 16. Em código mais antigo você vai ver <code>.collect(Collectors.toList())</code>, que faz o mesmo.)</em></p>","ancoras":[],"minutos":4},{"id":"a5-12","codigo":"5.12","titulo":"Records e Optional","nivel":"Avançado","quando":"","html":"<p><strong>Record</strong> (Java 16+) — uma classe que só carrega dados, em uma linha:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">public</span> <span class=\"t-chave\">record</span> <span class=\"t-fn\">Produto</span>(String nome, String categoria, <span class=\"t-tipo\">double</span> preco, <span class=\"t-tipo\">int</span> estoque) { }</code></pre></figure>\n<p>Isso já te dá construtor, acessos (<code>p.nome()</code>), <code>equals()</code>, <code>hashCode()</code> e <code>toString()</code> prontos e corretos. As trinta linhas de cerimônia que davam fama ruim ao Java sumiram.</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>Produto p = <span class=\"t-chave\">new</span> <span class=\"t-fn\">Produto</span>(<span class=\"t-str\">\"Camisa\"</span>, <span class=\"t-str\">\"Roupa\"</span>, <span class=\"t-num\">50</span>, <span class=\"t-num\">3</span>);\np.<span class=\"t-fn\">nome</span>();                 <span class=\"t-com\">// \"Camisa\"</span>\np.<span class=\"t-fn\">equals</span>(outro);          <span class=\"t-com\">// compara por conteúdo, de graça</span></code></pre></figure>\n<p>Repare que o acesso é <code>p.nome()</code>, sem o <code>get</code> na frente — record não segue a convenção de <em>getter</em> das classes comuns.</p>\n<p>Use record para tudo que for dado imutável — resposta de API, linha de banco, valor de configuração.</p>\n<p><strong>Optional</strong> — a resposta ao NullPointerException:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>Optional&lt;Usuario&gt; achado = repositorio.<span class=\"t-fn\">buscarPorEmail</span>(<span class=\"t-str\">\"a@b.com\"</span>);\n\nachado.<span class=\"t-fn\">isPresent</span>();                          <span class=\"t-com\">// tem alguém?</span>\nachado.<span class=\"t-fn\">orElse</span>(<span class=\"t-chave\">new</span> <span class=\"t-fn\">Usuario</span>(<span class=\"t-str\">\"visitante\"</span>));     <span class=\"t-com\">// valor padrão</span>\nachado.<span class=\"t-fn\">orElseThrow</span>();                        <span class=\"t-com\">// ou explode com mensagem clara</span>\nachado.<span class=\"t-fn\">map</span>(Usuario::nome).<span class=\"t-fn\">orElse</span>(<span class=\"t-str\">\"anônimo\"</span>); <span class=\"t-com\">// encadeia com segurança</span></code></pre></figure>\n<p><code>Optional</code> obriga quem chama a <strong>encarar a possibilidade da ausência</strong>, em vez de descobrir na marra com um NPE.</p>\n<aside class=\"destaque destaque-regra\"><strong>Regra:</strong> use <code>Optional</code> como <strong>retorno</strong> de método. Não use como atributo de classe nem como parâmetro — nesses lugares ele só adiciona ruído.</aside>","ancoras":[],"minutos":4},{"id":"a5-13","codigo":"5.13","titulo":"Maven, testes e o ecossistema","nivel":"Avançado","quando":"","html":"<p>Nenhum projeto Java real é compilado na mão. <strong>Maven</strong> cuida das dependências e do build:</p>\n<figure class=\"cod\" data-lang=\"xml\"><figcaption>XML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">dependency</span>&gt;\n    &lt;<span class=\"t-tag\">groupId</span>&gt;org.junit.jupiter&lt;/<span class=\"t-tag\">groupId</span>&gt;\n    &lt;<span class=\"t-tag\">artifactId</span>&gt;junit-jupiter&lt;/<span class=\"t-tag\">artifactId</span>&gt;\n    &lt;<span class=\"t-tag\">version</span>&gt;5.10.0&lt;/<span class=\"t-tag\">version</span>&gt;\n    &lt;<span class=\"t-tag\">scope</span>&gt;test&lt;/<span class=\"t-tag\">scope</span>&gt;\n&lt;/<span class=\"t-tag\">dependency</span>&gt;</code></pre></figure>\n<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>mvn clean install     <span class=\"t-com\"># baixa dependências, compila, roda testes, empacota</span>\nmvn test              <span class=\"t-com\"># só os testes</span></code></pre></figure>\n<p><strong>Teste com JUnit</strong> — e aqui o Java é referência, o ferramental é dos melhores que existem:</p>\n<figure class=\"cod\" data-lang=\"java\"><figcaption>Java<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">import</span> org.junit.jupiter.api.Test;\n<span class=\"t-chave\">import</span> <span class=\"t-chave\">static</span> org.junit.jupiter.api.Assertions.*;\n\n<span class=\"t-chave\">class</span> ContaBancariaTest {\n\n    @Test\n    <span class=\"t-tipo\">void</span> <span class=\"t-fn\">deveDepositarValorPositivo</span>() {\n        ContaBancaria conta = <span class=\"t-chave\">new</span> <span class=\"t-fn\">ContaBancaria</span>(<span class=\"t-str\">\"Ana\"</span>, <span class=\"t-num\">100</span>);\n        conta.<span class=\"t-fn\">depositar</span>(<span class=\"t-num\">50</span>);\n        <span class=\"t-fn\">assertEquals</span>(<span class=\"t-num\">150.0</span>, conta.<span class=\"t-fn\">getSaldo</span>(), <span class=\"t-num\">0.001</span>);   <span class=\"t-com\">// o 3º argumento é a tolerância</span>\n    }\n\n    @Test\n    <span class=\"t-tipo\">void</span> <span class=\"t-fn\">deveRecusarDepositoNegativo</span>() {\n        ContaBancaria conta = <span class=\"t-chave\">new</span> <span class=\"t-fn\">ContaBancaria</span>(<span class=\"t-str\">\"Ana\"</span>, <span class=\"t-num\">100</span>);\n        <span class=\"t-fn\">assertThrows</span>(IllegalArgumentException.<span class=\"t-chave\">class</span>, () -&gt; conta.<span class=\"t-fn\">depositar</span>(-<span class=\"t-num\">10</span>));\n    }\n}</code></pre></figure>\n<p><strong>Para onde Java leva</strong> — depois da base, escolha <strong>uma</strong> trilha:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Trilha</th><th>Ferramentas</th><th>Para quem quer</th></tr></thea
