const totalLidas = () => MODS.reduce((s, m) => s + lidasDo(m), 0);
const pctGeral = () => Math.round((totalLidas() / TOTAL_AULAS) * 100);

/** A primeira aula ainda não lida, na ordem do caminho. */
function proximaAula() {
  for (const m of MODS) {
    const a = m.aulas.find((x) => !lida(x.id));
    if (a) return { m, a };
  }
  return null;
}

const ico = (nome, cls = '') =>

/** ●●●○○ — o mesmo glifo do material impresso. */
const pontos = (n) =>

function barra(pct, cheia = false) {
  return `<div class="barra${cheia ? ' cheia' : ''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;

let timerAviso;
function avisar(txt) {

        <span style="font-size:13.5px;color:var(--tinta-3)">${feito ? 'Aula concluída.' : 'Digitou o código à mão? Então pode marcar.'}</span>

    <nav class="passos">
      ${ant ? `<a class="passo" href="#/m/${m.num}/${ant.id}"><span class="r">← ${esc(ant.codigo)}</span><span class="t">${esc(ant.titulo)}</span></a>` : `<a class="passo" href="#/m/${m.num}"><span class="r">←</span><span class="t">Voltar ao módulo</span></a>`}

}

/* ============================================================
   Desenho
   ============================================================ */

function desenhar() {
  const r = rota();
  let html;

  if (r[0] === 'trilhas') html = telaTrilhas();
  else if (r[0] === 'm' && r[2]) html = telaAula(r[1], r[2]);
  else if (r[0] === 'm') html = telaModulo(r[1]);
  else if (r[0] === 'pratica') html = telaPratica();
  else if (r[0] === 'checklists') html = telaChecklists();
  else if (r[0] === 'referencia') html = telaReferencia();
  else if (r[0] === 'certificado') html = telaCertificado();
  else if (r[0] === 'inicio') html = telaInicio();
  else html = telaNaoEncontrada();

  $('#palco').innerHTML = html;
  atualizarTrilho();
  ligarQuiz();
  observarSecoes();
}

/** Nav lateral e barra inferior: marca a tela atual e atualiza o anel. */
function atualizarTrilho() {
  const r = rota()[0];
  const atual = { m: 'trilhas', trilhas: 'trilhas' }[r] || r;
  document.querySelectorAll('[data-rota]').forEach((a) => {
    if (a.dataset.rota === atual) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  const p = pctGeral();
  const anel = $('#anel-valor');
  if (anel) {
    const c = 2 * Math.PI * 20;
    anel.style.strokeDasharray = String(c);
    anel.style.strokeDashoffset = String(c * (1 - p / 100));
  }
  const pct = $('#anel-pct');
  if (pct) pct.textContent = p + '%';
  const txt = $('#anel-txt');
  if (txt) txt.textContent = `${totalLidas()} de ${TOTAL_AULAS} aulas`;

  document.querySelectorAll('[data-conta]').forEach((el) => {
    const k = el.dataset.conta;
    if (k === 'trilhas') el.textContent = `${MODS.filter(concluido).length}/${MODS.length}`;
    if (k === 'checklists') {
      const c = MODS.filter((m) => m.checklist.length);
      el.textContent = `${c.filter((m) => checkDo(m) === m.checklist.length).length}/${c.length}`;
    }
  });
}

/* ============================================================
   Interação — um só ouvinte para toda a página
   ============================================================ */

document.addEventListener('click', (ev) => {
  const alvo = (s) => ev.target.closest(s);

  const copiar = alvo('[data-copiar]');
  if (copiar) {
    const codigo = copiar.closest('.cod').querySelector('code');
    navigator.clipboard?.writeText(codigo.innerText).then(
      () => {
        copiar.textContent = 'Copiado';
        copiar.dataset.feito = '1';
        setTimeout(() => {
          copiar.textContent = 'Copiar';
          delete copiar.dataset.feito;
        }, 1600);
      },
      () => avisar('Não foi possível copiar'),
    );
    return;
  }

  const concluir = alvo('[data-concluir]');
  if (concluir) {
    const id = concluir.dataset.concluir;
    E.aulas[id] = E.aulas[id] ? 0 : 1;
    salvar();
    avisar(E.aulas[id] ? 'Aula marcada como lida' : 'Marcação removida');
    desenhar();
    return;
  }

  const tiqueAula = alvo('[data-aula]');
  if (tiqueAula) {
    const id = tiqueAula.dataset.aula;
    E.aulas[id] = E.aulas[id] ? 0 : 1;
    salvar();
    desenhar();
    return;
  }

  for (const [attr, mapa] of [
    ['data-check', E.check],
    ['data-ex', E.ex],
    ['data-req', E.req],
    ['data-proj', E.proj],
  ]) {
    const el = alvo(`[${attr}]`);
    if (el) {
      const k = el.getAttribute(attr);
      mapa[k] = mapa[k] ? 0 : 1;
      salvar();
      desenhar();
      return;
    }
  }

  if (alvo('#imprimir')) {
    window.print();
    return;
  }

  if (alvo('#tema') || alvo('#tema-movel')) {
    const escuro = document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = escuro ? 'light' : 'dark';
    try { localStorage.setItem('tema', escuro ? 'light' : 'dark'); } catch { /* sem armazenamento */ }
    return;
  }

  if (alvo('#abrir-busca') || alvo('#abrir-busca-movel')) { abrirBusca(); return; }
  // Clique no fundo escurecido — e não dentro da caixa — fecha a busca.
  if (ev.target.id === 'busca') { fecharBusca(); return; }
});

document.addEventListener('input', (ev) => {
  if (ev.target.id === 'cert-nome') {
    E.nome = ev.target.value.slice(0, 60);
    salvar();
  }
  if (ev.target.id === 'busca-campo') filtrarBusca(ev.target.value);
});

/* ============================================================
   Quiz
   ============================================================ */

function ligarQuiz() {
  const corpo = $('#quiz-corpo');
  if (!corpo) return;

  const m = porNum.get(Number(rota()[1]));
  if (!m) return;
  const respondidas = new Map();

  const nota = () => {
    const el = $('#quiz-nota');
    if (respondidas.size < m.quiz.length) {
      el.textContent = `${respondidas.size} de ${m.quiz.length} respondidas`;
      return;
    }
    const acertos = [...respondidas.values()].filter(Boolean).length;
    el.textContent = `${acertos} de ${m.quiz.length} corretas`;
    el.style.color = acertos === m.quiz.length ? 'var(--certo)' : acertos >= m.quiz.length - 1 ? 'var(--ocre)' : 'var(--erro)';
    E.quiz[m.num] = { acertos, total: m.quiz.length };
    salvar();
  };

  corpo.addEventListener('click', (ev) => {
    const b = ev.target.closest('.op');
    if (!b) return;
    const [qi, oi] = b.dataset.op.split(':').map(Number);
    if (respondidas.has(qi)) return;

    const q = m.quiz[qi];
    const bloco = corpo.querySelector(`[data-q="${qi}"]`);
    respondidas.set(qi, oi === q.c);

    bloco.querySelectorAll('.op').forEach((op) => {
      const k = Number(op.dataset.op.split(':')[1]);
      op.disabled = true;
      if (k === q.c) op.classList.add('certa');
      else if (k === oi) op.classList.add('errada');
    });

    const exp = document.createElement('div');
    exp.className = 'quiz-e';
    exp.innerHTML = q.e;
    bloco.appendChild(exp);
    nota();
  });

  $('#quiz-zerar').addEventListener('click', () => {
    delete E.quiz[m.num];
    salvar();
    desenhar();
    $('#quiz')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* ============================================================
   Leitura: barra de progresso e índice ativo
   ============================================================ */

let observador;
function observarSecoes() {
  observador?.disconnect();
  const indice = $('#indice');
  if (!indice) return;

  const links = [...indice.querySelectorAll('a')];
  const alvos = links.map((a) => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  if (!alvos.length) return;

  observador = new IntersectionObserver(
    (entradas) => {
      const visivel = entradas.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (!visivel) return;
      links.forEach((a) => a.classList.toggle('ativo', a.getAttribute('href').slice(1) === visivel.target.id));
      const ativo = indice.querySelector('.ativo');
      if (ativo) indice.scrollTo({ left: ativo.offsetLeft - 40, behavior: 'smooth' });
    },
    { rootMargin: '-90px 0px -70% 0px', threshold: 0 },
  );
  alvos.forEach((t) => observador.observe(t));
}

addEventListener(
  'scroll',
  () => {
    const alto = document.documentElement.scrollHeight - innerHeight;
    const p = alto > 40 ? Math.min(1, scrollY / alto) : 0;
    const barra = $('#leitura');
    barra.style.transform = `scaleX(${p})`;
    barra.style.opacity = p > 0.005 && p < 0.999 ? '1' : '0';
  },
  { passive: true },
);

/* ============================================================
   Busca
   ============================================================ */

const INDICE = [];
MODS.forEach((m) => {
  INDICE.push({ t: `Módulo ${m.num} — ${m.nome}`, s: m.objetivo.replace(/<[^>]+>/g, ''), c: `M${m.num}`, h: `#/m/${m.num}`, m: 'módulo' });
  m.aulas.forEach((a) =>
    INDICE.push({ t: a.titulo, s: a.html.replace(/<[^>]+>/g, ' ').slice(0, 400), c: a.codigo, h: `#/m/${m.num}/${a.id}`, m: m.nome }),
  );
});

const semAcento = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
INDICE.forEach((x) => (x.k = semAcento(x.t + ' ' + x.c + ' ' + x.m + ' ' + x.s)));

function abrirBusca() {
  $('#busca').hidden = false;
  const campo = $('#busca-campo');
  campo.value = '';
  filtrarBusca('');
  campo.focus();
}

function fecharBusca() {
  $('#busca').hidden = true;
}

function filtrarBusca(q) {
  const termo = semAcento(q.trim());
  const achados = termo
    ? INDICE.filter((x) => x.k.includes(termo))
        .sort((a, b) => semAcento(a.t).indexOf(termo) - semAcento(b.t).indexOf(termo))
        .slice(0, 30)
    : INDICE.filter((x) => x.m === 'módulo');

  const cx = $('#busca-res');
  cx.innerHTML = achados.length
    ? achados
        .map(
          (x, i) =>
            `<a href="${x.h}" class="${i === 0 ? 'sel' : ''}"><span class="c">${esc(x.c)}</span><span class="t">${esc(x.t)}</span><span class="m">${esc(x.m)}</span></a>`,
        )
        .join('')
    : `<div class="busca-vazio">Nada encontrado para “${esc(q)}”.</div>`;
}

$('#busca-res').addEventListener('click', () => setTimeout(fecharBusca, 0));

document.addEventListener('keydown', (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') {
    ev.preventDefault();
    $('#busca').hidden ? abrirBusca() : fecharBusca();
    return;
  }
  if ($('#busca').hidden) return;

  if (ev.key === 'Escape') { fecharBusca(); return; }

  const itens = [...$('#busca-res').querySelectorAll('a')];
  if (!itens.length) return;
  const i = itens.findIndex((a) => a.classList.contains('sel'));

  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    const j = ev.key === 'ArrowDown' ? Math.min(itens.length - 1, i + 1) : Math.max(0, i - 1);
    itens.forEach((a) => a.classList.remove('sel'));
    itens[j].classList.add('sel');
    itens[j].scrollIntoView({ block: 'nearest' });
  }
  if (ev.key === 'Enter' && i >= 0) {
    ev.preventDefault();
    location.hash = itens[i].getAttribute('href');
    fecharBusca();
  }
});

/* ============================================================
   Partida
   ============================================================ */

try {
  const t = localStorage.getItem('tema');
  if (t) document.documentElement.dataset.theme = t;
} catch { /* sem armazenamento */ }

carregarLocal();
desenhar();
</script>
