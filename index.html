r\">property</span>=<span class=\"t-str\">\"og:image\"</span> <span class=\"t-attr\">content</span>=<span class=\"t-str\">\"https://site.com/capa.jpg\"</span>&gt;\n    &lt;<span class=\"t-tag\">meta</span> <span class=\"t-attr\">property</span>=<span class=\"t-str\">\"og:url\"</span> <span class=\"t-attr\">content</span>=<span class=\"t-str\">\"https://site.com\"</span>&gt;\n&lt;/<span class=\"t-tag\">head</span>&gt;</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a1-9","codigo":"1.9","titulo":"Mídia e recursos modernos","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">&lt;!-- Vídeo --&gt;</span>\n&lt;<span class=\"t-tag\">video</span> controls <span class=\"t-attr\">width</span>=<span class=\"t-str\">\"600\"</span> <span class=\"t-attr\">poster</span>=<span class=\"t-str\">\"capa.jpg\"</span>&gt;\n    &lt;<span class=\"t-tag\">source</span> <span class=\"t-attr\">src</span>=<span class=\"t-str\">\"video.mp4\"</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"video/mp4\"</span>&gt;\n    Seu navegador não suporta vídeo.\n&lt;/<span class=\"t-tag\">video</span>&gt;\n\n<span class=\"t-com\">&lt;!-- Imagem responsiva: navegador escolhe o tamanho certo --&gt;</span>\n&lt;<span class=\"t-tag\">picture</span>&gt;\n    &lt;<span class=\"t-tag\">source</span> <span class=\"t-attr\">media</span>=<span class=\"t-str\">\"(max-width: 600px)\"</span> <span class=\"t-attr\">srcset</span>=<span class=\"t-str\">\"foto-pequena.jpg\"</span>&gt;\n    &lt;<span class=\"t-tag\">img</span> <span class=\"t-attr\">src</span>=<span class=\"t-str\">\"foto-grande.jpg\"</span> <span class=\"t-attr\">alt</span>=<span class=\"t-str\">\"Descrição\"</span>&gt;\n&lt;/<span class=\"t-tag\">picture</span>&gt;\n\n<span class=\"t-com\">&lt;!-- Acordeão nativo, sem JavaScript --&gt;</span>\n&lt;<span class=\"t-tag\">details</span>&gt;\n    &lt;<span class=\"t-tag\">summary</span>&gt;Perguntas frequentes&lt;/<span class=\"t-tag\">summary</span>&gt;\n    &lt;<span class=\"t-tag\">p</span>&gt;Resposta aqui.&lt;/<span class=\"t-tag\">p</span>&gt;\n&lt;/<span class=\"t-tag\">details</span>&gt;</code></pre></figure>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[{"titulo":"Currículo online em HTML puro, sem nada de CSS.","rotulo":"","resumo":"<p>Vai ficar feio. É de propósito — o objetivo é estrutura, não beleza. Requisitos:</p>\n<hr>","requisitos":["<code>header</code> com seu nome e área de atuação","<code>nav</code> com links âncora para as seções","<code>main</code> com <code>section</code> para: sobre, formação, experiência, habilidades","Lista de habilidades com <code>&lt;ul&gt;</code>","Tabela com histórico de formação","<code>form</code> de contato com nome, email, mensagem e envio","<code>footer</code> com links para GitHub e LinkedIn","Zero <code>&lt;div&gt;</code>. Se você precisou de uma, provavelmente existe uma tag semântica melhor"],"criterio":"abra o site e navegue só com Tab. Tudo alcançável, na ordem certa."}],"checklist":["Escrevo a estrutura base de um HTML de memória","Sei a diferença entre <code>&lt;section&gt;</code>, <code>&lt;article&gt;</code> e <code>&lt;div&gt;</code>","Sei por que <code>alt</code> e <code>label for</code> existem","Sei a diferença entre <code>id</code> e <code>name</code> em formulário","Sei usar <code>../</code> em caminhos de arquivo","Meu currículo passa no teste de navegação por teclado"],"quiz":[{"p":"Para que serve o atributo <code>alt</code> em uma imagem?","o":["Define o título que aparece ao passar o mouse","É lido por leitores de tela e aparece quando a imagem não carrega","Define um texto alternativo só para o Google","É opcional e serve apenas para organização do código"],"c":1,"e":"O <code>alt</code> não é opcional. Descreva o que a imagem mostra — não escreva \"imagem de gato\", escreva o que se vê: \"Gato laranja dormindo no sofá\"."},{"p":"Num formulário, qual a diferença entre <code>id</code> e <code>name</code>?","o":["São a mesma coisa com nomes diferentes","<code>name</code> é o que vai para o servidor; <code>id</code> serve ao <code>label</code> e ao JavaScript","<code>id</code> vai para o servidor; <code>name</code> é só visual","<code>name</code> só funciona em campos de texto"],"c":1,"e":"Sem <code>name</code>, o campo simplesmente não é enviado. O <code>id</code> existe para o <code>label for</code> apontar e para o JavaScript encontrar o campo."},{"p":"Por que <code>&lt;header&gt;</code> e <code>&lt;main&gt;</code> são melhores que <code>&lt;div class=\"topo\"&gt;</code> e <code>&lt;div class=\"conteudo\"&gt;</code>?","o":["Porque renderizam mais rápido no navegador","Porque dispensam CSS","Porque são entendidas por leitores de tela, pelo Google e por quem lê seu código","Porque não é possível estilizar uma <code>div</code>"],"c":2,"e":"Visualmente são idênticos. A diferença é semântica: as tags dizem <em>o que a coisa é</em>. A regra prática é que <code>&lt;div&gt;</code> é o último recurso, não o primeiro."},{"p":"Um arquivo dentro de <code>css/</code> precisa acessar <code>imagens/logo.png</code>, que está na raiz. Qual o caminho?","o":["<code>imagens/logo.png</code>","<code>./imagens/logo.png</code>","<code>../imagens/logo.png</code>","<code>//imagens/logo.png</code>"],"c":2,"e":"<code>../</code> sobe uma pasta. Sem barra no começo, o caminho é relativo a onde você está; <code>/</code> no começo significa a raiz do site."},{"p":"Qual o teste rápido para saber se sua página é acessível por teclado?","o":["Rodar um validador de HTML","Navegar o site inteiro só com Tab e Enter, sem mouse","Verificar se todas as cores têm contraste","Conferir se o <code>lang</code> está definido"],"c":1,"e":"Se você não consegue chegar em algum lugar só com Tab e Enter, um usuário de teclado também não consegue. É o critério de aprovação do projeto deste módulo."}]},{"num":2,"nome":"CSS","id":"m2","dificuldade":2,"tempo":"5 a 6 semanas","prereq":"Módulo 1","faixa":{"nome":"Aprendiz","cor":"f2"},"objetivo":"transformar HTML cru em interface, com layout responsivo funcionando de celular a desktop.","intro":"<p>CSS tem fama de fácil e é onde mais gente empaca. O motivo: ele não é difícil de escrever, é difícil de <strong>prever</strong>. Você muda uma linha e três elementos do outro lado da tela se mexem. A cura é entender os quatro sistemas por baixo: cascata, box model, fluxo e contexto de empilhamento.</p>\n<hr>","aulas":[{"id":"a2-1","codigo":"2.1","titulo":"Sintaxe e como conectar","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">seletor</span> {\n    <span class=\"t-attr\">propriedade</span>: <span class=\"t-val\">valor</span>;\n}\n\n<span class=\"t-sel\">h1</span> {\n    <span class=\"t-attr\">color</span>: <span class=\"t-val\">darkblue</span>;\n    <span class=\"t-attr\">font-size</span>: <span class=\"t-val\">32px</span>;\n}</code></pre></figure>\n<p>Conectando ao HTML (sempre use a terceira forma):</p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">&lt;!-- 1. Inline: evite. Impossível de manter --&gt;</span>\n&lt;<span class=\"t-tag\">p</span> <span class=\"t-attr\">style</span>=<span class=\"t-str\">\"color: red;\"</span>&gt;Texto&lt;/<span class=\"t-tag\">p</span>&gt;\n\n<span class=\"t-com\">&lt;!-- 2. Interno: só para teste rápido --&gt;</span>\n&lt;<span class=\"t-tag\">style</span>&gt;\n    p { color: red; }\n&lt;/<span class=\"t-tag\">style</span>&gt;\n\n<span class=\"t-com\">&lt;!-- 3. Externo: sempre use esse --&gt;</span>\n&lt;<span class=\"t-tag\">link</span> <span class=\"t-attr\">rel</span>=<span class=\"t-str\">\"stylesheet\"</span> <span class=\"t-attr\">href</span>=<span class=\"t-str\">\"css/estilo.css\"</span>&gt;</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a2-2","codigo":"2.2","titulo":"Seletores","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">/* Por tag */</span>\n<span class=\"t-sel\">p</span> { }\n\n<span class=\"t-com\">/* Por classe — o seu pão de cada dia */</span>\n<span class=\"t-sel\">.destaque</span> { }\n\n<span class=\"t-com\">/* Por id — use pouco, é rígido demais */</span>\n<span class=\"t-sel\">#cabecalho</span> { }\n\n<span class=\"t-com\">/* Descendente: todo &lt;a&gt; dentro de &lt;nav&gt; */</span>\n<span class=\"t-sel\">nav a</span> { }\n\n<span class=\"t-com\">/* Filho direto: só &lt;li&gt; filho imediato de &lt;ul&gt; */</span>\n<span class=\"t-sel\">ul &gt; li</span> { }\n\n<span class=\"t-com\">/* Múltiplos seletores */</span>\n<span class=\"t-sel\">h1, h2, h3</span> { }\n\n<span class=\"t-com\">/* Por atributo */</span>\n<span class=\"t-sel\">input[type=\"text\"]</span> { }\n\n<span class=\"t-com\">/* Pseudo-classes: estados */</span>\n<span class=\"t-sel\">a:hover</span> { }          <span class=\"t-com\">/* mouse em cima */</span>\n<span class=\"t-sel\">input:focus</span> { }      <span class=\"t-com\">/* campo focado */</span>\n<span class=\"t-sel\">li:first-child</span> { }   <span class=\"t-com\">/* primeiro filho */</span>\n<span class=\"t-sel\">li:nth-child(2n)</span> { } <span class=\"t-com\">/* pares */</span>\n\n<span class=\"t-com\">/* Pseudo-elementos: partes que não existem no HTML */</span>\n<span class=\"t-sel\">p::first-line</span> { }\n<span class=\"t-sel\">.card::before</span> { content: \"→\"; }</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a2-3","codigo":"2.3","titulo":"Box Model (o conceito mais importante do CSS)","nivel":"Básico","quando":"","html":"<p>Todo elemento na tela é uma caixa com quatro camadas:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>┌─────────────── margin (espaço FORA) ──────────────┐\n│  ┌──────────── border (a borda) ────────────────┐ │\n│  │  ┌───────── padding (espaço DENTRO) ───────┐ │ │\n│  │  │                                          │ │ │\n│  │  │            CONTENT (conteúdo)            │ │ │\n│  │  │                                          │ │ │\n│  │  └──────────────────────────────────────────┘ │ │\n│  └────────────────────────────────────────────────┘ │\n└──────────────────────────────────────────────────────┘</code></pre></figure>\n<ul><li><strong>margin</strong> — empurra os outros elementos para longe</li><li><strong>border</strong> — a linha da caixa</li><li><strong>padding</strong> — afasta o conteúdo da borda, por dentro</li><li><strong>content</strong> — o texto ou imagem</li></ul>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">.caixa</span> {\n    <span class=\"t-attr\">width</span>: <span class=\"t-val\">300px</span>;\n    <span class=\"t-attr\">padding</span>: <span class=\"t-val\">20px</span>;\n    <span class=\"t-attr\">border</span>: <span class=\"t-val\">5px solid black</span>;\n    <span class=\"t-attr\">margin</span>: <span class=\"t-val\">10px</span>;\n}</code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>A pegadinha clássica:</strong> essa caixa não ocupa 300px. Ela ocupa <code>300 + 20 + 20 + 5 + 5 = 350px</code>. Porque <code>width</code> conta só o conteúdo.</aside>\n<p>A cura, que você vai colocar no topo de todo projeto pelo resto da vida:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">*</span> {\n    <span class=\"t-attr\">box-sizing</span>: <span class=\"t-val\">border-box</span>;\n    <span class=\"t-attr\">margin</span>: <span class=\"t-val\">0</span>;\n    <span class=\"t-attr\">padding</span>: <span class=\"t-val\">0</span>;\n}</code></pre></figure>\n<p>Com <code>border-box</code>, o <code>width: 300px</code> passa a incluir padding e border. A caixa ocupa 300px de verdade. Isso deveria ser o padrão da web — não é por motivo histórico.</p>","ancoras":[],"minutos":4},{"id":"a2-4","codigo":"2.4","titulo":"Cores, unidades e tipografia","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">/* Cores */</span>\n<span class=\"t-attr\">color</span>: <span class=\"t-val\">red</span>;\n<span class=\"t-attr\">color</span>: <span class=\"t-val\">#FF5733</span>;\n<span class=\"t-attr\">color</span>: <span class=\"t-val\">rgb(255, 87, 51)</span>;\n<span class=\"t-attr\">color</span>: <span class=\"t-val\">rgba(255, 87, 51, 0.5)</span>;   <span class=\"t-com\">/* com transparência */</span>\n<span class=\"t-attr\">color</span>: <span class=\"t-val\">hsl(9, 100%, 60%)</span>;        <span class=\"t-com\">/* matiz, saturação, luminosidade */</span></code></pre></figure>\n<p><strong>Unidades — e quando usar cada uma:</strong></p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Unidade</th><th>O que é</th><th>Use para</th></tr></thead><tbody><tr><td><code>px</code></td><td>Pixel fixo</td><td>Bordas, sombras</td></tr><tr><td><code>%</code></td><td>Relativo ao pai</td><td>Larguras</td></tr><tr><td><code>rem</code></td><td>Relativo à raiz (padrão 16px)</td><td><strong>Fontes e espaçamentos</strong></td></tr><tr><td><code>em</code></td><td>Relativo ao pai</td><td>Espaço interno de componente</td></tr><tr><td><code>vw</code> / <code>vh</code></td><td>1% da largura/altura da tela</td><td>Seções de tela cheia</td></tr><tr><td><code>fr</code></td><td>Fração do espaço livre (grid)</td><td>Colunas de grid</td></tr></tbody></table></div>\n<p>Prefira <code>rem</code> para fonte. Se o usuário aumentar a fonte padrão do navegador (gente com baixa visão faz isso), <code>rem</code> acompanha e <code>px</code> não.</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">body</span> {\n    <span class=\"t-attr\">font-family</span>: <span class=\"t-val\">'Inter', -apple-system, sans-serif</span>;\n    <span class=\"t-attr\">font-size</span>: <span class=\"t-val\">1rem</span>;\n    <span class=\"t-attr\">line-height</span>: <span class=\"t-val\">1.6</span>;   <span class=\"t-com\">/* sem unidade: multiplica o font-size. Use assim */</span>\n    <span class=\"t-attr\">font-weight</span>: <span class=\"t-val\">400</span>;\n}</code></pre></figure>\n<p><code>line-height: 1.6</code> sem unidade é uma das melhorias mais baratas de legibilidade que existe.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a2-5","codigo":"2.5","titulo":"A Cascata e a Especificidade","nivel":"Intermediário","quando":"","html":"<p>Por que seu CSS \"não funciona\"? Quase sempre é isso.</p>\n<p>Quando duas regras brigam pelo mesmo elemento, vence a de maior <strong>especificidade</strong>:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Tipo de seletor</th><th>Peso</th></tr></thead><tbody><tr><td>Inline (<code>style=\"\"</code>)</td><td>1000</td></tr><tr><td><code>#id</code></td><td>100</td></tr><tr><td><code>.classe</code>, <code>:hover</code>, <code>[atributo]</code></td><td>10</td></tr><tr><td><code>tag</code>, <code>::before</code></td><td>1</td></tr></tbody></table></div>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">p</span> { color: blue; }                    <span class=\"t-com\">/* peso 1 */</span>\n<span class=\"t-sel\">.texto</span> { color: green; }              <span class=\"t-com\">/* peso 10 — vence */</span>\n<span class=\"t-sel\">#principal .texto</span> { color: red; }     <span class=\"t-com\">/* peso 110 — vence de todos */</span></code></pre></figure>\n<p>Empate? Vence a que vier <strong>por último</strong> no arquivo.</p>\n<p>Existe o <code>!important</code>, que ignora tudo:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">p</span> { color: purple !important; }</code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>Não use.</strong> Sério. Ele resolve seu problema hoje e cria três amanhã, porque a única forma de vencer um <code>!important</code> é outro <code>!important</code>. Se você sentiu que precisa dele, seu CSS está mal organizado — refatore em vez de tapar.</aside>","ancoras":[],"minutos":4},{"id":"a2-6","codigo":"2.6","titulo":"Display e fluxo","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-attr\">display</span>: <span class=\"t-val\">block</span>;         <span class=\"t-com\">/* ocupa a linha toda. div, p, h1 */</span>\n<span class=\"t-attr\">display</span>: <span class=\"t-val\">inline</span>;        <span class=\"t-com\">/* fica na linha. span, a. Ignora width/height */</span>\n<span class=\"t-attr\">display</span>: <span class=\"t-val\">inline-block</span>;  <span class=\"t-com\">/* fica na linha, mas aceita width/height */</span>\n<span class=\"t-attr\">display</span>: <span class=\"t-val\">none</span>;          <span class=\"t-com\">/* some completamente, não ocupa espaço */</span>\n<span class=\"t-attr\">display</span>: <span class=\"t-val\">flex</span>;          <span class=\"t-com\">/* container flexível */</span>\n<span class=\"t-attr\">display</span>: <span class=\"t-val\">grid</span>;          <span class=\"t-com\">/* container em grade */</span></code></pre></figure>\n<p>Diferença que confunde:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-attr\">visibility</span>: <span class=\"t-val\">hidden</span>;   <span class=\"t-com\">/* fica invisível mas o espaço continua lá */</span>\n<span class=\"t-attr\">display</span>: <span class=\"t-val\">none</span>;        <span class=\"t-com\">/* some e o espaço fecha */</span>\n<span class=\"t-attr\">opacity</span>: <span class=\"t-val\">0</span>;           <span class=\"t-com\">/* transparente, mas ainda clicável */</span></code></pre></figure>","ancoras":[],"minutos":4},{"id":"a2-7","codigo":"2.7","titulo":"Flexbox","nivel":"Intermediário","quando":"","html":"<p>Flexbox organiza elementos em <strong>uma dimensão</strong> — uma linha ou uma coluna. É a ferramenta que você mais vai usar.</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">.container</span> {\n    <span class=\"t-attr\">display</span>: <span class=\"t-val\">flex</span>;\n\n    <span class=\"t-attr\">flex-direction</span>: <span class=\"t-val\">row</span>;              <span class=\"t-com\">/* row | column */</span>\n    <span class=\"t-attr\">justify-content</span>: <span class=\"t-val\">space-between</span>;   <span class=\"t-com\">/* alinha no eixo principal */</span>\n    <span class=\"t-attr\">align-items</span>: <span class=\"t-val\">center</span>;              <span class=\"t-com\">/* alinha no eixo cruzado */</span>\n    <span class=\"t-attr\">gap</span>: <span class=\"t-val\">16px</span>;                        <span class=\"t-com\">/* espaço entre os filhos */</span>\n    <span class=\"t-attr\">flex-wrap</span>: <span class=\"t-val\">wrap</span>;                  <span class=\"t-com\">/* quebra linha se não couber */</span>\n}\n\n<span class=\"t-sel\">.item</span> {\n    <span class=\"t-attr\">flex</span>: <span class=\"t-val\">1</span>;              <span class=\"t-com\">/* cresce para ocupar o espaço livre */</span>\n    <span class=\"t-attr\">flex-shrink</span>: <span class=\"t-val\">0</span>;       <span class=\"t-com\">/* não encolhe */</span>\n    <span class=\"t-attr\">flex-basis</span>: <span class=\"t-val\">200px</span>;    <span class=\"t-com\">/* tamanho base */</span>\n}</code></pre></figure>\n<aside class=\"destaque destaque-regra\"><strong>A ideia central:</strong> flex tem um <em>eixo principal</em> e um <em>eixo cruzado</em>. Com <code>flex-direction: row</code>, o principal é horizontal — então <code>justify-content</code> mexe na horizontal e <code>align-items</code> na vertical. Se você trocar para <code>column</code>, os dois <strong>invertem de papel</strong>. Isso é o que quebra a cabeça de todo mundo.</aside>\n<p>Centralizar qualquer coisa, o santo graal:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">.centro</span> {\n    <span class=\"t-attr\">display</span>: <span class=\"t-val\">flex</span>;\n    <span class=\"t-attr\">justify-content</span>: <span class=\"t-val\">center</span>;\n    <span class=\"t-attr\">align-items</span>: <span class=\"t-val\">center</span>;\n    <span class=\"t-attr\">height</span>: <span class=\"t-val\">100vh</span>;\n}</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a2-8","codigo":"2.8","titulo":"Grid","nivel":"Intermediário","quando":"","html":"<p>Grid organiza em <strong>duas dimensões</strong> — linhas e colunas ao mesmo tempo. Use para o esqueleto da página; flex para os componentes dentro.</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">.grade</span> {\n    <span class=\"t-attr\">display</span>: <span class=\"t-val\">grid</span>;\n    <span class=\"t-attr\">grid-template-columns</span>: <span class=\"t-val\">repeat(3, 1fr)</span>;   <span class=\"t-com\">/* 3 colunas iguais */</span>\n    <span class=\"t-attr\">gap</span>: <span class=\"t-val\">20px</span>;\n}\n\n<span class=\"t-com\">/* Layout clássico de página */</span>\n<span class=\"t-sel\">.pagina</span> {\n    <span class=\"t-attr\">display</span>: <span class=\"t-val\">grid</span>;\n    <span class=\"t-attr\">grid-template-areas</span>:\n        <span class=\"t-val\">\"cabecalho cabecalho\"</span>\n        \"lateral   conteudo\"\n        \"rodape    rodape\";\n    <span class=\"t-attr\">grid-template-columns</span>: <span class=\"t-val\">250px 1fr</span>;\n    <span class=\"t-attr\">min-height</span>: <span class=\"t-val\">100vh</span>;\n}\n\n<span class=\"t-sel\">header</span>  { grid-area: cabecalho; }\n<span class=\"t-sel\">aside</span>   { grid-area: lateral; }\n<span class=\"t-sel\">main</span>    { grid-area: conteudo; }\n<span class=\"t-sel\">footer</span>  { grid-area: rodape; }</code></pre></figure>\n<p>Grid responsivo sem media query — um truque que impressiona:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">.cards</span> {\n    <span class=\"t-attr\">display</span>: <span class=\"t-val\">grid</span>;\n    <span class=\"t-attr\">grid-template-columns</span>: <span class=\"t-val\">repeat(auto-fit, minmax(250px, 1fr))</span>;\n    <span class=\"t-attr\">gap</span>: <span class=\"t-val\">20px</span>;\n}</code></pre></figure>\n<p>Lê-se: \"crie quantas colunas couberem, cada uma com no mínimo 250px, dividindo o resto igualmente\". Em telas grandes vira 4 colunas, no celular vira 1. Sozinho.</p>","ancoras":[],"minutos":4},{"id":"a2-9","codigo":"2.9","titulo":"Responsividade","nivel":"Intermediário","quando":"","html":"<aside class=\"destaque destaque-regra\"><strong>Mobile first.</strong> Escreva o CSS para celular e vá adicionando o que muda em telas maiores. É mais fácil aumentar do que espremer.</aside>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">/* Base: celular */</span>\n<span class=\"t-sel\">.container</span> { padding: 16px; }\n\n<span class=\"t-com\">/* Tablet para cima */</span>\n<span class=\"t-sel\">@media (min-width: 768px)</span> {\n<span class=\"t-sel\">    .container</span> { padding: 32px; }\n}\n\n<span class=\"t-com\">/* Desktop */</span>\n<span class=\"t-sel\">@media (min-width: 1024px)</span> {\n<span class=\"t-sel\">    .container</span> {\n        <span class=\"t-attr\">padding</span>: <span class=\"t-val\">48px</span>;\n        <span class=\"t-attr\">max-width</span>: <span class=\"t-val\">1200px</span>;\n        <span class=\"t-attr\">margin</span>: <span class=\"t-val\">0 auto</span>;\n    }\n}</code></pre></figure>\n<p>Pontos de quebra comuns: 480px, 768px, 1024px, 1440px. Mas o certo é quebrar <strong>onde o layout ficar feio</strong>, não em números decorados. Vá arrastando a janela e veja onde quebra.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a2-10","codigo":"2.10","titulo":"Variáveis CSS","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">:root</span> {\n    <span class=\"t-attr\">--cor-primaria</span>: <span class=\"t-val\">#2563eb</span>;\n    <span class=\"t-attr\">--cor-texto</span>: <span class=\"t-val\">#1f2937</span>;\n    <span class=\"t-attr\">--espaco</span>: <span class=\"t-val\">1rem</span>;\n    <span class=\"t-attr\">--raio</span>: <span class=\"t-val\">8px</span>;\n}\n\n<span class=\"t-sel\">.botao</span> {\n    <span class=\"t-attr\">background</span>: <span class=\"t-val\">var(--cor-primaria)</span>;\n    <span class=\"t-attr\">padding</span>: <span class=\"t-val\">var(--espaco)</span>;\n    <span class=\"t-attr\">border-radius</span>: <span class=\"t-val\">var(--raio)</span>;\n}</code></pre></figure>\n<p>Muda o tema inteiro alterando quatro linhas. E permite tema escuro quase de graça:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">@media (prefers-color-scheme: dark)</span> {\n<span class=\"t-sel\">    :root</span> {\n        <span class=\"t-attr\">--cor-texto</span>: <span class=\"t-val\">#f9fafb</span>;\n    }\n}</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a2-11","codigo":"2.11","titulo":"Posicionamento e empilhamento","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-attr\">position</span>: <span class=\"t-val\">static</span>;     <span class=\"t-com\">/* padrão, segue o fluxo */</span>\n<span class=\"t-attr\">position</span>: <span class=\"t-val\">relative</span>;   <span class=\"t-com\">/* desloca a partir da posição original */</span>\n<span class=\"t-attr\">position</span>: <span class=\"t-val\">absolute</span>;   <span class=\"t-com\">/* sai do fluxo, ancora no ancestral posicionado */</span>\n<span class=\"t-attr\">position</span>: <span class=\"t-val\">fixed</span>;      <span class=\"t-com\">/* fixo na tela, não rola */</span>\n<span class=\"t-attr\">position</span>: <span class=\"t-val\">sticky</span>;     <span class=\"t-com\">/* rola até um ponto e trava */</span></code></pre></figure>\n<p>Uso mais comum de <code>sticky</code> — cabeçalho que gruda no topo:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">header</span> {\n    <span class=\"t-attr\">position</span>: <span class=\"t-val\">sticky</span>;\n    <span class=\"t-attr\">top</span>: <span class=\"t-val\">0</span>;\n    <span class=\"t-attr\">z-index</span>: <span class=\"t-val\">100</span>;\n}</code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>Detalhe que quebra gente:</strong> <code>position: absolute</code> se ancora no ancestral mais próximo que tenha <code>position</code> diferente de <code>static</code>. Se nenhum tiver, ele ancora no <code>&lt;body&gt;</code> e vai parar do outro lado da tela. Solução: coloque <code>position: relative</code> no pai que deve servir de referência.</aside>","ancoras":[],"minutos":4},{"id":"a2-12","codigo":"2.12","titulo":"Transições e animações","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">.botao</span> {\n    <span class=\"t-attr\">background</span>: <span class=\"t-val\">blue</span>;\n    <span class=\"t-attr\">transition</span>: <span class=\"t-val\">background 0.3s ease, transform 0.2s ease</span>;\n}\n\n<span class=\"t-sel\">.botao:hover</span> {\n    <span class=\"t-attr\">background</span>: <span class=\"t-val\">darkblue</span>;\n    <span class=\"t-attr\">transform</span>: <span class=\"t-val\">translateY(-2px)</span>;\n}\n\n<span class=\"t-com\">/* Animação com keyframes */</span>\n<span class=\"t-sel\">@keyframes aparecer</span> {\n<span class=\"t-sel\">    from</span> { opacity: 0; transform: translateY(20px); }\n<span class=\"t-sel\">    to</span>   { opacity: 1; transform: translateY(0); }\n}\n\n<span class=\"t-sel\">.card</span> {\n    <span class=\"t-attr\">animation</span>: <span class=\"t-val\">aparecer 0.5s ease forwards</span>;\n}</code></pre></figure>\n<p>Anime só <code>transform</code> e <code>opacity</code> sempre que possível — essas duas o navegador processa na placa de vídeo e ficam suaves. Animar <code>width</code>, <code>height</code> ou <code>top</code> força o navegador a recalcular o layout e trava em celular fraco.</p>\n<p>Respeite quem tem sensibilidade a movimento:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-sel\">@media (prefers-reduced-motion: reduce)</span> {\n<span class=\"t-sel\">    *</span> { animation: none !important; transition: none !important; }\n}</code></pre></figure>\n<p><em>(Este é o único lugar onde <code>!important</code> se justifica.)</em></p>","ancoras":[],"minutos":4},{"id":"a2-13","codigo":"2.13","titulo":"Organização de CSS","nivel":"Avançado","quando":"","html":"<p>Sem método, seu CSS vira lixo a partir de 300 linhas. Aprenda <strong>BEM</strong>:</p>\n<figure class=\"cod\" data-lang=\"css\"><figcaption>CSS<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">/* Bloco */</span>\n<span class=\"t-sel\">.card</span> { }\n\n<span class=\"t-com\">/* Elemento — parte do bloco, dois underlines */</span>\n<span class=\"t-sel\">.card__titulo</span> { }\n<span class=\"t-sel\">.card__imagem</span> { }\n\n<span class=\"t-com\">/* Modificador — variação, dois traços */</span>\n<span class=\"t-sel\">.card--destaque</span> { }\n<span class=\"t-sel\">.card__titulo--grande</span> { }</code></pre></figure>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">article</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"card card--destaque\"</span>&gt;\n    &lt;<span class=\"t-tag\">img</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"card__imagem\"</span> <span class=\"t-attr\">src</span>=<span class=\"t-str\">\"...\"</span>&gt;\n    &lt;<span class=\"t-tag\">h2</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"card__titulo\"</span>&gt;Título&lt;/<span class=\"t-tag\">h2</span>&gt;\n&lt;/<span class=\"t-tag\">article</span>&gt;</code></pre></figure>\n<p>Feio de ler, ótimo de manter: você olha a classe e sabe exatamente a que componente ela pertence, sem caçar no arquivo.</p>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[{"titulo":"Landing page responsiva de um produto ou serviço.","rotulo":"","resumo":"<p>Requisitos:</p>\n<hr>","requisitos":["Cabeçalho fixo com menu que vira hambúrguer no celular (o botão pode não abrir ainda — abrir é JavaScript, próximo módulo)","Seção hero com título, texto e botão de ação","Grade de 3 a 6 cards de benefícios usando Grid","Seção de depoimentos usando Flexbox","Formulário de contato estilizado","Rodapé com colunas","Variáveis CSS para todas as cores","Funcionando de 320px até 1920px sem barra de rolagem horizontal","Nomenclatura BEM em todo o CSS"],"criterio":"abra o DevTools, ative o modo responsivo e passe por iPhone SE, iPad e Desktop. Nenhum elemento estourando, nenhum texto ilegível."}],"checklist":["Explico o box model e o que <code>border-box</code> muda","Calculo especificidade de cabeça e sei por que minha regra perdeu","Sei quando usar Flexbox e quando usar Grid","Centralizo qualquer coisa vertical e horizontalmente sem pesquisar","Escrevo media query mobile first","Sei por que <code>position: absolute</code> às vezes foge do lugar","Nunca usei <code>!important</code> no meu projeto"],"quiz":[{"p":"Uma caixa tem <code>width: 300px</code>, <code>padding: 20px</code> e <code>border: 5px</code>. Quanto ela ocupa na tela, sem <code>border-box</code>?","o":["300px","325px","350px","370px"],"c":2,"e":"300 + 20 + 20 + 5 + 5 = 350px, porque <code>width</code> conta só o conteúdo. Com <code>box-sizing: border-box</code> o <code>width</code> passa a incluir padding e border, e a caixa ocupa 300px de verdade."},{"p":"Três regras definem a cor do mesmo elemento: <code>p</code>, <code>.texto</code> e <code>#principal .texto</code>. Qual vence?","o":["<code>p</code>, por ser mais específica ao elemento","<code>.texto</code>, porque classe sempre vence","<code>#principal .texto</code>, com peso 110","A última escrita no arquivo, sempre"],"c":2,"e":"Id vale 100 e classe vale 10, então <code>#principal .texto</code> soma 110 e vence as outras duas. A ordem no arquivo só decide em caso de empate de especificidade."},{"p":"Quando usar Flexbox e quando usar Grid?","o":["Flex para o esqueleto da página, Grid para componentes","Flex para uma dimensão (linha ou coluna), Grid para duas ao mesmo tempo","Grid é a versão nova — Flex está obsoleto","Flex para desktop, Grid para celular"],"c":1,"e":"Flex organiza em uma dimensão; Grid, em duas. Na prática: Grid para o esqueleto da página, Flex para os componentes dentro dele."},{"p":"Seu <code>position: absolute</code> foi parar do outro lado da tela. Por quê?","o":["Faltou definir <code>z-index</code>","Nenhum ancestral tem <code>position</code> diferente de <code>static</code>, então ele ancorou no <code>body</code>","<code>absolute</code> sempre ancora na janela","Faltou <code>display: block</code> no pai"],"c":1,"e":"<code>absolute</code> se ancora no ancestral mais próximo que tenha <code>position</code> diferente de <code>static</code>. A solução é colocar <code>position: relative</code> no pai que deve servir de referência."},{"p":"Quais propriedades animar para não travar em celular fraco?","o":["<code>width</code> e <code>height</code>","<code>top</code> e <code>left</code>","<code>transform</code> e <code>opacity</code>","<code>margin</code> e <code>padding</code>"],"c":2,"e":"<code>transform</code> e <code>opacity</code> o navegador processa na placa de vídeo. Animar <code>width</code>, <code>height</code> ou <code>top</code> força recalcular o layout a cada quadro."}]},{"num":3,"nome":"JavaScript","id":"m3","dificuldade":3,"tempo":"12 a 16 semanas","prereq":"Módulos 0, 1 e 2","faixa":{"nome":"Praticante","cor":"f3"},"objetivo":"programar de verdade. Fazer páginas reagirem, consumir dados de servidores e construir aplicações.","intro":"<p>Este é <strong>o módulo mais longo e mais importante do material</strong> se o seu objetivo é emprego. Aqui tudo que você viu no Módulo 0 sai do papel. Não tenha pressa; passe o dobro do tempo aqui do que passou em qualquer outro módulo.</p>\n<hr>","aulas":[{"id":"a3-1","codigo":"3.1","titulo":"Variáveis e tipos","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">let</span> idade = <span class=\"t-num\">25</span>;          <span class=\"t-com\">// pode mudar depois</span>\n<span class=\"t-chave\">const</span> nome = <span class=\"t-str\">\"Maria\"</span>;    <span class=\"t-com\">// não pode ser reatribuída</span>\n<span class=\"t-chave\">var</span> antigo = <span class=\"t-str\">\"evite\"</span>;    <span class=\"t-com\">// sintaxe velha, tem armadilhas de escopo</span></code></pre></figure>\n<aside class=\"destaque destaque-regra\"><strong>Regra prática:</strong> use <code>const</code> por padrão. Só troque para <code>let</code> quando descobrir que precisa reatribuir. Nunca use <code>var</code>.</aside>\n<p>Tipos primitivos:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">let</span> numero = <span class=\"t-num\">42</span>;              <span class=\"t-com\">// number (não existe int/float separado)</span>\n<span class=\"t-chave\">let</span> texto = <span class=\"t-str\">\"Olá\"</span>;            <span class=\"t-com\">// string</span>\n<span class=\"t-chave\">let</span> ligado = <span class=\"t-chave\">true</span>;            <span class=\"t-com\">// boolean</span>\n<span class=\"t-chave\">let</span> vazio = <span class=\"t-chave\">null</span>;             <span class=\"t-com\">// ausência intencional de valor</span>\n<span class=\"t-chave\">let</span> indefinido;               <span class=\"t-com\">// undefined — nunca recebeu valor</span>\n<span class=\"t-chave\">let</span> unico = <span class=\"t-fn\">Symbol</span>(<span class=\"t-str\">\"id\"</span>);     <span class=\"t-com\">// symbol</span>\n<span class=\"t-chave\">let</span> gigante = <span class=\"t-num\">9007199254740993n</span>;  <span class=\"t-com\">// bigint</span></code></pre></figure>\n<p><code>null</code> vs <code>undefined</code>: <code>undefined</code> é \"essa caixa nunca foi preenchida\". <code>null</code> é \"essa caixa foi esvaziada de propósito\".</p>","ancoras":[],"minutos":4},{"id":"a3-2","codigo":"3.2","titulo":"A armadilha da coerção de tipos","nivel":"Básico","quando":"","html":"<p>JavaScript converte tipos sozinho, e isso gera resultados absurdos:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-str\">\"5\"</span> + <span class=\"t-num\">3</span>      <span class=\"t-com\">// \"53\"   — vira texto</span>\n<span class=\"t-str\">\"5\"</span> - <span class=\"t-num\">3</span>      <span class=\"t-com\">// 2      — vira número</span>\n[] + {}      <span class=\"t-com\">// \"[object Object]\"</span>\n<span class=\"t-num\">0</span> == <span class=\"t-str\">\"0\"</span>     <span class=\"t-com\">// true   — compara depois de converter</span>\n<span class=\"t-num\">0</span> === <span class=\"t-str\">\"0\"</span>    <span class=\"t-com\">// false  — compara tipo E valor</span></code></pre></figure>\n<aside class=\"destaque destaque-regra\"><strong>Use sempre <code>===</code> e <code>!==</code>, nunca <code>==</code> e <code>!=</code>.</strong> O <code>===</code> compara sem converter. Esta é uma das primeiras coisas que um entrevistador pergunta.</aside>\n<p>Valores \"falsy\" (que viram <code>false</code> numa condição) — decore os seis:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">false</span>, <span class=\"t-num\">0</span>, <span class=\"t-str\">\"\"</span>, <span class=\"t-chave\">null</span>, <span class=\"t-chave\">undefined</span>, <span class=\"t-chave\">NaN</span></code></pre></figure>\n<p>Todo o resto é <code>true</code>, inclusive <code>\"0\"</code>, <code>[]</code> e <code>{}</code>.</p>","ancoras":[],"minutos":4},{"id":"a3-3","codigo":"3.3","titulo":"Estruturas de controle","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Condicional</span>\n<span class=\"t-chave\">if</span> (idade &gt;= <span class=\"t-num\">18</span>) {\n    console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">\"Maior\"</span>);\n} <span class=\"t-chave\">else</span> <span class=\"t-chave\">if</span> (idade &gt;= <span class=\"t-num\">16</span>) {\n    console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">\"Pode votar\"</span>);\n} <span class=\"t-chave\">else</span> {\n    console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">\"Menor\"</span>);\n}\n\n<span class=\"t-com\">// Ternário — if compacto para atribuição</span>\n<span class=\"t-chave\">const</span> status = idade &gt;= <span class=\"t-num\">18</span> ? <span class=\"t-str\">\"adulto\"</span> : <span class=\"t-str\">\"menor\"</span>;\n\n<span class=\"t-com\">// Switch</span>\n<span class=\"t-chave\">switch</span> (dia) {\n    <span class=\"t-chave\">case</span> <span class=\"t-str\">\"sábado\"</span>:\n    <span class=\"t-chave\">case</span> <span class=\"t-str\">\"domingo\"</span>:\n        console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">\"Fim de semana\"</span>);\n        <span class=\"t-chave\">break</span>;      <span class=\"t-com\">// sem o break, ele continua nos casos seguintes</span>\n    <span class=\"t-chave\">default</span>:\n        console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">\"Dia útil\"</span>);\n}\n\n<span class=\"t-com\">// Laços</span>\n<span class=\"t-chave\">for</span> (<span class=\"t-chave\">let</span> i = <span class=\"t-num\">0</span>; i &lt; <span class=\"t-num\">5</span>; i++) { }\n\n<span class=\"t-chave\">const</span> frutas = [<span class=\"t-str\">\"maçã\"</span>, <span class=\"t-str\">\"uva\"</span>];\n<span class=\"t-chave\">for</span> (<span class=\"t-chave\">const</span> fruta <span class=\"t-chave\">of</span> frutas) { }        <span class=\"t-com\">// for...of: valores de array</span>\n\n<span class=\"t-chave\">const</span> pessoa = { nome: <span class=\"t-str\">\"Ana\"</span>, idade: <span class=\"t-num\">30</span> };\n<span class=\"t-chave\">for</span> (<span class=\"t-chave\">const</span> chave <span class=\"t-chave\">in</span> pessoa) { }        <span class=\"t-com\">// for...in: chaves de objeto</span>\n\n<span class=\"t-chave\">while</span> (condicao) { }\n<span class=\"t-chave\">do</span> { } <span class=\"t-chave\">while</span> (condicao);               <span class=\"t-com\">// executa ao menos uma vez</span></code></pre></figure>","ancoras":[],"minutos":4},{"id":"a3-4","codigo":"3.4","titulo":"Funções","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Declaração</span>\n<span class=\"t-chave\">function</span> <span class=\"t-fn\">somar</span>(a, b) {\n    <span class=\"t-chave\">return</span> a + b;\n}\n\n<span class=\"t-com\">// Expressão</span>\n<span class=\"t-chave\">const</span> somar2 = <span class=\"t-chave\">function</span>(a, b) { <span class=\"t-chave\">return</span> a + b; };\n\n<span class=\"t-com\">// Arrow function — a forma moderna</span>\n<span class=\"t-chave\">const</span> somar3 = (a, b) =&gt; a + b;\n\n<span class=\"t-com\">// Com corpo</span>\n<span class=\"t-chave\">const</span> saudar = (nome) =&gt; {\n    <span class=\"t-chave\">const</span> msg = <span class=\"t-str\">`Olá, ${nome}!`</span>;\n    <span class=\"t-chave\">return</span> msg;\n};\n\n<span class=\"t-com\">// Parâmetro padrão</span>\n<span class=\"t-chave\">function</span> <span class=\"t-fn\">saudar2</span>(nome = <span class=\"t-str\">\"visitante\"</span>) {\n    <span class=\"t-chave\">return</span> <span class=\"t-str\">`Olá, ${nome}`</span>;\n}\n\n<span class=\"t-com\">// Rest: junta o resto num array</span>\n<span class=\"t-chave\">function</span> <span class=\"t-fn\">somarTudo</span>(...numeros) {\n    <span class=\"t-chave\">return</span> numeros.<span class=\"t-fn\">reduce</span>((total, n) =&gt; total + n, <span class=\"t-num\">0</span>);\n}\n<span class=\"t-fn\">somarTudo</span>(<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">4</span>);   <span class=\"t-com\">// 10</span></code></pre></figure>\n<p><strong>Template string</strong> (as crases) merecem destaque:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> nome = <span class=\"t-str\">\"Ana\"</span>;\n<span class=\"t-chave\">const</span> idade = <span class=\"t-num\">30</span>;\n\n<span class=\"t-com\">// Ruim</span>\n<span class=\"t-chave\">const</span> msg1 = <span class=\"t-str\">\"Olá \"</span> + nome + <span class=\"t-str\">\", você tem \"</span> + idade + <span class=\"t-str\">\" anos\"</span>;\n\n<span class=\"t-com\">// Bom</span>\n<span class=\"t-chave\">const</span> msg2 = <span class=\"t-str\">`Olá ${nome}, você tem ${idade} anos`</span>;\n\n<span class=\"t-com\">// Aceita várias linhas</span>\n<span class=\"t-chave\">const</span> html = <span class=\"t-str\">`\n    &lt;div&gt;\n        &lt;h1&gt;${nome}&lt;/h1&gt;\n    &lt;/div&gt;\n`</span>;</code></pre></figure>\n<hr>","ancoras":[],"minutos":4},{"id":"a3-5","codigo":"3.5","titulo":"Arrays e seus métodos","nivel":"Intermediário","quando":"","html":"<p>Se você dominar esta seção, você já escreve JavaScript melhor que muita gente empregada.</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> numeros = [<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">4</span>, <span class=\"t-num\">5</span>];</code></pre></figure>\n<p><strong>Os que transformam (retornam array novo, não mexem no original):</strong></p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// map — transforma cada item</span>\n<span class=\"t-chave\">const</span> dobrados = numeros.<span class=\"t-fn\">map</span>(n =&gt; n * <span class=\"t-num\">2</span>);          <span class=\"t-com\">// [2,4,6,8,10]</span>\n\n<span class=\"t-com\">// filter — mantém só quem passa no teste</span>\n<span class=\"t-chave\">const</span> pares = numeros.<span class=\"t-fn\">filter</span>(n =&gt; n % <span class=\"t-num\">2</span> === <span class=\"t-num\">0</span>);    <span class=\"t-com\">// [2,4]</span>\n\n<span class=\"t-com\">// reduce — reduz o array a um único valor</span>\n<span class=\"t-chave\">const</span> soma = numeros.<span class=\"t-fn\">reduce</span>((acc, n) =&gt; acc + n, <span class=\"t-num\">0</span>);   <span class=\"t-com\">// 15</span></code></pre></figure>\n<p>O <code>reduce</code> assusta. Destrinchando: <code>acc</code> é o acumulador, <code>n</code> é o item atual, <code>0</code> é o valor inicial do acumulador.</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Volta</th><th>acc</th><th>n</th><th>acc + n</th></tr></thead><tbody><tr><td>1</td><td>0</td><td>1</td><td>1</td></tr><tr><td>2</td><td>1</td><td>2</td><td>3</td></tr><tr><td>3</td><td>3</td><td>3</td><td>6</td></tr><tr><td>4</td><td>6</td><td>4</td><td>10</td></tr><tr><td>5</td><td>10</td><td>5</td><td>15</td></tr></tbody></table></div>\n<p><strong>Os que buscam:</strong></p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>numeros.<span class=\"t-fn\">find</span>(n =&gt; n &gt; <span class=\"t-num\">3</span>);        <span class=\"t-com\">// 4 — o primeiro que bate</span>\nnumeros.<span class=\"t-fn\">findIndex</span>(n =&gt; n &gt; <span class=\"t-num\">3</span>);   <span class=\"t-com\">// 3 — a posição dele</span>\nnumeros.<span class=\"t-fn\">includes</span>(<span class=\"t-num\">3</span>);             <span class=\"t-com\">// true</span>\nnumeros.<span class=\"t-fn\">some</span>(n =&gt; n &gt; <span class=\"t-num\">4</span>);        <span class=\"t-com\">// true — algum bate?</span>\nnumeros.<span class=\"t-fn\">every</span>(n =&gt; n &gt; <span class=\"t-num\">0</span>);       <span class=\"t-com\">// true — todos batem?</span></code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>Os que modificam o original (cuidado):</strong></aside>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>numeros.<span class=\"t-fn\">push</span>(<span class=\"t-num\">6</span>);        <span class=\"t-com\">// adiciona no fim</span>\nnumeros.<span class=\"t-fn\">pop</span>();          <span class=\"t-com\">// remove do fim</span>\nnumeros.<span class=\"t-fn\">shift</span>();        <span class=\"t-com\">// remove do início</span>\nnumeros.<span class=\"t-fn\">unshift</span>(<span class=\"t-num\">0</span>);     <span class=\"t-com\">// adiciona no início</span>\nnumeros.<span class=\"t-fn\">splice</span>(<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>);   <span class=\"t-com\">// remove 2 itens a partir do índice 1</span>\nnumeros.<span class=\"t-fn\">sort</span>();         <span class=\"t-com\">// ordena — cuidado, ordena como TEXTO por padrão</span></code></pre></figure>\n<p>Armadilha do <code>sort</code>:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>[<span class=\"t-num\">10</span>, <span class=\"t-num\">9</span>, <span class=\"t-num\">100</span>].<span class=\"t-fn\">sort</span>();                  <span class=\"t-com\">// [10, 100, 9] — errado!</span>\n[<span class=\"t-num\">10</span>, <span class=\"t-num\">9</span>, <span class=\"t-num\">100</span>].<span class=\"t-fn\">sort</span>((a, b) =&gt; a - b);   <span class=\"t-com\">// [9, 10, 100] — certo</span></code></pre></figure>\n<p><strong>Encadeamento</strong> — onde a coisa fica elegante:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> produtos = [\n    { nome: <span class=\"t-str\">\"Camisa\"</span>, preco: <span class=\"t-num\">50</span>, estoque: <span class=\"t-num\">3</span> },\n    { nome: <span class=\"t-str\">\"Calça\"</span>, preco: <span class=\"t-num\">120</span>, estoque: <span class=\"t-num\">0</span> },\n    { nome: <span class=\"t-str\">\"Boné\"</span>, preco: <span class=\"t-num\">30</span>, estoque: <span class=\"t-num\">7</span> }\n];\n\n<span class=\"t-chave\">const</span> totalDisponivel = produtos\n    .<span class=\"t-fn\">filter</span>(p =&gt; p.estoque &gt; <span class=\"t-num\">0</span>)\n    .<span class=\"t-fn\">map</span>(p =&gt; p.preco * p.estoque)\n    .<span class=\"t-fn\">reduce</span>((soma, valor) =&gt; soma + valor, <span class=\"t-num\">0</span>);</code></pre></figure>\n<p>Leia de cima para baixo: filtra os que têm estoque, calcula o valor de cada, soma tudo. Compare com fazer isso usando <code>for</code> — funciona igual, mas você lê a intenção direto.</p>","ancoras":[],"minutos":4},{"id":"a3-6","codigo":"3.6","titulo":"Objetos","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> usuario = {\n    nome: <span class=\"t-str\">\"Ana\"</span>,\n    idade: <span class=\"t-num\">30</span>,\n    endereco: {\n        cidade: <span class=\"t-str\">\"Fortaleza\"</span>,\n        estado: <span class=\"t-str\">\"CE\"</span>\n    },\n    <span class=\"t-fn\">saudar</span>() {\n        <span class=\"t-chave\">return</span> <span class=\"t-str\">`Oi, sou ${this.nome}`</span>;\n    }\n};\n\nusuario.nome;                    <span class=\"t-com\">// \"Ana\"</span>\nusuario[<span class=\"t-str\">\"nome\"</span>];                 <span class=\"t-com\">// igual, útil quando a chave é variável</span>\nusuario.endereco.cidade;         <span class=\"t-com\">// \"Fortaleza\"</span>\nusuario.telefone?.numero;        <span class=\"t-com\">// undefined em vez de erro (optional chaining)</span></code></pre></figure>\n<p><strong>Desestruturação</strong> — extrai propriedades em variáveis:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> { nome, idade } = usuario;\n<span class=\"t-chave\">const</span> { cidade } = usuario.endereco;\n<span class=\"t-chave\">const</span> { telefone = <span class=\"t-str\">\"não informado\"</span> } = usuario;   <span class=\"t-com\">// com valor padrão</span>\n\n<span class=\"t-com\">// Funciona com arrays também</span>\n<span class=\"t-chave\">const</span> [primeiro, segundo] = [<span class=\"t-num\">10</span>, <span class=\"t-num\">20</span>];\n\n<span class=\"t-com\">// E em parâmetros de função</span>\n<span class=\"t-chave\">function</span> <span class=\"t-fn\">mostrar</span>({ nome, idade }) {\n    console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">`${nome}, ${idade}`</span>);\n}\n<span class=\"t-fn\">mostrar</span>(usuario);</code></pre></figure>\n<p><strong>Spread</strong> — espalha o conteúdo:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> copia = { ...usuario };                    <span class=\"t-com\">// cópia rasa</span>\n<span class=\"t-chave\">const</span> atualizado = { ...usuario, idade: <span class=\"t-num\">31</span> };    <span class=\"t-com\">// copia e sobrescreve</span>\n<span class=\"t-chave\">const</span> juntos = [...array1, ...array2];           <span class=\"t-com\">// concatena arrays</span></code></pre></figure>\n<p>Isso é a base de como se trabalha com dados em React — nunca modificar, sempre criar um novo com a mudança.</p>","ancoras":[],"minutos":4},{"id":"a3-7","codigo":"3.7","titulo":"DOM: fazendo a página reagir","nivel":"Intermediário","quando":"","html":"<p>Aqui o JavaScript encosta no HTML que você aprendeu.</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Selecionar</span>\n<span class=\"t-chave\">const</span> titulo = document.<span class=\"t-fn\">querySelector</span>(<span class=\"t-str\">\"h1\"</span>);\n<span class=\"t-chave\">const</span> botoes = document.<span class=\"t-fn\">querySelectorAll</span>(<span class=\"t-str\">\".btn\"</span>);\n<span class=\"t-chave\">const</span> campo = document.<span class=\"t-fn\">getElementById</span>(<span class=\"t-str\">\"email\"</span>);\n\n<span class=\"t-com\">// Modificar</span>\ntitulo.textContent = <span class=\"t-str\">\"Novo título\"</span>;        <span class=\"t-com\">// texto puro, seguro</span>\ntitulo.innerHTML = <span class=\"t-str\">\"&lt;b&gt;Negrito&lt;/b&gt;\"</span>;       <span class=\"t-com\">// interpreta HTML — cuidado com XSS</span>\ntitulo.style.color = <span class=\"t-str\">\"red\"</span>;\ntitulo.classList.<span class=\"t-fn\">add</span>(<span class=\"t-str\">\"destaque\"</span>);\ntitulo.classList.<span class=\"t-fn\">remove</span>(<span class=\"t-str\">\"oculto\"</span>);\ntitulo.classList.<span class=\"t-fn\">toggle</span>(<span class=\"t-str\">\"aberto\"</span>);         <span class=\"t-com\">// liga/desliga</span>\n\n<span class=\"t-com\">// Atributos</span>\ncampo.value = <span class=\"t-str\">\"teste@email.com\"</span>;\ncampo.<span class=\"t-fn\">setAttribute</span>(<span class=\"t-str\">\"disabled\"</span>, <span class=\"t-str\">\"true\"</span>);\n\n<span class=\"t-com\">// Criar e inserir</span>\n<span class=\"t-chave\">const</span> novo = document.<span class=\"t-fn\">createElement</span>(<span class=\"t-str\">\"li\"</span>);\nnovo.textContent = <span class=\"t-str\">\"Item novo\"</span>;\ndocument.<span class=\"t-fn\">querySelector</span>(<span class=\"t-str\">\"ul\"</span>).<span class=\"t-fn\">appendChild</span>(novo);\n\n<span class=\"t-com\">// Remover</span>\nnovo.<span class=\"t-fn\">remove</span>();</code></pre></figure>\n<p><strong>Eventos:</strong></p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>botao.<span class=\"t-fn\">addEventListener</span>(<span class=\"t-str\">\"click\"</span>, (evento) =&gt; {\n    console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">\"Clicou!\"</span>);\n});\n\nformulario.<span class=\"t-fn\">addEventListener</span>(<span class=\"t-str\">\"submit\"</span>, (e) =&gt; {\n    e.<span class=\"t-fn\">preventDefault</span>();     <span class=\"t-com\">// impede o recarregamento da página</span>\n    <span class=\"t-chave\">const</span> dados = <span class=\"t-chave\">new</span> <span class=\"t-fn\">FormData</span>(formulario);\n    console.<span class=\"t-fn\">log</span>(dados.<span class=\"t-chave\">get</span>(<span class=\"t-str\">\"email\"</span>));\n});\n\ncampo.<span class=\"t-fn\">addEventListener</span>(<span class=\"t-str\">\"input\"</span>, (e) =&gt; {\n    console.<span class=\"t-fn\">log</span>(e.target.value);   <span class=\"t-com\">// dispara a cada tecla</span>\n});</code></pre></figure>\n<p><strong>Delegação de eventos</strong> — técnica que separa iniciante de intermediário:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Ruim: um listener por item. E itens criados depois não funcionam</span>\ndocument.<span class=\"t-fn\">querySelectorAll</span>(<span class=\"t-str\">\".item\"</span>).<span class=\"t-fn\">forEach</span>(item =&gt; {\n    item.<span class=\"t-fn\">addEventListener</span>(<span class=\"t-str\">\"click\"</span>, fazerAlgo);\n});\n\n<span class=\"t-com\">// Bom: um listener no pai, que pega os filhos atuais e futuros</span>\ndocument.<span class=\"t-fn\">querySelector</span>(<span class=\"t-str\">\".lista\"</span>).<span class=\"t-fn\">addEventListener</span>(<span class=\"t-str\">\"click\"</span>, (e) =&gt; {\n    <span class=\"t-chave\">if</span> (e.target.<span class=\"t-fn\">matches</span>(<span class=\"t-str\">\".item\"</span>)) {\n        <span class=\"t-fn\">fazerAlgo</span>(e);\n    }\n});</code></pre></figure>\n<p>Funciona porque o evento \"borbulha\" do elemento clicado para cima, passando pelos pais.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a3-8","codigo":"3.8","titulo":"Escopo, hoisting e closures","nivel":"Avançado","quando":"","html":"<p><strong>Escopo</strong> é onde uma variável existe:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">let</span> global = <span class=\"t-str\">\"todo mundo vê\"</span>;\n\n<span class=\"t-chave\">function</span> <span class=\"t-fn\">minhaFuncao</span>() {\n    <span class=\"t-chave\">let</span> local = <span class=\"t-str\">\"só aqui dentro\"</span>;\n    <span class=\"t-chave\">if</span> (<span class=\"t-chave\">true</span>) {\n        <span class=\"t-chave\">let</span> bloco = <span class=\"t-str\">\"só neste bloco\"</span>;      <span class=\"t-com\">// let/const respeitam bloco</span>\n        <span class=\"t-chave\">var</span> funcao = <span class=\"t-str\">\"vaza para a função\"</span>;  <span class=\"t-com\">// var ignora bloco</span>\n    }\n    console.<span class=\"t-fn\">log</span>(bloco);   <span class=\"t-com\">// ERRO</span>\n    console.<span class=\"t-fn\">log</span>(funcao);  <span class=\"t-com\">// funciona — por isso var é ruim</span>\n}</code></pre></figure>\n<p><strong>Closure</strong> — uma função que \"lembra\" do ambiente onde foi criada:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">function</span> <span class=\"t-fn\">criarContador</span>() {\n    <span class=\"t-chave\">let</span> contagem = <span class=\"t-num\">0</span>;              <span class=\"t-com\">// vive fora da função interna</span>\n\n    <span class=\"t-chave\">return</span> <span class=\"t-chave\">function</span>() {\n        contagem++;\n        <span class=\"t-chave\">return</span> contagem;\n    };\n}\n\n<span class=\"t-chave\">const</span> contar = <span class=\"t-fn\">criarContador</span>();\n<span class=\"t-fn\">contar</span>();   <span class=\"t-com\">// 1</span>\n<span class=\"t-fn\">contar</span>();   <span class=\"t-com\">// 2</span>\n<span class=\"t-fn\">contar</span>();   <span class=\"t-com\">// 3</span></code></pre></figure>\n<p>A variável <code>contagem</code> deveria ter morrido quando <code>criarContador</code> terminou. Mas a função retornada mantém uma referência viva a ela. É assim que se cria estado privado em JavaScript, e é uma das perguntas de entrevista mais frequentes.</p>","ancoras":[],"minutos":4},{"id":"a3-9","codigo":"3.9","titulo":"Assincronismo","nivel":"Avançado","quando":"","html":"<p>JavaScript executa <strong>uma coisa por vez</strong> (é single-thread). Se uma operação demora — buscar dados de um servidor, ler um arquivo — a página inteira travaria. A solução é o código assíncrono.</p>\n<p><strong>Promise</strong> — uma promessa de valor futuro:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> promessa = <span class=\"t-chave\">new</span> <span class=\"t-fn\">Promise</span>((resolve, reject) =&gt; {\n    <span class=\"t-fn\">setTimeout</span>(() =&gt; {\n        <span class=\"t-chave\">const</span> deuCerto = <span class=\"t-chave\">true</span>;\n        <span class=\"t-chave\">if</span> (deuCerto) <span class=\"t-fn\">resolve</span>(<span class=\"t-str\">\"Sucesso!\"</span>);\n        <span class=\"t-chave\">else</span> <span class=\"t-fn\">reject</span>(<span class=\"t-str\">\"Falhou\"</span>);\n    }, <span class=\"t-num\">1000</span>);\n});\n\npromessa\n    .<span class=\"t-fn\">then</span>(resultado =&gt; console.<span class=\"t-fn\">log</span>(resultado))\n    .<span class=\"t-chave\">catch</span>(erro =&gt; console.<span class=\"t-fn\">error</span>(erro))\n    .<span class=\"t-chave\">finally</span>(() =&gt; console.<span class=\"t-fn\">log</span>(<span class=\"t-str\">\"Acabou, deu certo ou não\"</span>));</code></pre></figure>\n<p><strong>async/await</strong> — a mesma coisa, escrita de forma legível:</p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">async</span> <span class=\"t-chave\">function</span> <span class=\"t-fn\">buscarUsuario</span>(id) {\n    <span class=\"t-chave\">try</span> {\n        <span class=\"t-chave\">const</span> resposta = <span class=\"t-chave\">await</span> <span class=\"t-fn\">fetch</span>(<span class=\"t-str\">`https://api.exemplo.com/users/${id}`</span>);\n\n        <span class=\"t-chave\">if</span> (!resposta.ok) {\n            <span class=\"t-chave\">throw</span> <span class=\"t-chave\">new</span> <span class=\"t-fn\">Error</span>(<span class=\"t-str\">`Erro HTTP: ${resposta.status}`</span>);\n        }\n\n        <span class=\"t-chave\">const</span> dados = <span class=\"t-chave\">await</span> resposta.<span class=\"t-fn\">json</span>();\n        <span class=\"t-chave\">return</span> dados;\n\n    } <span class=\"t-chave\">catch</span> (erro) {\n        console.<span class=\"t-fn\">error</span>(<span class=\"t-str\">\"Falhou:\"</span>, erro.message);\n        <span class=\"t-chave\">return</span> <span class=\"t-chave\">null</span>;\n    }\n}\n\n<span class=\"t-com\">// Usando</span>\n<span class=\"t-chave\">const</span> usuario = <span class=\"t-chave\">await</span> <span class=\"t-fn\">buscarUsuario</span>(<span class=\"t-num\">1</span>);</code></pre></figure>\n<p><code>await</code> pausa a função até a promessa resolver, sem travar o resto da página. Só funciona dentro de função <code>async</code>.</p>\n<p><strong>Requisições em paralelo:</strong></p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Lento: espera uma terminar para começar a outra (2 segundos)</span>\n<span class=\"t-chave\">const</span> a = <span class=\"t-chave\">await</span> <span class=\"t-fn\">buscar1</span>();\n<span class=\"t-chave\">const</span> b = <span class=\"t-chave\">await</span> <span class=\"t-fn\">buscar2</span>();\n\n<span class=\"t-com\">// Rápido: dispara as duas juntas (1 segundo)</span>\n<span class=\"t-chave\">const</span> [a, b] = <span class=\"t-chave\">await</span> Promise.<span class=\"t-fn\">all</span>([<span class=\"t-fn\">buscar1</span>(), <span class=\"t-fn\">buscar2</span>()]);</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a3-10","codigo":"3.10","titulo":"Consumindo APIs","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">async</span> <span class=\"t-chave\">function</span> <span class=\"t-fn\">carregarPosts</span>() {\n    <span class=\"t-chave\">const</span> lista = document.<span class=\"t-fn\">querySelector</span>(<span class=\"t-str\">\"#posts\"</span>);\n    lista.innerHTML = <span class=\"t-str\">\"&lt;li&gt;Carregando...&lt;/li&gt;\"</span>;\n\n    <span class=\"t-chave\">try</span> {\n        <span class=\"t-chave\">const</span> resposta = <span class=\"t-chave\">await</span> <span class=\"t-fn\">fetch</span>(<span class=\"t-str\">\"https://jsonplaceholder.typicode.com/posts\"</span>);\n        <span class=\"t-chave\">const</span> posts = <span class=\"t-chave\">await</span> resposta.<span class=\"t-fn\">json</span>();\n\n        lista.innerHTML = posts\n            .<span class=\"t-fn\">slice</span>(<span class=\"t-num\">0</span>, <span class=\"t-num\">10</span>)\n            .<span class=\"t-fn\">map</span>(post =&gt; <span class=\"t-str\">`&lt;li&gt;&lt;strong&gt;${post.title}&lt;/strong&gt;&lt;/li&gt;`</span>)\n            .<span class=\"t-fn\">join</span>(<span class=\"t-str\">\"\"</span>);\n\n    } <span class=\"t-chave\">catch</span> (erro) {\n        lista.innerHTML = <span class=\"t-str\">\"&lt;li&gt;Erro ao carregar. Tente novamente.&lt;/li&gt;\"</span>;\n    }\n}</code></pre></figure>\n<p><code>https://jsonplaceholder.typicode.com</code> é uma API pública gratuita feita para treino. Use bastante.</p>\n<p><strong>POST com corpo:</strong></p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">const</span> resposta = <span class=\"t-chave\">await</span> <span class=\"t-fn\">fetch</span>(<span class=\"t-str\">\"https://api.exemplo.com/posts\"</span>, {\n    method: <span class=\"t-str\">\"POST\"</span>,\n    headers: { <span class=\"t-str\">\"Content-Type\"</span>: <span class=\"t-str\">\"application/json\"</span> },\n    body: JSON.<span class=\"t-fn\">stringify</span>({ titulo: <span class=\"t-str\">\"Meu post\"</span>, texto: <span class=\"t-str\">\"Conteúdo\"</span> })\n});</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a3-11","codigo":"3.11","titulo":"Classes e orientação a objetos","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">class</span> Animal {\n    #segredo = <span class=\"t-str\">\"privado\"</span>;      <span class=\"t-com\">// campo privado de verdade</span>\n\n    <span class=\"t-fn\">constructor</span>(nome, idade) {\n        <span class=\"t-chave\">this</span>.nome = nome;\n        <span class=\"t-chave\">this</span>.idade = idade;\n    }\n\n    <span class=\"t-fn\">fazerSom</span>() {\n        <span class=\"t-chave\">return</span> <span class=\"t-str\">\"Som genérico\"</span>;\n    }\n\n    <span class=\"t-chave\">get</span> <span class=\"t-fn\">descricao</span>() {\n        <span class=\"t-chave\">return</span> <span class=\"t-str\">`${this.nome}, ${this.idade} anos`</span>;\n    }\n\n    <span class=\"t-chave\">static</span> <span class=\"t-fn\">criarFilhote</span>(nome) {     <span class=\"t-com\">// método da classe, não da instância</span>\n        <span class=\"t-chave\">return</span> <span class=\"t-chave\">new</span> <span class=\"t-fn\">Animal</span>(nome, <span class=\"t-num\">0</span>);\n    }\n}\n\n<span class=\"t-chave\">class</span> Cachorro <span class=\"t-chave\">extends</span> Animal {\n    <span class=\"t-fn\">constructor</span>(nome, idade, raca) {\n        <span class=\"t-chave\">super</span>(nome, idade);      <span class=\"t-com\">// chama o construtor do pai</span>\n        <span class=\"t-chave\">this</span>.raca = raca;\n    }\n\n    <span class=\"t-fn\">fazerSom</span>() {                 <span class=\"t-com\">// sobrescreve o método do pai</span>\n        <span class=\"t-chave\">return</span> <span class=\"t-str\">\"Au au!\"</span>;\n    }\n}\n\n<span class=\"t-chave\">const</span> rex = <span class=\"t-chave\">new</span> <span class=\"t-fn\">Cachorro</span>(<span class=\"t-str\">\"Rex\"</span>, <span class=\"t-num\">3</span>, <span class=\"t-str\">\"Labrador\"</span>);\nrex.<span class=\"t-fn\">fazerSom</span>();      <span class=\"t-com\">// \"Au au!\"</span>\nrex.descricao;       <span class=\"t-com\">// \"Rex, 3 anos\"</span></code></pre></figure>\n<p>Você vai ver isso de novo no C++, com a mesma lógica e sintaxe diferente.</p>","ancoras":[],"minutos":4},{"id":"a3-12","codigo":"3.12","titulo":"Módulos e ferramentas","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// arquivo: matematica.js</span>\n<span class=\"t-chave\">export</span> <span class=\"t-chave\">function</span> <span class=\"t-fn\">somar</span>(a, b) { <span class=\"t-chave\">return</span> a + b; }\n<span class=\"t-chave\">export</span> <span class=\"t-chave\">const</span> PI = <span class=\"t-num\">3.14159</span>;\n<span class=\"t-chave\">export</span> <span class=\"t-chave\">default</span> <span class=\"t-chave\">class</span> Calculadora { }\n\n<span class=\"t-com\">// arquivo: main.js</span>\n<span class=\"t-chave\">import</span> Calculadora, { somar, PI } <span class=\"t-chave\">from</span> <span class=\"t-str\">'./matematica.js'</span>;</code></pre></figure>\n<p>No HTML: <code>&lt;script type=\"module\" src=\"main.js\"&gt;&lt;/script&gt;</code></p>\n<p><strong>Armazenamento no navegador:</strong></p>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>localStorage.<span class=\"t-fn\">setItem</span>(<span class=\"t-str\">\"tema\"</span>, <span class=\"t-str\">\"escuro\"</span>);        <span class=\"t-com\">// persiste após fechar</span>\n<span class=\"t-chave\">const</span> tema = localStorage.<span class=\"t-fn\">getItem</span>(<span class=\"t-str\">\"tema\"</span>);\nlocalStorage.<span class=\"t-fn\">removeItem</span>(<span class=\"t-str\">\"tema\"</span>);\n\n<span class=\"t-com\">// Guardando objetos: precisa converter para texto</span>\nlocalStorage.<span class=\"t-fn\">setItem</span>(<span class=\"t-str\">\"usuario\"</span>, JSON.<span class=\"t-fn\">stringify</span>({ nome: <span class=\"t-str\">\"Ana\"</span> }));\n<span class=\"t-chave\">const</span> usuario = JSON.<span class=\"t-fn\">parse</span>(localStorage.<span class=\"t-fn\">getItem</span>(<span class=\"t-str\">\"usuario\"</span>));</code></pre></figure>\n<p><strong>Depois de dominar o JS puro</strong> (e só depois), o próximo passo natural é: Git + GitHub → Node.js e npm → um framework (React é o mais pedido em vaga no Brasil). Mas não pule para React sem ter feito os projetos abaixo em JavaScript puro. Framework em cima de base fraca produz gente que sabe React e não sabe programar — e isso aparece na entrevista técnica.</p>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[{"titulo":"Lista de tarefas (fundamentos + DOM)","rotulo":"Projeto 1","resumo":"<p>Adicionar, marcar como concluída, remover, filtrar por status, salvar no localStorage. Sem framework.</p>","requisitos":[],"criterio":""},{"titulo":"Consumidor de API (assincronismo)","rotulo":"Projeto 2","resumo":"<p>Escolha uma API pública (clima, filmes, CEP, Pokémon). Campo de busca, tela de carregamento, tratamento de erro, exibição em cards. Este é o projeto que mais impressiona recrutador júnior.</p>","requisitos":[],"criterio":""},{"titulo":"Aplicação com estado (integração)","rotulo":"Projeto 3","resumo":"<p>Carrinho de compras ou controle financeiro pessoal. Adicionar itens, calcular totais, editar, remover, persistir, filtrar por categoria, mostrar um resumo.</p>\n<hr>","requisitos":[],"criterio":""}],"checklist":["Sei por que usar <code>===</code> em vez de <code>==</code> e listo os 6 valores falsy","Escrevo <code>map</code>, <code>filter</code> e <code>reduce</code> sem consultar","Explico closure com um exemplo próprio","Consumo uma API com async/await tratando erro","Uso delegação de eventos e sei por que ela funciona","Sei a diferença entre <code>let</code>, <code>const</code> e <code>var</code>","Meus 3 projetos estão no GitHub com README"],"quiz":[{"p":"Em JavaScript, quanto valem <code>\"5\" + 3</code> e <code>\"5\" - 3</code>?","o":["<code>8</code> e <code>2</code>","<code>\"53\"</code> e <code>2</code>","<code>\"53\"</code> e <code>\"53\"</code>","Erro nos dois casos"],"c":1,"e":"O <code>+</code> é ambíguo — serve para somar e para concatenar, então vira texto. O <code>-</code> só existe para números, então converte. É a coerção de tipos, e é por isso que se usa <code>===</code>."},{"p":"Quais são os seis valores <em>falsy</em>?","o":["<code>false, 0, \"\", null, undefined, NaN</code>","<code>false, 0, \"0\", null, undefined, []</code>","<code>false, 0, \"\", [], {}, null</code>","<code>false, null, undefined, NaN, [], {}</code>"],"c":0,"e":"Todo o resto é verdadeiro — inclusive <code>\"0\"</code>, <code>[]</code> e <code>{}</code>, que enganam muita gente numa condição."},{"p":"O que <code>[10, 9, 100].sort()</code> devolve?","o":["<code>[9, 10, 100]</code>","<code>[10, 100, 9]</code>","<code>[100, 10, 9]</code>","<code>[10, 9, 100]</code>"],"c":1,"e":"O <code>sort()</code> ordena como <strong>texto</strong> por padrão, e \"100\" vem antes de \"9\" alfabeticamente. Para número: <code>sort((a, b) =&gt; a - b)</code>."},{"p":"Numa <em>closure</em>, por que a variável <code>contagem</code> continua viva depois que <code>criarContador()</code> terminou?","o":["Porque foi declarada com <code>let</code>, que nunca é apagada","Porque virou global sem querer","Porque a função retornada mantém uma referência viva ao ambiente onde foi criada","Porque o garbage collector do JavaScript é preguiçoso"],"c":2,"e":"A função retornada \"lembra\" do ambiente onde nasceu. É assim que se cria estado privado em JavaScript, e é uma das perguntas de entrevista mais frequentes."},{"p":"Por que a delegação de eventos é melhor que um listener por item?","o":["Porque um listener no pai pega os filhos atuais <em>e os futuros</em>, aproveitando que o evento borbulha","Porque listeners individuais não funcionam em celular","Porque o navegador limita a 100 listeners por página","Porque <code>querySelectorAll</code> é lento"],"c":0,"e":"O evento borbulha do elemento clicado para cima, passando pelos pais. Um listener no pai, testando <code>e.target.matches('.item')</code>, cobre os itens criados depois — que um listener individual jamais alcançaria."}]},{"num":4,"nome":"Python","id":"m4","dificuldade":3,"tempo":"10 a 12 semanas","prereq":"Módulo 3 (ou Módulo 0, se preferir inverter)","faixa":{"nome":"Praticante","cor":"f3"},"objetivo":"aprofundar lógica e algoritmos numa linguagem de sintaxe limpa, e abrir as portas de back-end, automação e dados.","intro":"<p>Python tira quase toda a cerimônia da sintaxe. Sem chaves, sem ponto e vírgula, sem declaração de tipo. O que sobra é o raciocínio — por isso ele é a melhor linguagem para estudar <strong>algoritmos</strong> de verdade.</p>\n<hr>","aulas":[{"id":"a4-1","codigo":"4.1","titulo":"Sintaxe e indentação","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>nome = <span class=\"t-str\">\"Maria\"</span>\nidade = <span class=\"t-num\">30</span>\naltura = <span class=\"t-num\">1.65</span>\nestudante = <span class=\"t-chave\">True</span>\n\n<span class=\"t-fn\">print</span>(f<span class=\"t-str\">\"{nome} tem {idade} anos\"</span>)     <span class=\"t-com\"># f-string, igual à template string do JS</span></code></pre></figure>\n<p><strong>A indentação não é estilo, é sintaxe.</strong> O que em JavaScript são chaves, em Python é o recuo:</p>\n<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">if</span> idade &gt;= <span class=\"t-num\">18</span>:\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Maior de idade\"</span>)      <span class=\"t-com\"># 4 espaços definem que está dentro do if</span>\n    <span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Pode dirigir\"</span>)\n<span class=\"t-fn\">print</span>(<span class=\"t-str\">\"Fora do if\"</span>)              <span class=\"t-com\"># sem recuo, está fora</span></code></pre></figure>\n<p>Errar o recuo é erro de programa, não de estilo. Configure seu editor para usar 4 espaços (não Tab).</p>","ancoras":[],"minutos":4},{"id":"a4-2","codigo":"4.2","titulo":"Tipos e conversão","nivel":"Básico","quando":"","html":"<figu
