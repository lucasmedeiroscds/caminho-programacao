<style>/* ============================================================
   Caminho da Programação — portal de aprendizado

   Conceito: caderno e caneta. O material insiste que se comece no
   papel — pseudocódigo, teste de mesa, exercício à mão. Daí o fundo
   de papel, a tinta azul de esferográfica como cor primária e o ocre
   reservado ao que é progresso.

   As cores de faixa codificam ALTITUDE, não só dificuldade: azul para
   o que roda longe da máquina (lógica, web, Python), quente para o que
   encosta nela (C, C++). Não reordene sem revalidar contraste.
   ============================================================ */

:root {
  --fundo: #f3f3ef;
  --sup: #ffffff;
  --sup-2: #fafaf6;
  --sup-3: #eeeee8;

  --tinta: #17212c;
  --tinta-2: #40515f;
  --tinta-3: #6d7d8a;

  --caneta: #17507f;
  --caneta-viva: #1d6bab;
  --caneta-fraca: #e4edf5;

  --ocre: #a8721c;
  --ocre-fraco: #f6edda;

  --certo: #1a7a49;
  --certo-fraco: #e3f2e9;
  --erro: #ab3527;
  --erro-fraco: #fbeae7;

  --linha: #dededa;
  --linha-2: #e9e9e4;
  --grade: rgba(23, 33, 44, 0.045);

  --f1: #93b8d6;
  --f2: #5b8fbf;
  --f3: #2f6da3;
  --f4: #c07d24;
  --f5: #a03c2c;
  --ft: #7d8d9a;

  --sombra: 0 1px 2px rgba(23, 33, 44, 0.05), 0 6px 20px -12px rgba(23, 33, 44, 0.18);
  --sombra-2: 0 2px 6px rgba(23, 33, 44, 0.07), 0 16px 40px -18px rgba(23, 33, 44, 0.24);

  --raio: 10px;
  --raio-g: 16px;
  --transicao: 180ms cubic-bezier(0.22, 0.61, 0.36, 1);

  --rail: 236px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --fundo: #0f141a;
    --sup: #151d25;
    --sup-2: #1a232c;
    --sup-3: #1f2932;

    --tinta: #e7edf2;
    --tinta-2: #b4c2cd;
    --tinta-3: #7d8d9a;

    --caneta: #6ea8de;
    --caneta-viva: #8fbfe9;
    --caneta-fraca: #16283a;

    --ocre: #dda94f;
    --ocre-fraco: #2b2314;

    --certo: #43bd7c;
    --certo-fraco: #12291d;
    --erro: #e2705c;
    --erro-fraco: #2d1714;

    --linha: #29333d;
    --linha-2: #202932;
    --grade: rgba(231, 237, 242, 0.05);

    --f1: #5d86a4;
    --f2: #4d7ba6;
    --f3: #3f80bb;
    --f4: #c98d3c;
    --f5: #c25542;
    --ft: #64747f;

    --sombra: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px -12px rgba(0, 0, 0, 0.6);
    --sombra-2: 0 2px 6px rgba(0, 0, 0, 0.45), 0 16px 40px -18px rgba(0, 0, 0, 0.7);

    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --fundo: #0f141a;
  --sup: #151d25;
  --sup-2: #1a232c;
  --sup-3: #1f2932;

  --tinta: #e7edf2;
  --tinta-2: #b4c2cd;
  --tinta-3: #7d8d9a;

  --caneta: #6ea8de;
  --caneta-viva: #8fbfe9;
  --caneta-fraca: #16283a;

  --ocre: #dda94f;
  --ocre-fraco: #2b2314;

  --certo: #43bd7c;
  --certo-fraco: #12291d;
  --erro: #e2705c;
  --erro-fraco: #2d1714;

  --linha: #29333d;
  --linha-2: #202932;
  --grade: rgba(231, 237, 242, 0.05);

  --f1: #5d86a4;
  --f2: #4d7ba6;
  --f3: #3f80bb;
  --f4: #c98d3c;
  --f5: #c25542;
  --ft: #64747f;

  --sombra: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px -12px rgba(0, 0, 0, 0.6);
  --sombra-2: 0 2px 6px rgba(0, 0, 0, 0.45), 0 16px 40px -18px rgba(0, 0, 0, 0.7);

  color-scheme: dark;
}

/* ============================================================
   Base
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

/*
 * O atributo `hidden` precisa vencer o `display` das classes deste arquivo.
 *
 * A regra `[hidden]{display:none}` do navegador é folha de usuário-agente, e
 * qualquer declaração de autor a atropela — inclusive `.busca-fundo{display:grid}`.
 * Sem esta linha a busca nasce visível: uma camada `position:fixed` cobrindo a
 * tela inteira, que come todo clique da página.
 */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font-family: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 15.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: Archivo, 'Segoe UI', system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 1.18;
  text-wrap: balance;
  margin: 0;
}

a { color: var(--caneta); text-decoration-color: color-mix(in srgb, var(--caneta) 35%, transparent); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
.ext { font-size: 0.8em; opacity: 0.65; margin-left: 1px; }

button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2.5px solid var(--caneta-viva);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection { background: color-mix(in srgb, var(--ocre) 30%, transparent); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--linha); border-radius: 999px; border: 2.5px solid var(--fundo); }
::-webkit-scrollbar-thumb:hover { background: var(--tinta-3); }

.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

/* Etiqueta em versalete monoespaçado — a voz técnica da página. */
.rot {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--tinta-3);
}

.pular {
  position: absolute;
  left: -9999px;
  z-index: 99;
}
.pular:focus {
  left: 12px; top: 12px;
  padding: 10px 14px;
  background: var(--caneta);
  color: #fff;
  border-radius: var(--raio);
}

/* ============================================================
   Estrutura: trilho lateral + coluna de leitura
   ============================================================ */

.app { display: flex; min-height: 100vh; }

.trilho {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--rail);
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px 14px;
  background: var(--sup);
  border-right: 1px solid var(--linha-2);
  overflow-y: auto;
  z-index: 30;
}

.marca { display: flex; align-items: center; gap: 10px; padding: 2px 6px 0; }
.marca-glifo {
  width: 34px; height: 34px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 9px;
  background: var(--caneta);
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.04em;
}
/* Ambos são `span` dentro de `span`: sem `block` a legenda cola no nome. */
.marca-nome { display: block; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14.5px; line-height: 1.15; letter-spacing: -0.02em; }
.marca-sub { display: block; font-size: 11px; color: var(--tinta-3); line-height: 1.2; margin-top: 1px; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav a {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 9px;
  border-radius: 8px;
  color: var(--tinta-2);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  transition: background var(--transicao), color var(--transicao);
}
.nav a:hover { background: var(--sup-3); color: var(--tinta); }
.nav a[aria-current='page'] { background: var(--caneta-fraca); color: var(--caneta); font-weight: 650; }
.nav svg { width: 16px; height: 16px; flex: none; opacity: 0.75; }
.nav a[aria-current='page'] svg { opacity: 1; }
.nav-conta {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--tinta-3);
  font-variant-numeric: tabular-nums;
}

.trilho-sep { height: 1px; background: var(--linha-2); margin: 2px 6px; }

/* Anel de progresso do trilho */
.anel-caixa {
  display: flex; align-items: center; gap: 11px;
  padding: 11px;
  background: var(--sup-2);
  border: 1px solid var(--linha-2);
  border-radius: var(--raio);
}
.anel { width: 46px; height: 46px; flex: none; transform: rotate(-90deg); }
.anel circle { fill: none; stroke-width: 5; }
.anel .trilha-anel { stroke: var(--linha); }
.anel .valor-anel { stroke: var(--ocre); stroke-linecap: round; transition: stroke-dashoffset 600ms cubic-bezier(0.22, 0.61, 0.36, 1); }
.anel-pct { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.anel-txt { font-size: 11.5px; color: var(--tinta-3); line-height: 1.3; margin-top: 3px; }

.trilho-pe { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

.btn-tema, .btn-busca {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 7px 9px;
  background: var(--sup-2);
  border: 1px solid var(--linha-2);
  border-radius: 8px;
  color: var(--tinta-2);
  font-size: 13px;
  cursor: pointer;
  transition: border-color var(--transicao), background var(--transicao);
}
.btn-tema:hover, .btn-busca:hover { border-color: var(--linha); background: var(--sup-3); }
.btn-tema svg, .btn-busca svg { width: 15px; height: 15px; flex: none; }
.tecla {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--linha);
  border-radius: 4px;
  color: var(--tinta-3);
}

/* Coluna principal */
.palco {
  flex: 1;
  min-width: 0;
  margin-left: var(--rail);
  padding: 30px 32px 96px;
}
.folha { max-width: 880px; margin: 0 auto; }
.folha-larga { max-width: 1080px; margin: 0 auto; }

/* ============================================================
   Peças reutilizadas
   ============================================================ */

.cartao {
  background: var(--sup);
  border: 1px solid var(--linha-2);
  border-radius: var(--raio-g);
  box-shadow: var(--sombra);
}

.cartao-link {
  display: block;
  color: inherit;
  text-decoration: none;
  transition: transform var(--transicao), box-shadow var(--transicao), border-color var(--transicao);
}
.cartao-link:hover {
  transform: translateY(-2px);
  box-shadow: var(--sombra-2);
  border-color: var(--linha);
}

.pilha { display: flex; flex-direction: column; }
.pilha-4 { gap: 4px; } .pilha-8 { gap: 8px; } .pilha-12 { gap: 12px; }
.pilha-16 { gap: 16px; } .pilha-24 { gap: 24px; } .pilha-32 { gap: 32px; }

.cabeca { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.cabeca h1 { font-size: 27px; }
.cabeca h2 { font-size: 19px; }
.cabeca p { margin: 4px 0 0; color: var(--tinta-3); font-size: 14px; }

/* Selo de faixa: a bolinha carrega a cor da altitude */
.selo {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2.5px 9px 2.5px 7px;
  border: 1px solid var(--linha);
  border-radius: 999px;
  background: var(--sup-2);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--tinta-2);
  white-space: nowrap;
}
.selo-ponto { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.selo-simples { padding-left: 9px; }
.selo-ok { background: var(--certo-fraco); border-color: color-mix(in srgb, var(--certo) 30%, transparent); color: var(--certo); }
.selo-and { background: var(--ocre-fraco); border-color: color-mix(in srgb, var(--ocre) 32%, transparent); color: var(--ocre); }

/* Pontos de dificuldade — o mesmo glifo do material impresso */
.pontos { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; line-height: 1; }
.pontos b { font-weight: 400; }
.pontos .off { opacity: 0.28; }

/* Barra de progresso */
.barra { height: 5px; background: var(--linha-2); border-radius: 999px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--ocre); border-radius: 999px; transition: width 500ms cubic-bezier(0.22, 0.61, 0.36, 1); }
.barra-fina { height: 3px; }
.barra.cheia i { background: var(--certo); }

/* Ladrilho de número */
.ladrilhos { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
.ladrilho { padding: 12px 14px; background: var(--sup); border: 1px solid var(--linha-2); border-radius: var(--raio); }
.ladrilho .v { font-family: 'JetBrains Mono', monospace; font-size: 25px; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.ladrilho .v small { font-size: 14px; font-weight: 500; color: var(--tinta-3); margin-left: 1px; }
.ladrilho .r { font-size: 12px; color: var(--tinta-3); margin-top: 3px; }

/* ============================================================
   Conteúdo de aula — a tipografia que carrega o material
   ============================================================ */

.prosa { font-size: 15.5px; line-height: 1.68; }
.prosa > * + * { margin-top: 15px; }
.prosa p { margin: 0; max-width: 68ch; }
.prosa .tit-3 {
  font-size: 18px;
  margin-top: 34px;
  padding-top: 3px;
  scroll-margin-top: 88px;
}
.prosa .tit-2 { font-size: 21px; margin-top: 36px; scroll-margin-top: 88px; }
.prosa .tit-4 { font-size: 15.5px; margin-top: 24px; }
.tit-nota { font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 400; color: var(--tinta-3); letter-spacing: 0; }

.prosa ul, .prosa ol { margin: 0; padding-left: 22px; max-width: 68ch; }
.prosa li { margin: 5px 0; }
.prosa li::marker { color: var(--tinta-3); }
.prosa ol li::marker { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

.prosa strong { font-weight: 650; }
.prosa hr { border: 0; border-top: 1px solid var(--linha-2); margin: 28px 0; }

.prosa code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.855em;
  padding: 1.5px 5px;
  background: var(--sup-3);
  border: 1px solid var(--linha-2);
  border-radius: 5px;
  white-space: nowrap;
}

/* ---- bloco de código ---- */
.cod {
  margin: 0;
  background: var(--sup-2);
  border: 1px solid var(--linha-2);
  border-radius: var(--raio);
  overflow: hidden;
}
.cod figcaption {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding: 6px 10px 6px 12px;
  background: var(--sup-3);
  border-bottom: 1px solid var(--linha-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--tinta-3);
}
.copiar {
  padding: 2px 8px;
  background: transparent;
  border: 1px solid var(--linha);
  border-radius: 5px;
  color: var(--tinta-3);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: color var(--transicao), border-color var(--transicao);
}
.copiar:hover { color: var(--caneta); border-color: var(--caneta); }
.copiar[data-feito] { color: var(--certo); border-color: var(--certo); }

.cod pre { margin: 0; padding: 13px 14px; overflow-x: auto; }
.cod code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 12.9px;
  line-height: 1.66;
  padding: 0; background: none; border: 0; white-space: pre;
  display: block;
}

.t-com { color: var(--tinta-3); font-style: italic; }
.t-str { color: var(--certo); }
.t-num { color: var(--ocre); }
.t-chave { color: var(--caneta); font-weight: 600; }
.t-tipo { color: var(--f5); font-weight: 600; }
.t-fn { color: var(--tinta); font-weight: 600; }
.t-tag { color: var(--caneta); font-weight: 600; }
.t-attr { color: var(--ocre); }
.t-sel { color: var(--caneta); font-weight: 600; }
.t-val { color: var(--tinta-2); }

/* ---- tabela ---- */
.tab-rolo { overflow-x: auto; border: 1px solid var(--linha-2); border-radius: var(--raio); }
.prosa table { width: 100%; border-collapse: collapse; font-size: 14px; }
.prosa th, .prosa td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--linha-2); vertical-align: top; }
.prosa th {
  background: var(--sup-3);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--tinta-3);
  white-space: nowrap;
}
.prosa tbody tr:last-child td { border-bottom: 0; }
.prosa td code { white-space: nowrap; }

/* ---- destaques ---- */
.destaque {
  padding: 12px 15px;
  border-radius: var(--raio);
  border: 1px solid var(--linha-2);
  border-left-width: 3px;
  background: var(--sup-2);
  font-size: 14.5px;
  max-width: 70ch;
}
.destaque-nota { border-left-color: var(--tinta-3); }
.destaque-alerta { border-left-color: var(--erro); background: var(--erro-fraco); }
.destaque-regra { border-left-color: var(--ocre); background: var(--ocre-fraco); }

/* ============================================================
   Índice pegajoso da aula
   ============================================================ */

.indice {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  gap: 4px;
  padding: 9px 0;
  margin-bottom: 4px;
  background: color-mix(in srgb, var(--fundo) 90%, transparent);
  backdrop-filter: blur(8px);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 12px, #000 calc(100% - 12px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 12px, #000 calc(100% - 12px), transparent);
}
.indice::-webkit-scrollbar { display: none; }
.indice a {
  flex: none;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--linha-2);
  background: var(--sup);
  font-size: 12.5px;
  color: var(--tinta-2);
  text-decoration: none;
  white-space: nowrap;
  transition: all var(--transicao);
}
.indice a:hover { border-color: var(--linha); color: var(--tinta); }
.indice a.ativo { background: var(--caneta); border-color: var(--caneta); color: #fff; }

/* Barra de progresso de leitura, no topo absoluto */
.leitura {
  position: fixed;
  inset: 0 0 auto 0;
  height: 2.5px;
  z-index: 60;
  background: var(--ocre);
  transform-origin: left center;

/* ============================================================

.migalha { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--tinta-3); }

}

.passo .r { font-size: 11px; color: var(--tinta-3); }
.passo .t { font-weight: 600; font-size: 14px; line-height: 1.3; }

/* ============================================================
   Botões
   ============================================================ */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;

}
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }

.btn-cheio:hover { background: var(--caneta-viva); }
.btn-linha { background: var(--sup); border-color: var(--linha); color: var(--tinta-2); }
.btn-linha:hover { border-color: var(--tinta-3); color: var(--tinta); }
.btn-ok { background: var(--certo); color: #fff; }
.btn-ok:hover { filter: brightness(1.06); }

/* ============================================================
   Listas com marcação de progresso (aulas, checklist, exercícios)
   ============================================================ */

.lista { border: 1px solid var(--linha-2); border-radius: var(--raio-g); overflow: hidden; background: var(--sup); }
.lista-cab {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 14px;
  background: var(--sup-3);
  border-bottom: 1px solid var(--linha-2);
}

.item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--linha-2);
  color: inherit;
  text-decoration: none;
  transition: background var(--transicao);
}
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--sup-2); }
.item-cod {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--tinta-3);
  min-width: 30px;
  font-variant-numeric: tabular-nums;
}
.item-t { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 550; line-height: 1.35; }
.item-m { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--tinta-3); flex: none; }
.item.feito .item-t { color: var(--tinta-3); }

/* Marca de conclusão — clicável, com estado real */
.tique {
  width: 21px; height: 21px;
  flex: none;
  display: grid; place-items: center;
  border: 1.5px solid var(--linha);
  border-radius: 6px;
  background: var(--sup);
  cursor: pointer;
  padding: 0;
  transition: all var(--transicao);
}
.tique:hover { border-color: var(--certo); }
.tique svg { width: 12px; height: 12px; opacity: 0; transform: scale(0.6); transition: all var(--transicao); }
.tique[aria-pressed='true'] { background: var(--certo); border-color: var(--certo); color: #fff; }
.tique[aria-pressed='true'] svg { opacity: 1; transform: scale(1); }

/* Linha de tarefa (checklist / exercício / requisito) */
.tarefa {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--linha-2);
  text-align: left;
  width: 100%;
  background: none;
  border-left: 0; border-right: 0; border-top: 0;
  cursor: pointer;
  font-size: 14.5px;
  line-height: 1.5;
  transition: background var(--transicao);
}
.tarefa:last-child { border-bottom: 0; }
.tarefa:hover { background: var(--sup-2); }
.tarefa .tique { margin-top: 1px; }
.tarefa.feito > span { color: var(--tinta-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--tinta-3) 45%, transparent); }
.tarefa-n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--tinta-3);
  min-width: 18px;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   Início — linha das fases
   ============================================================ */

.fases { display: grid; gap: 2px; }
.fase {
  display: grid;
  grid-template-columns: 118px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 11px 14px;
  border: 1px solid var(--linha-2);
  background: var(--sup);
}
.fase:first-child { border-radius: var(--raio-g) var(--raio-g) 0 0; }
.fase:last-child { border-radius: 0 0 var(--raio-g) var(--raio-g); }
.fase + .fase { border-top: 0; }
.fase-n { display: flex; flex-direction: column; gap: 1px; }
.fase-n b { font-family: Archivo, sans-serif; font-size: 14px; }
.fase-n span { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--tinta-3); }
.fase-d { font-size: 13.5px; color: var(--tinta-2); line-height: 1.4; }
.fase-p { display: flex; align-items: center; gap: 9px; min-width: 132px; justify-content: flex-end; }
.fase-p .barra { width: 76px; }
.fase-p .n { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--tinta-3); font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
.fase.alvo { border-color: color-mix(in srgb, var(--ocre) 50%, transparent); background: linear-gradient(90deg, var(--ocre-fraco), transparent 65%); }
.fase-marca svg { width: 12px; height: 12px; flex: none; }
.fase-marca {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ocre);
}

/* Grade de módulos */
.grade-mod { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
.mod {
  display: flex; flex-direction: column; gap: 10px;
  padding: 15px 16px;
  position: relative;
  overflow: hidden;
}
/* Faixa de altitude na borda esquerda: a cor diz a que distância da máquina */
.mod::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--cor-faixa);
}
.mod-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

}

.mod-obj { font-size: 13.5px; color: var(--tinta-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mod-meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11.5px; color: var(--tinta-3); }
.mod-meta span { display: inline-flex; align-items: center; gap: 4px; padding: 1.5px 7px; border: 1px solid var(--linha-2); border-radius: 999px; background: var(--sup-2); }
.mod-pe { margin-top: auto; display: flex; flex-direction: column; gap: 7px; padding-top: 3px; }
.mod-pe-l { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--tinta-3); }

/* ============================================================
   Quiz
   ============================================================ */

.quiz-q { padding: 16px; border-bottom: 1px solid var(--linha-2); }
.quiz-q:last-of-type { border-bottom: 0; }
.quiz-p { font-size: 15.5px; font-weight: 600; line-height: 1.45; margin-bottom: 11px; }
.quiz-p .n { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--tinta-3); margin-right: 7px; }
.quiz-op { display: grid; gap: 6px; }
.op {
  display: flex; align-items: flex-start; gap: 10px;
  width: 100%;
  padding: 9px 12px;
  background: var(--sup-2);
  border: 1px solid var(--linha-2);
  border-radius: 8px;
  text-align: left;
  font-size: 14px;
  line-height: 1.45;
  cursor: pointer;
  transition: all var(--transicao);
}
.op:hover:not(:disabled) { border-color: var(--caneta); background: var(--caneta-fraca); }
.op:disabled { cursor: default; }
.op-l {
  font-family: 'JetBrains Mono', monospace;

  width: 18px; height: 18px;
  flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--linha);
  border-radius: 5px;
  margin-top: 1px;
}
.op.certa { border-color: var(--certo); background: var(--certo-fraco); }
.op.certa .op-l { background: var(--certo); border-color: var(--certo); color: #fff; }
.op.errada { border-color: var(--erro); background: var(--erro-fraco); }
.op.errada .op-l { background: var(--erro); border-color: var(--erro); color: #fff; }
.quiz-e {
  margin-top: 10px;
  padding: 10px 13px;

  border-left: 3px solid var(--caneta);

.busca-fundo {

}

.busca-res a {

  padding: 9px 16px;
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid var(--linha-2);
}
.busca-res a:last-child { border-bottom: 0; }
.busca-res a:hover, .busca-res a.sel { background: var(--caneta-fraca); }
.busca-res .c { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--tinta-3); min-width: 30px; }

   Certificado
   ============================================================ */

.cert {

   Aviso flutuante

<script>window.DADOS={"titulo":"Caminho da Programação","subtitulo":"Do zero ao avançado — Lógica, HTML, CSS, JavaScript, Python, Java, C e C++","guia":"<p><strong>Linguagens cobertas:</strong> Lógica → HTML → CSS → JavaScript → Python → C → C++</p>\n<hr>\n<h2 id=\"como-usar-este-material\" class=\"tit-2\">Como usar este material</h2>\n<p>Este não é um material para ler de ponta a ponta. É um <strong>roteiro</strong>. Cada módulo tem:</p>\n<ul><li><strong>Objetivo</strong> — o que você sai sabendo</li><li><strong>Aulas</strong> — conceito explicado + código comentado</li><li><strong>Exercícios</strong> — para fazer você mesmo, sem copiar</li><li><strong>Projeto do módulo</strong> — o que prova que você aprendeu</li><li><strong>Checklist de saída</strong> — só avance quando marcar todos</li></ul>\n<aside class=\"destaque destaque-regra\"><strong>Regra número um:</strong> digite todo código à mão. Copiar e colar não ensina nada. Seus dedos precisam errar o ponto e vírgula para o seu cérebro aprender onde ele vai.</aside>\n<aside class=\"destaque destaque-regra\"><strong>Regra número dois:</strong> quando travar, tente 20 minutos sozinho antes de procurar a resposta. O travamento é onde o aprendizado acontece.</aside>\n<aside class=\"destaque destaque-regra\"><strong>Regra número três:</strong> cada módulo tem um projeto. Faça. Um portfólio com 6 projetos vale mais que 40 cursos assistidos.</aside>\n<hr>\n<h2 id=\"por-que-essa-ordem\" class=\"tit-2\">Por que essa ordem</h2>\n<p>Você pediu da mais fácil para a mais avançada. A ordem abaixo não é só dificuldade — é dificuldade <strong>acumulada</strong>, onde cada módulo prepara o terreno do próximo.</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>#</th><th>Módulo</th><th>Por que aqui</th><th>Dificuldade</th></tr></thead><tbody><tr><td>0</td><td>Lógica</td><td>A base de tudo. Sem isso, toda linguagem parece mágica</td><td>●○○○○</td></tr><tr><td>1</td><td>HTML</td><td>Não é programação, é estrutura. Resultado visível em minutos</td><td>●○○○○</td></tr><tr><td>2</td><td>CSS</td><td>Ainda não é lógica, mas exige raciocínio espacial</td><td>●●○○○</td></tr><tr><td>3</td><td>JavaScript</td><td>Primeira linguagem de verdade, aplicada no que você já construiu</td><td>●●●○○</td></tr><tr><td>4</td><td>Python</td><td>Sintaxe limpa. Aqui você aprofunda lógica e algoritmos</td><td>●●●○○</td></tr><tr><td>5</td><td>Java</td><td>Tipagem estática e orientação a objetos de verdade. O mercado corporativo</td><td>●●●○○</td></tr><tr><td>6</td><td>C</td><td>Tira as rodinhas. Memória, ponteiros, como a máquina funciona</td><td>●●●●○</td></tr><tr><td>7</td><td>C++</td><td>C + orientação a objetos + abstrações pesadas</td><td>●●●●●</td></tr></tbody></table></div>\n<p><strong>Sobre JavaScript vir antes de Python:</strong> os dois têm dificuldade parecida. Coloquei JS primeiro porque ele dá continuidade ao HTML/CSS — você faz a página que acabou de construir <em>fazer coisas</em>, e isso segura a motivação nas primeiras semanas, que é quando a maioria desiste. Se em algum momento o JavaScript te frustrar demais, pode inverter: faça Python primeiro e volte pro JS depois. A lógica é a mesma, só muda o vestido.</p>\n<p><strong>Sobre Java entrar entre Python e C:</strong> Java é o degrau que falta entre as duas. Ele te obriga a declarar tipo, como o C vai obrigar, mas continua limpando a memória por você, como o Python faz — então você paga só metade do preço de cada vez. É também a linguagem com mais vagas de back-end no Brasil, o que torna esta a segunda parada de empregabilidade do caminho.</p>\n<p><strong>Sobre C vir depois de tudo:</strong> muita escola começa por C. Funciona, mas é cruel com iniciante — você passa três semanas lutando com ponteiro sem nunca ter visto um programa seu funcionar. Deixando C para depois, quando você já sabe programar, ele deixa de ser um obstáculo e vira o que realmente é: a explicação de <em>por que</em> as outras linguagens funcionam.</p>\n<hr>\n<h2 id=\"cronograma-para-4-7-horas-por-semana\" class=\"tit-2\">Cronograma para 4–7 horas por semana</h2>\n<p>Com o seu ritmo, o caminho completo leva de <strong>17 a 21 meses</strong>. Parece muito, mas veja onde você já está empregável:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Fase</th><th>Módulos</th><th>Tempo</th><th>O que você já consegue</th></tr></thead><tbody><tr><td>Fase 1</td><td>0, 1, 2</td><td>~3 meses</td><td>Montar sites estáticos. Já dá freela pequeno</td></tr><tr><td>Fase 2</td><td>3 (JS)</td><td>~4 meses</td><td><strong>Ponto de empregabilidade.</strong> Vaga júnior de front-end</td></tr><tr><td>Fase 3</td><td>4 (Python)</td><td>~3 meses</td><td>Back-end, automação, dados. Dobra seu leque de vagas</td></tr><tr><td>Fase 4</td><td>5 (Java)</td><td>~3 meses</td><td><strong>Segundo ponto de empregabilidade.</strong> Vaga júnior de back-end</td></tr><tr><td>Fase 5</td><td>6, 7 (C/C++)</td><td>~5 meses</td><td>Base sólida. Diferencial em entrevista técnica</td></tr></tbody></table></div>\n<p>Se o objetivo é emprego, <strong>o alvo real é o fim da Fase 2</strong>. Ali você já pode começar a se candidatar enquanto estuda o resto. Não espere terminar tudo para se aplicar — ninguém termina \"tudo\".</p>\n<p><strong>Como distribuir 5h na semana (sugestão):</strong></p>\n<ul><li>3 sessões de 1h em dias de semana → teoria + exercícios curtos</li><li>1 sessão de 2h no fim de semana → projeto, onde você junta as peças</li></ul>\n<p>Sessões curtas e frequentes batem uma maratona de sábado. O cérebro consolida no intervalo.</p>\n<hr>","modulos":[{"num":0,"nome":"Lógica de Programação","id":"m0","dificuldade":1,"tempo":"3 a 4 semanas","prereq":"nenhum","faixa":{"nome":"Fundamento","cor":"f1"},"objetivo":"entender o que é um programa antes de aprender qualquer linguagem. Este módulo é o mais importante do material inteiro. Quem pula ele passa os próximos dois anos decorando sintaxe sem entender nada.","intro":"<p>Você vai fazer os exercícios daqui <strong>no papel</strong> e depois em <a href=\"https://portugol-webstudio.cubos.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Portugol Webstudio<span class=\"ext\" aria-hidden=\"true\">↗</span></a> (roda no navegador, escreve em português).</p>\n<hr>","aulas":[{"id":"a0-1","codigo":"0.1","titulo":"O que é programar, de verdade","nivel":"Base","quando":"","html":"<p>Programar não é saber uma linguagem. Programar é <strong>quebrar um problema em passos tão pequenos e tão burros que uma máquina consegue seguir</strong>.</p>\n<p>O computador não é inteligente. Ele é rápido e obediente. Ele faz exatamente o que você mandou — inclusive a besteira que você mandou sem perceber.</p>\n<p>Pense em explicar para alguém como fazer um sanduíche. Você diria \"passa manteiga no pão\". Um computador responderia: <em>o que é passar? qual lado do pão? quanto de manteiga? e se não tiver manteiga?</em></p>\n<p>Programar é ter essa paciência.</p>\n<p><strong>Exercício mental (faça agora, no papel):</strong> escreva o passo a passo de \"escovar os dentes\" com detalhe suficiente para um robô executar. Você vai descobrir que esqueceu de mandar ele abrir a torneira. Todo mundo esquece. Isso é um <em>bug</em>.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a0-2","codigo":"0.2","titulo":"Algoritmo","nivel":"Base","quando":"","html":"<p><strong>Algoritmo</strong> é uma sequência finita de passos que resolve um problema.</p>\n<p>Três características obrigatórias:</p>\n<ol><li><strong>Finito</strong> — tem que terminar</li><li><strong>Definido</strong> — cada passo é claro, sem ambiguidade</li><li><strong>Eficaz</strong> — resolve o problema de fato</li></ol>\n<p>Exemplo — calcular a média de duas notas:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>INÍCIO\n  1. Peça a primeira nota e guarde em NOTA1\n  2. Peça a segunda nota e guarde em NOTA2\n  3. Calcule MEDIA = (NOTA1 + NOTA2) / 2\n  4. Se MEDIA for maior ou igual a 7:\n       escreva \"Aprovado\"\n     Senão:\n       escreva \"Reprovado\"\nFIM</code></pre></figure>\n<p>Isso é um algoritmo. Não tem linguagem nenhuma aí — é raciocínio puro. Quando você souber isso, traduzir para Python, C ou JavaScript é só questão de dicionário.</p>\n<p><strong>Pseudocódigo</strong> é escrever algoritmo dessa forma, em português estruturado. Você vai usar isso a vida inteira, mesmo depois de sênior — a gente rabisca o pseudocódigo antes de escrever código de verdade.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a0-3","codigo":"0.3","titulo":"Variáveis e tipos","nivel":"Base","quando":"","html":"<p>Uma <strong>variável</strong> é uma caixa com nome onde você guarda um valor.</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>idade = 25</code></pre></figure>\n<p>Leia assim: \"a caixa chamada <code>idade</code> agora guarda o valor 25\".</p>\n<p>Três coisas importantes:</p>\n<ul><li>A caixa tem <strong>nome</strong> (<code>idade</code>)</li><li>A caixa tem <strong>conteúdo</strong> (<code>25</code>)</li><li>O conteúdo pode <strong>mudar</strong> — por isso \"variável\"</li></ul>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>idade = 25\nidade = 26     // agora a caixa guarda 26. O 25 sumiu.</code></pre></figure>\n<h3 id=\"a0-3-tipos-de-dado\" class=\"tit-3\">Tipos de dado</h3>\n<p>O tipo diz que espécie de coisa cabe na caixa. Os quatro básicos:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Tipo</th><th>O que guarda</th><th>Exemplo</th></tr></thead><tbody><tr><td><strong>Inteiro</strong> (int)</td><td>Números sem vírgula</td><td><code>42</code>, <code>-7</code>, <code>0</code></td></tr><tr><td><strong>Real / Flutuante</strong> (float)</td><td>Números com vírgula</td><td><code>3.14</code>, <code>-0.5</code></td></tr><tr><td><strong>Texto</strong> (string)</td><td>Sequência de caracteres</td><td><code>\"Maria\"</code>, <code>\"a\"</code>, <code>\"123\"</code></td></tr><tr><td><strong>Booleano</strong> (bool)</td><td>Só verdadeiro ou falso</td><td><code>true</code>, <code>false</code></td></tr></tbody></table></div>\n<aside class=\"destaque destaque-alerta\"><strong>Atenção nessa pegadinha:</strong> <code>123</code> (inteiro) é diferente de <code>\"123\"</code> (texto). O primeiro você soma, o segundo você não. <code>2 + 2</code> dá 4. <code>\"2\" + \"2\"</code> pode dar <code>\"22\"</code>. Isso vai te morder em JavaScript, prepare-se.</aside>\n<h3 id=\"a0-3-nomes-de-variaveis\" class=\"tit-3\">Nomes de variáveis</h3>\n<p>Regra prática: o nome tem que dizer o que a caixa guarda.</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>x = 1500          // ruim. x o quê?\ns = 1500          // ruim\nsalarioBruto = 1500   // bom</code></pre></figure>\n<p>Você lê código muito mais do que escreve. Nome bom é presente pro seu eu do mês que vem.</p>\n<hr>","ancoras":[{"id":"a0-3-tipos-de-dado","rotulo":"Tipos de dado"},{"id":"a0-3-nomes-de-variaveis","rotulo":"Nomes de variáveis"}],"minutos":4},{"id":"a0-4","codigo":"0.4","titulo":"Operadores","nivel":"Base","quando":"","html":"<h3 id=\"a0-4-aritmeticos\" class=\"tit-3\">Aritméticos</h3>\n<div class=\"tab-rolo\"><table><thead><tr><th>Operador</th><th>Faz</th><th>Exemplo</th><th>Resultado</th></tr></thead><tbody><tr><td><code>+</code></td><td>Soma</td><td><code>7 + 3</code></td><td><code>10</code></td></tr><tr><td><code>-</code></td><td>Subtrai</td><td><code>7 - 3</code></td><td><code>4</code></td></tr><tr><td><code>*</code></td><td>Multiplica</td><td><code>7 * 3</code></td><td><code>21</code></td></tr><tr><td><code>/</code></td><td>Divide</td><td><code>7 / 2</code></td><td><code>3.5</code></td></tr><tr><td><code>%</code></td><td>Resto da divisão</td><td><code>7 % 2</code></td><td><code>1</code></td></tr></tbody></table></div>\n<p>O <code>%</code> (<strong>módulo</strong>) parece inútil e é um dos mais usados. Ele responde \"sobrou quanto?\".</p>\n<p>Uso clássico — descobrir se um número é par:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>se numero % 2 == 0 então é par</code></pre></figure>\n<p>Porque todo número par dividido por 2 tem resto zero. Guarde esse truque.</p>\n<h3 id=\"a0-4-comparacao\" class=\"tit-3\">Comparação</h3>\n<p>Sempre devolvem verdadeiro ou falso:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Operador</th><th>Significa</th></tr></thead><tbody><tr><td><code>==</code></td><td>É igual a</td></tr><tr><td><code>!=</code></td><td>É diferente de</td></tr><tr><td><code>&gt;</code></td><td>Maior que</td></tr><tr><td><code>&lt;</code></td><td>Menor que</td></tr><tr><td><code>&gt;=</code></td><td>Maior ou igual</td></tr><tr><td><code>&lt;=</code></td><td>Menor ou igual</td></tr></tbody></table></div>\n<aside class=\"destaque destaque-alerta\"><strong>O erro mais comum de todo iniciante:</strong> confundir <code>=</code> com <code>==</code>.</aside>\n<ul><li><code>=</code> é <strong>atribuição</strong>: \"coloque esse valor na caixa\"</li><li><code>==</code> é <strong>comparação</strong>: \"esses dois valores são iguais?\"</li></ul>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>idade = 18     // coloca 18 na caixa idade\nidade == 18    // pergunta: idade é 18? devolve verdadeiro ou falso</code></pre></figure>\n<h3 id=\"a0-4-logicos\" class=\"tit-3\">Lógicos</h3>\n<p>Combinam condições:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Operador</th><th>Nome</th><th>Verdadeiro quando</th></tr></thead><tbody><tr><td><code>E</code> (<code>&amp;&amp;</code>)</td><td>AND</td><td><strong>As duas</strong> condições são verdadeiras</td></tr><tr><td><code>OU</code> (<code>||</code>)</td><td>OR</td><td><strong>Pelo menos uma</strong> é verdadeira</td></tr><tr><td><code>NÃO</code> (<code>!</code>)</td><td>NOT</td><td>Inverte o valor</td></tr></tbody></table></div>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>idade &gt;= 18 E temCarteira == true    // só entra se as duas baterem\ndiaSemana == \"sábado\" OU diaSemana == \"domingo\"   // basta uma</code></pre></figure>\n<p>Tabela verdade — decore essa, ela nunca muda em nenhuma linguagem:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>A</th><th>B</th><th>A E B</th><th>A OU B</th></tr></thead><tbody><tr><td>V</td><td>V</td><td>V</td><td>V</td></tr><tr><td>V</td><td>F</td><td>F</td><td>V</td></tr><tr><td>F</td><td>V</td><td>F</td><td>V</td></tr><tr><td>F</td><td>F</td><td>F</td><td>F</td></tr></tbody></table></div>\n<hr>","ancoras":[{"id":"a0-4-aritmeticos","rotulo":"Aritméticos"},{"id":"a0-4-comparacao","rotulo":"Comparação"},{"id":"a0-4-logicos","rotulo":"Lógicos"}],"minutos":4},{"id":"a0-5","codigo":"0.5","titulo":"Condicionais (o programa toma decisão)","nivel":"Base","quando":"","html":"<p>Até agora o programa era uma linha reta. Condicional é a primeira <strong>bifurcação</strong>.</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>SE (condição) ENTÃO\n   faz isso\nSENÃO\n   faz aquilo\nFIM SE</code></pre></figure>\n<p>Exemplo:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>SE (saldo &gt;= valorCompra) ENTÃO\n   ESCREVA \"Compra aprovada\"\n   saldo = saldo - valorCompra\nSENÃO\n   ESCREVA \"Saldo insuficiente\"\nFIM SE</code></pre></figure>\n<h3 id=\"a0-5-condicionais-encadeadas\" class=\"tit-3\">Condicionais encadeadas</h3>\n<p>Quando há mais de dois caminhos:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>SE (nota &gt;= 9) ENTÃO\n   ESCREVA \"A\"\nSENÃO SE (nota &gt;= 7) ENTÃO\n   ESCREVA \"B\"\nSENÃO SE (nota &gt;= 5) ENTÃO\n   ESCREVA \"C\"\nSENÃO\n   ESCREVA \"D\"\nFIM SE</code></pre></figure>\n<aside class=\"destaque destaque-alerta\"><strong>Ponto sutil que quase ninguém explica:</strong> a ordem importa. O programa testa de cima para baixo e <strong>para no primeiro que der verdadeiro</strong>. Se você inverter e colocar <code>nota &gt;= 5</code> primeiro, um aluno com 9 receberia \"C\", porque 9 também é maior que 5 e o teste pararia ali.</aside>\n<hr>","ancoras":[{"id":"a0-5-condicionais-encadeadas","rotulo":"Condicionais encadeadas"}],"minutos":4},{"id":"a0-6","codigo":"0.6","titulo":"Laços de repetição","nivel":"Base","quando":"","html":"<p>Laço é o que faz o computador valer a pena. Ele repete algo 10 mil vezes sem reclamar.</p>\n<h3 id=\"a0-6-enquanto-while-repete-enquanto-a-condicao-for-ve\" class=\"tit-3\">ENQUANTO (while) — repete enquanto a condição for verdadeira</h3>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>contador = 1\nENQUANTO (contador &lt;= 5) FAÇA\n   ESCREVA contador\n   contador = contador + 1\nFIM ENQUANTO</code></pre></figure>\n<p>Saída: 1, 2, 3, 4, 5</p>\n<p>Repare nas três partes obrigatórias de todo laço:</p>\n<ol><li><strong>Inicialização</strong> — <code>contador = 1</code></li><li><strong>Condição de parada</strong> — <code>contador &lt;= 5</code></li><li><strong>Atualização</strong> — <code>contador = contador + 1</code></li></ol>\n<aside class=\"destaque destaque-alerta\"><strong>Se você esquecer a atualização, o programa nunca para.</strong> Isso é o <em>loop infinito</em>, e você vai criar uns cinquenta na sua vida. Faz parte.</aside>\n<h3 id=\"a0-6-para-for-quando-voce-sabe-quantas-vezes-vai-repe\" class=\"tit-3\">PARA (for) — quando você sabe quantas vezes vai repetir</h3>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>PARA i DE 1 ATÉ 5 FAÇA\n   ESCREVA i\nFIM PARA</code></pre></figure>\n<p>Saída: 1, 2, 3, 4, 5 — exatamente a mesma do ENQUANTO acima.</p>\n<p>As três partes continuam existindo, espremidas na primeira linha:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Parte</th><th>No ENQUANTO</th><th>No PARA</th></tr></thead><tbody><tr><td>Inicialização</td><td><code>contador = 1</code></td><td><code>DE 1</code></td></tr><tr><td>Condição de parada</td><td><code>contador &lt;= 5</code></td><td><code>ATÉ 5</code></td></tr><tr><td>Atualização</td><td><code>contador = contador + 1</code></td><td>não aparece — o PARA soma 1 sozinho</td></tr></tbody></table></div>\n<p><strong>Não procure a atualização: ela é automática.</strong> E é exatamente aí que está a vantagem — como o PARA incrementa por conta própria, ele <strong>não tem como virar loop infinito</strong>. O erro que o ENQUANTO deixa você cometer, o PARA não deixa.</p>\n<p>O preço é a rigidez: o PARA anda de 1 em 1, do início ao fim, e pronto. Quando o passo depende de algo que muda durante a execução, só o ENQUANTO resolve.</p>\n<p><strong>Quando usar cada um:</strong></p>\n<ul><li>Sabe o número de repetições? → <strong>PARA</strong></li><li>Depende de uma condição que pode mudar? → <strong>ENQUANTO</strong></li></ul>\n<p>\"Imprima os 100 primeiros números\" → PARA. \"Peça a senha até o usuário acertar\" → ENQUANTO.</p>\n<hr>","ancoras":[{"id":"a0-6-enquanto-while-repete-enquanto-a-condicao-for-ve","rotulo":"ENQUANTO (while) — repete enquanto a condição for verdadeira"},{"id":"a0-6-para-for-quando-voce-sabe-quantas-vezes-vai-repe","rotulo":"PARA (for) — quando você sabe quantas vezes vai repetir"}],"minutos":4},{"id":"a0-7","codigo":"0.7","titulo":"Vetores (listas)","nivel":"Base","quando":"","html":"<p>Uma variável guarda um valor. Um <strong>vetor</strong> guarda vários, numerados.</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>notas = [7.5, 8.0, 6.5, 9.0]</code></pre></figure>\n<p>Você acessa pela <strong>posição</strong> (chamada índice):</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>notas[0]  →  7.5\nnotas[1]  →  8.0\nnotas[3]  →  9.0</code></pre></figure>\n<p><strong>A contagem começa no ZERO.</strong> Não em 1. Isso parece arbitrário e vai te confundir por umas duas semanas. Motivo histórico: o índice representa \"quantas casas andar a partir do início\". O primeiro elemento já está no início, então anda zero casas.</p>\n<p>Consequência prática: um vetor de 4 elementos tem índices de <strong>0 a 3</strong>. Pedir <code>notas[4]</code> é erro. Esse erro tem nome — <em>index out of bounds</em> — e você vai ver muito.</p>\n<h3 id=\"a0-7-percorrendo-um-vetor\" class=\"tit-3\">Percorrendo um vetor</h3>\n<p>Combinação de vetor + laço. É aqui que a programação começa a ficar poderosa:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>soma = 0\nPARA i DE 0 ATÉ 3 FAÇA\n   soma = soma + notas[i]\nFIM PARA\nmedia = soma / 4</code></pre></figure>\n<p>Guarde esse padrão. Ele é a base de 80% do código que você vai escrever: <strong>percorrer uma coleção fazendo algo com cada item</strong>.</p>\n<hr>","ancoras":[{"id":"a0-7-percorrendo-um-vetor","rotulo":"Percorrendo um vetor"}],"minutos":4},{"id":"a0-8","codigo":"0.8","titulo":"Funções","nivel":"Base","quando":"","html":"<p>Função é um pedaço de código com nome, que você escreve uma vez e usa quantas vezes quiser.</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>FUNÇÃO calcularMedia(nota1, nota2)\n   media = (nota1 + nota2) / 2\n   RETORNE media\nFIM FUNÇÃO</code></pre></figure>\n<p>Usando:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>resultado = calcularMedia(8, 6)    // resultado vale 7\noutro = calcularMedia(10, 5)       // outro vale 7.5</code></pre></figure>\n<p>Três conceitos aqui:</p>\n<ul><li><strong>Parâmetros</strong> (<code>nota1</code>, <code>nota2</code>) — as caixas de entrada</li><li><strong>Corpo</strong> — o que a função faz</li><li><strong>Retorno</strong> — o que ela devolve para quem chamou</li></ul>\n<h3 id=\"a0-8-por-que-funcoes-importam-mais-do-que-parece\" class=\"tit-3\">Por que funções importam mais do que parece</h3>\n<ol><li><strong>Não repetir código.</strong> Se a regra da média mudar, você corrige em um lugar só.</li><li><strong>Nomear ideias.</strong> <code>calcularMedia(8, 6)</code> se lê melhor que <code>(8 + 6) / 2</code> no meio de 300 linhas.</li><li><strong>Dividir o problema.</strong> Um programa grande é um monte de funções pequenas conversando.</li></ol>\n<p>Regra de bolso: <strong>uma função deve fazer uma coisa só.</strong> Se você precisa usar \"e\" para explicar o que ela faz (\"ela calcula a média <em>e</em> salva no banco <em>e</em> manda email\"), são três funções.</p>\n<hr>","ancoras":[{"id":"a0-8-por-que-funcoes-importam-mais-do-que-parece","rotulo":"Por que funções importam mais do que parece"}],"minutos":4},{"id":"a0-9","codigo":"0.9","titulo":"Teste de mesa e depuração","nivel":"Base","quando":"","html":"<p><strong>Teste de mesa</strong> é executar o código na mão, no papel, simulando o computador. Parece coisa de dinossauro. É a habilidade que mais separa quem programa de quem chuta.</p>\n<p>Pegue este código:</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>x = 3\ny = 5\nENQUANTO (x &lt; y) FAÇA\n   x = x + 2\n   ESCREVA x\nFIM ENQUANTO</code></pre></figure>\n<p>Monte a tabela:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Passo</th><th>x</th><th>y</th><th>x &lt; y?</th><th>Saída</th></tr></thead><tbody><tr><td>início</td><td>3</td><td>5</td><td>—</td><td>—</td></tr><tr><td>volta 1</td><td>3</td><td>5</td><td>V</td><td>x vira 5, escreve 5</td></tr><tr><td>volta 2</td><td>5</td><td>5</td><td>F</td><td>sai do laço</td></tr></tbody></table></div>\n<p>Saída final: <code>5</code></p>\n<p>Faça isso sempre que um código não fizer o que você esperava. Em 9 de 10 vezes você acha o erro sem precisar de nada além de papel.</p>\n<h3 id=\"a0-9-os-4-tipos-de-erro\" class=\"tit-3\">Os 4 tipos de erro</h3>\n<div class=\"tab-rolo\"><table><thead><tr><th>Tipo</th><th>O que é</th><th>Exemplo</th></tr></thead><tbody><tr><td><strong>Sintaxe</strong></td><td>Escreveu errado</td><td>Esqueceu o <code>;</code> ou o fechamento de parêntese</td></tr><tr><td><strong>Lógica</strong></td><td>Roda, mas faz a coisa errada</td><td>Somou quando devia multiplicar</td></tr><tr><td><strong>Execução</strong></td><td>Quebra no meio</td><td>Divisão por zero, índice fora do vetor</td></tr><tr><td><strong>Semântico</strong></td><td>Faz certo, resolve o problema errado</td><td>Você entendeu mal o que pediram</td></tr></tbody></table></div>\n<p>O de <strong>lógica</strong> é o pior, porque o computador não avisa. O programa roda lindamente e entrega um número errado. Só o teste de mesa pega esse.</p>\n<hr>","ancoras":[{"id":"a0-9-os-4-tipos-de-erro","rotulo":"Os 4 tipos de erro"}],"minutos":4}],"exercicios":["Leia dois números e mostre a soma, subtração, produto e divisão.","Leia a idade e diga se a pessoa é maior de idade.","Leia três notas e diga se o aluno foi aprovado (média ≥ 7).","Leia um número e diga se é par ou ímpar.","Mostre a tabuada de um número lido (use laço).","Leia 10 números e mostre a soma e a média.","Leia 10 números e mostre qual é o maior e qual é o menor.","Peça uma senha até o usuário digitar \"1234\". Conte as tentativas.","Calcule o fatorial de um número (5! = 5×4×3×2×1 = 120).","Mostre os 10 primeiros números da sequência de Fibonacci (0, 1, 1, 2, 3, 5, 8...).","Leia um número e diga se é primo (só divisível por 1 e por ele mesmo).","Leia um vetor de 10 nomes e ordene em ordem alfabética. Faça sem usar função pronta de ordenação — o objetivo é você inventar o algoritmo."],"exerciciosNota":"<strong>O exercício 12 vai doer.</strong> É proposital. Se você conseguir fazer, mesmo que feio e lento, você já pensa como programador.","projetos":[],"checklist":["Explico a diferença entre <code>=</code> e <code>==</code> para outra pessoa","Sei quando usar <code>PARA</code> e quando usar <code>ENQUANTO</code>","Sei por que vetor começa no índice 0","Sei o que é loop infinito e como evitar","Escrevo uma função com parâmetro e retorno sem olhar exemplo","Faço teste de mesa de um laço com 3 variáveis","Resolvi do exercício 1 ao 11","Tentei o 12 por pelo menos uma hora"],"quiz":[{"p":"Qual a diferença entre <code>=</code> e <code>==</code>?","o":["<code>=</code> atribui um valor; <code>==</code> compara dois valores","São sinônimos — <code>==</code> é só a forma mais moderna","<code>=</code> compara e <code>==</code> atribui","<code>==</code> só funciona com números"],"c":0,"e":"<code>=</code> coloca um valor na caixa. <code>==</code> pergunta se dois valores são iguais e devolve verdadeiro ou falso. Confundir os dois é o erro mais comum de todo iniciante."},{"p":"O vetor <code>notas = [7.5, 8.0, 6.5, 9.0]</code> tem 4 elementos. O que acontece ao pedir <code>notas[4]</code>?","o":["Devolve 9.0, o último elemento","Devolve 0, porque a posição está vazia","É erro — os índices válidos vão de 0 a 3","O vetor cresce automaticamente"],"c":2,"e":"A contagem começa no zero, então um vetor de 4 elementos tem índices de 0 a 3. Pedir a posição 4 é <em>index out of bounds</em>. O índice representa quantas casas andar a partir do início — o primeiro elemento anda zero casas."},{"p":"Numa condicional encadeada que testa nota &ge; 9 → A, &ge; 7 → B, &ge; 5 → C, por que a ordem importa?","o":["Não importa — o programa testa todos e escolhe o melhor","O programa testa de cima para baixo e para no primeiro verdadeiro","Só importa se houver um SENÃO no final","Importa apenas por questão de legibilidade"],"c":1,"e":"O teste para no primeiro que der verdadeiro. Se <code>nota &gt;= 5</code> viesse primeiro, um aluno com 9 receberia \"C\" — porque 9 também é maior que 5 e o programa nunca chegaria aos testes seguintes."},{"p":"\"Peça a senha até o usuário acertar.\" Que laço usar?","o":["PARA — porque há um número definido de tentativas","ENQUANTO — porque depende de uma condição que pode mudar","Qualquer um: são intercambiáveis","Nenhum: isso resolve com condicional"],"c":1,"e":"Sabe quantas vezes vai repetir? PARA. Depende de uma condição que pode mudar a cada volta? ENQUANTO. Você não sabe quantas tentativas o usuário vai precisar."},{"p":"Quais são as três partes obrigatórias de todo laço?","o":["Início, meio e fim","Contador, vetor e função","Inicialização, condição de parada e atualização","Abertura, corpo e fechamento"],"c":2,"e":"Inicialização (<code>contador = 1</code>), condição de parada (<code>contador &lt;= 5</code>) e atualização (<code>contador = contador + 1</code>). Esquecer a atualização é exatamente como se cria um loop infinito."}]},{"num":1,"nome":"HTML","id":"m1","dificuldade":1,"tempo":"3 semanas","prereq":"Módulo 0","faixa":{"nome":"Fundamento","cor":"f1"},"objetivo":"estruturar qualquer página web com HTML semântico e acessível.","intro":"<aside class=\"destaque destaque-alerta\"><strong>Aviso importante:</strong> HTML <strong>não é uma linguagem de programação</strong>. É uma linguagem de <em>marcação</em> — ela descreve estrutura, não dá ordens. Não tem lógica, não tem condicional, não tem laço. Por isso é o primeiro módulo: você tem resultado visível em 20 minutos, e isso é combustível.</aside>\n<p><strong>Ferramentas:</strong> instale o <a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener noreferrer\">VS Code<span class=\"ext\" aria-hidden=\"true\">↗</span></a> e a extensão <em>Live Server</em>. Só isso.</p>\n<hr>","aulas":[{"id":"a1-1","codigo":"1.1","titulo":"Como um documento HTML é montado","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">!DOCTYPE</span> html&gt;\n&lt;<span class=\"t-tag\">html</span> <span class=\"t-attr\">lang</span>=<span class=\"t-str\">\"pt-BR\"</span>&gt;\n&lt;<span class=\"t-tag\">head</span>&gt;\n    &lt;<span class=\"t-tag\">meta</span> <span class=\"t-attr\">charset</span>=<span class=\"t-str\">\"UTF-8\"</span>&gt;\n    &lt;<span class=\"t-tag\">meta</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"viewport\"</span> <span class=\"t-attr\">content</span>=<span class=\"t-str\">\"width=device-width, initial-scale=1.0\"</span>&gt;\n    &lt;<span class=\"t-tag\">title</span>&gt;Minha primeira página&lt;/<span class=\"t-tag\">title</span>&gt;\n&lt;/<span class=\"t-tag\">head</span>&gt;\n&lt;<span class=\"t-tag\">body</span>&gt;\n    &lt;<span class=\"t-tag\">h1</span>&gt;Olá, mundo&lt;/<span class=\"t-tag\">h1</span>&gt;\n    &lt;<span class=\"t-tag\">p</span>&gt;Esse é meu primeiro parágrafo.&lt;/<span class=\"t-tag\">p</span>&gt;\n&lt;/<span class=\"t-tag\">body</span>&gt;\n&lt;/<span class=\"t-tag\">html</span>&gt;</code></pre></figure>\n<p>Linha por linha:</p>\n<ul><li><code>&lt;!DOCTYPE html&gt;</code> — avisa ao navegador que é HTML5</li><li><code>&lt;html lang=\"pt-BR\"&gt;</code> — raiz do documento. O <code>lang</code> importa para leitores de tela e para o Google</li><li><code>&lt;head&gt;</code> — informações <strong>sobre</strong> a página. Não aparece na tela</li><li><code>&lt;meta charset=\"UTF-8\"&gt;</code> — sem isso, acentos viram <code>Ã§</code>. Nunca esqueça</li><li><code>&lt;meta name=\"viewport\"&gt;</code> — faz a página funcionar no celular</li><li><code>&lt;body&gt;</code> — o conteúdo visível</li></ul>","ancoras":[],"minutos":4},{"id":"a1-2","codigo":"1.2","titulo":"Anatomia de uma tag","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">a</span> <span class=\"t-attr\">href</span>=<span class=\"t-str\">\"https://exemplo.com\"</span> <span class=\"t-attr\">target</span>=<span class=\"t-str\">\"_blank\"</span>&gt;Clique aqui&lt;/<span class=\"t-tag\">a</span>&gt;\n │   │                                        │          │\n │   └─ atributo (href) e seu valor           │          └─ tag de fechamento\n └─ tag de abertura                           └─ conteúdo</code></pre></figure>\n<p>Algumas tags não têm conteúdo nem fechamento — são <strong>vazias</strong>:</p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">img</span> <span class=\"t-attr\">src</span>=<span class=\"t-str\">\"foto.jpg\"</span> <span class=\"t-attr\">alt</span>=<span class=\"t-str\">\"Descrição da foto\"</span>&gt;\n&lt;<span class=\"t-tag\">br</span>&gt;\n&lt;<span class=\"t-tag\">hr</span>&gt;\n&lt;<span class=\"t-tag\">input</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"text\"</span>&gt;</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a1-3","codigo":"1.3","titulo":"Tags essenciais","nivel":"Básico","quando":"","html":"<p><strong>Texto:</strong></p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">h1</span>&gt;Título principal — só um por página&lt;/<span class=\"t-tag\">h1</span>&gt;\n&lt;<span class=\"t-tag\">h2</span>&gt;Subtítulo&lt;/<span class=\"t-tag\">h2</span>&gt;\n&lt;<span class=\"t-tag\">h3</span>&gt;Sub-subtítulo&lt;/<span class=\"t-tag\">h3</span>&gt;\n\n&lt;<span class=\"t-tag\">p</span>&gt;Um parágrafo de texto.&lt;/<span class=\"t-tag\">p</span>&gt;\n&lt;<span class=\"t-tag\">strong</span>&gt;Importante&lt;/<span class=\"t-tag\">strong</span>&gt; — negrito com significado\n&lt;<span class=\"t-tag\">em</span>&gt;Ênfase&lt;/<span class=\"t-tag\">em</span>&gt; — itálico com significado\n&lt;<span class=\"t-tag\">br</span>&gt; quebra de linha</code></pre></figure>\n<p>Hierarquia de títulos <strong>não é sobre tamanho de fonte</strong>. É sobre estrutura. Não use <code>&lt;h3&gt;</code> porque achou o <code>&lt;h2&gt;</code> grande — use CSS para isso. Pular níveis quebra a acessibilidade.</p>\n<p><strong>Listas:</strong></p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">&lt;!-- Lista não ordenada (bolinhas) --&gt;</span>\n&lt;<span class=\"t-tag\">ul</span>&gt;\n    &lt;<span class=\"t-tag\">li</span>&gt;Café&lt;/<span class=\"t-tag\">li</span>&gt;\n    &lt;<span class=\"t-tag\">li</span>&gt;Pão&lt;/<span class=\"t-tag\">li</span>&gt;\n&lt;/<span class=\"t-tag\">ul</span>&gt;\n\n<span class=\"t-com\">&lt;!-- Lista ordenada (números) --&gt;</span>\n&lt;<span class=\"t-tag\">ol</span>&gt;\n    &lt;<span class=\"t-tag\">li</span>&gt;Acorde&lt;/<span class=\"t-tag\">li</span>&gt;\n    &lt;<span class=\"t-tag\">li</span>&gt;Escove os dentes&lt;/<span class=\"t-tag\">li</span>&gt;\n&lt;/<span class=\"t-tag\">ol</span>&gt;</code></pre></figure>\n<p><strong>Links e imagens:</strong></p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">a</span> <span class=\"t-attr\">href</span>=<span class=\"t-str\">\"pagina2.html\"</span>&gt;Link interno&lt;/<span class=\"t-tag\">a</span>&gt;\n&lt;<span class=\"t-tag\">a</span> <span class=\"t-attr\">href</span>=<span class=\"t-str\">\"https://google.com\"</span> <span class=\"t-attr\">target</span>=<span class=\"t-str\">\"_blank\"</span> <span class=\"t-attr\">rel</span>=<span class=\"t-str\">\"noopener\"</span>&gt;Link externo&lt;/<span class=\"t-tag\">a</span>&gt;\n&lt;<span class=\"t-tag\">a</span> <span class=\"t-attr\">href</span>=<span class=\"t-str\">\"#secao\"</span>&gt;Link para uma âncora na mesma página&lt;/<span class=\"t-tag\">a</span>&gt;\n&lt;<span class=\"t-tag\">a</span> <span class=\"t-attr\">href</span>=<span class=\"t-str\">\"mailto:teste@email.com\"</span>&gt;Enviar email&lt;/<span class=\"t-tag\">a</span>&gt;\n\n&lt;<span class=\"t-tag\">img</span> <span class=\"t-attr\">src</span>=<span class=\"t-str\">\"imagens/gato.jpg\"</span> <span class=\"t-attr\">alt</span>=<span class=\"t-str\">\"Gato laranja dormindo no sofá\"</span>&gt;</code></pre></figure>\n<p>O <code>alt</code> <strong>não é opcional</strong>. Ele é lido por quem usa leitor de tela e aparece quando a imagem não carrega. Descreva o que a imagem mostra, não escreva \"imagem de gato\".</p>\n<p><strong>Tabelas:</strong></p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">table</span>&gt;\n    &lt;<span class=\"t-tag\">thead</span>&gt;\n        &lt;<span class=\"t-tag\">tr</span>&gt;\n            &lt;<span class=\"t-tag\">th</span>&gt;Produto&lt;/<span class=\"t-tag\">th</span>&gt;\n            &lt;<span class=\"t-tag\">th</span>&gt;Preço&lt;/<span class=\"t-tag\">th</span>&gt;\n        &lt;/<span class=\"t-tag\">tr</span>&gt;\n    &lt;/<span class=\"t-tag\">thead</span>&gt;\n    &lt;<span class=\"t-tag\">tbody</span>&gt;\n        &lt;<span class=\"t-tag\">tr</span>&gt;\n            &lt;<span class=\"t-tag\">td</span>&gt;Café&lt;/<span class=\"t-tag\">td</span>&gt;\n            &lt;<span class=\"t-tag\">td</span>&gt;R$ 18,00&lt;/<span class=\"t-tag\">td</span>&gt;\n        &lt;/<span class=\"t-tag\">tr</span>&gt;\n    &lt;/<span class=\"t-tag\">tbody</span>&gt;\n&lt;/<span class=\"t-tag\">table</span>&gt;</code></pre></figure>\n<p>Tabela é para <strong>dados tabulares</strong>. Nunca use tabela para fazer layout — isso era comum em 2005 e hoje é erro grave.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a1-4","codigo":"1.4","titulo":"HTML semântico","nivel":"Intermediário","quando":"","html":"<p>Este é o conceito que separa quem \"sabe HTML\" de quem sabe HTML.</p>\n<p>Compare:</p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">&lt;!-- Ruim: tudo é div --&gt;</span>\n&lt;<span class=\"t-tag\">div</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"topo\"</span>&gt;\n    &lt;<span class=\"t-tag\">div</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"menu\"</span>&gt;...&lt;/<span class=\"t-tag\">div</span>&gt;\n&lt;/<span class=\"t-tag\">div</span>&gt;\n&lt;<span class=\"t-tag\">div</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"conteudo\"</span>&gt;\n    &lt;<span class=\"t-tag\">div</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"artigo\"</span>&gt;...&lt;/<span class=\"t-tag\">div</span>&gt;\n&lt;/<span class=\"t-tag\">div</span>&gt;\n&lt;<span class=\"t-tag\">div</span> <span class=\"t-attr\">class</span>=<span class=\"t-str\">\"rodape\"</span>&gt;...&lt;/<span class=\"t-tag\">div</span>&gt;</code></pre></figure>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">&lt;!-- Bom: tags que dizem o que a coisa é --&gt;</span>\n&lt;<span class=\"t-tag\">header</span>&gt;\n    &lt;<span class=\"t-tag\">nav</span>&gt;...&lt;/<span class=\"t-tag\">nav</span>&gt;\n&lt;/<span class=\"t-tag\">header</span>&gt;\n&lt;<span class=\"t-tag\">main</span>&gt;\n    &lt;<span class=\"t-tag\">article</span>&gt;...&lt;/<span class=\"t-tag\">article</span>&gt;\n&lt;/<span class=\"t-tag\">main</span>&gt;\n&lt;<span class=\"t-tag\">footer</span>&gt;...&lt;/<span class=\"t-tag\">footer</span>&gt;</code></pre></figure>\n<p>Visualmente idêntico. Mas o segundo é entendido por leitores de tela, pelo Google e pelo próximo programador que abrir seu código.</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Tag</th><th>Para quê</th></tr></thead><tbody><tr><td><code>&lt;header&gt;</code></td><td>Cabeçalho da página ou de uma seção</td></tr><tr><td><code>&lt;nav&gt;</code></td><td>Bloco de navegação (menu)</td></tr><tr><td><code>&lt;main&gt;</code></td><td>Conteúdo principal. Só um por página</td></tr><tr><td><code>&lt;section&gt;</code></td><td>Seção temática, geralmente com título</td></tr><tr><td><code>&lt;article&gt;</code></td><td>Conteúdo independente (post, notícia, card de produto)</td></tr><tr><td><code>&lt;aside&gt;</code></td><td>Conteúdo lateral, secundário</td></tr><tr><td><code>&lt;footer&gt;</code></td><td>Rodapé</td></tr><tr><td><code>&lt;figure&gt;</code> / <code>&lt;figcaption&gt;</code></td><td>Imagem com legenda</td></tr><tr><td><code>&lt;div&gt;</code></td><td>Só quando nenhuma das acima serve</td></tr></tbody></table></div>\n<aside class=\"destaque destaque-regra\"><strong>Regra:</strong> <code>&lt;div&gt;</code> é o último recurso, não o primeiro.</aside>","ancoras":[],"minutos":4},{"id":"a1-5","codigo":"1.5","titulo":"Formulários","nivel":"Intermediário","quando":"","html":"<p>Formulário é onde o HTML encosta na programação de verdade — é por aqui que os dados entram.</p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">form</span> <span class=\"t-attr\">action</span>=<span class=\"t-str\">\"/enviar\"</span> <span class=\"t-attr\">method</span>=<span class=\"t-str\">\"POST\"</span>&gt;\n\n    &lt;<span class=\"t-tag\">label</span> <span class=\"t-attr\">for</span>=<span class=\"t-str\">\"nome\"</span>&gt;Nome completo&lt;/<span class=\"t-tag\">label</span>&gt;\n    &lt;<span class=\"t-tag\">input</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"text\"</span> <span class=\"t-attr\">id</span>=<span class=\"t-str\">\"nome\"</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"nome\"</span> required <span class=\"t-attr\">placeholder</span>=<span class=\"t-str\">\"Maria Silva\"</span>&gt;\n\n    &lt;<span class=\"t-tag\">label</span> <span class=\"t-attr\">for</span>=<span class=\"t-str\">\"email\"</span>&gt;E-mail&lt;/<span class=\"t-tag\">label</span>&gt;\n    &lt;<span class=\"t-tag\">input</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"email\"</span> <span class=\"t-attr\">id</span>=<span class=\"t-str\">\"email\"</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"email\"</span> required&gt;\n\n    &lt;<span class=\"t-tag\">label</span> <span class=\"t-attr\">for</span>=<span class=\"t-str\">\"idade\"</span>&gt;Idade&lt;/<span class=\"t-tag\">label</span>&gt;\n    &lt;<span class=\"t-tag\">input</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"number\"</span> <span class=\"t-attr\">id</span>=<span class=\"t-str\">\"idade\"</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"idade\"</span> <span class=\"t-attr\">min</span>=<span class=\"t-str\">\"0\"</span> <span class=\"t-attr\">max</span>=<span class=\"t-str\">\"120\"</span>&gt;\n\n    &lt;<span class=\"t-tag\">label</span> <span class=\"t-attr\">for</span>=<span class=\"t-str\">\"senha\"</span>&gt;Senha&lt;/<span class=\"t-tag\">label</span>&gt;\n    &lt;<span class=\"t-tag\">input</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"password\"</span> <span class=\"t-attr\">id</span>=<span class=\"t-str\">\"senha\"</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"senha\"</span> <span class=\"t-attr\">minlength</span>=<span class=\"t-str\">\"8\"</span>&gt;\n\n    &lt;<span class=\"t-tag\">label</span> <span class=\"t-attr\">for</span>=<span class=\"t-str\">\"estado\"</span>&gt;Estado&lt;/<span class=\"t-tag\">label</span>&gt;\n    &lt;<span class=\"t-tag\">select</span> <span class=\"t-attr\">id</span>=<span class=\"t-str\">\"estado\"</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"estado\"</span>&gt;\n        &lt;<span class=\"t-tag\">option</span> <span class=\"t-attr\">value</span>=<span class=\"t-str\">\"ce\"</span>&gt;Ceará&lt;/<span class=\"t-tag\">option</span>&gt;\n        &lt;<span class=\"t-tag\">option</span> <span class=\"t-attr\">value</span>=<span class=\"t-str\">\"rn\"</span>&gt;Rio Grande do Norte&lt;/<span class=\"t-tag\">option</span>&gt;\n    &lt;/<span class=\"t-tag\">select</span>&gt;\n\n    &lt;<span class=\"t-tag\">label</span> <span class=\"t-attr\">for</span>=<span class=\"t-str\">\"mensagem\"</span>&gt;Mensagem&lt;/<span class=\"t-tag\">label</span>&gt;\n    &lt;<span class=\"t-tag\">textarea</span> <span class=\"t-attr\">id</span>=<span class=\"t-str\">\"mensagem\"</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"mensagem\"</span> <span class=\"t-attr\">rows</span>=<span class=\"t-str\">\"5\"</span>&gt;&lt;/<span class=\"t-tag\">textarea</span>&gt;\n\n    &lt;<span class=\"t-tag\">input</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"checkbox\"</span> <span class=\"t-attr\">id</span>=<span class=\"t-str\">\"aceito\"</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"aceito\"</span>&gt;\n    &lt;<span class=\"t-tag\">label</span> <span class=\"t-attr\">for</span>=<span class=\"t-str\">\"aceito\"</span>&gt;Aceito os termos&lt;/<span class=\"t-tag\">label</span>&gt;\n\n    &lt;<span class=\"t-tag\">button</span> <span class=\"t-attr\">type</span>=<span class=\"t-str\">\"submit\"</span>&gt;Enviar&lt;/<span class=\"t-tag\">button</span>&gt;\n&lt;/<span class=\"t-tag\">form</span>&gt;</code></pre></figure>\n<p>Pontos que caem em entrevista:</p>\n<ul><li><strong><code>label</code> com <code>for</code> apontando pro <code>id</code> do campo.</strong> Isso faz clicar no texto focar o campo, e é obrigatório para acessibilidade.</li><li><strong><code>name</code></strong> é o que vai pro servidor. Sem <code>name</code>, o campo não é enviado.</li><li><strong><code>id</code></strong> é para o <code>label</code> e para o JavaScript encontrar o campo.</li><li><strong><code>required</code>, <code>min</code>, <code>max</code>, <code>minlength</code></strong> dão validação de graça, sem uma linha de JS.</li><li><strong><code>type</code></strong> correto muda o teclado no celular. <code>type=\"email\"</code> abre teclado com <code>@</code>.</li></ul>","ancoras":[],"minutos":4},{"id":"a1-6","codigo":"1.6","titulo":"Caminhos de arquivo","nivel":"Intermediário","quando":"","html":"<p>Erro que trava todo iniciante: a imagem não aparece.</p>\n<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>meu-site/\n├── index.html\n├── sobre.html\n├── css/\n│   └── estilo.css\n└── imagens/\n    └── logo.png</code></pre></figure>\n<p>De dentro do <code>index.html</code>:</p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">img</span> <span class=\"t-attr\">src</span>=<span class=\"t-str\">\"imagens/logo.png\"</span>&gt;        <span class=\"t-com\">&lt;!-- desce uma pasta --&gt;</span>\n&lt;<span class=\"t-tag\">link</span> <span class=\"t-attr\">href</span>=<span class=\"t-str\">\"css/estilo.css\"</span>&gt;        <span class=\"t-com\">&lt;!-- desce uma pasta --&gt;</span></code></pre></figure>\n<p>Se um arquivo estivesse dentro de <code>css/</code> e quisesse acessar <code>imagens/</code>:</p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">img</span> <span class=\"t-attr\">src</span>=<span class=\"t-str\">\"../imagens/logo.png\"</span>&gt;     <span class=\"t-com\">&lt;!-- ../ sobe uma pasta --&gt;</span></code></pre></figure>\n<p><code>../</code> sobe. <code>/</code> no começo significa raiz do site. Sem barra no começo, é relativo a onde você está.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a1-7","codigo":"1.7","titulo":"Acessibilidade (a11y)","nivel":"Avançado","quando":"","html":"<p>Não é enfeite. É requisito legal em muitos contextos e é diferencial em entrevista.</p>\n<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">&lt;!-- Landmarks ajudam a navegar por leitor de tela --&gt;</span>\n&lt;<span class=\"t-tag\">nav</span> <span class=\"t-attr\">aria-label</span>=<span class=\"t-str\">\"Menu principal\"</span>&gt;...&lt;/<span class=\"t-tag\">nav</span>&gt;\n\n<span class=\"t-com\">&lt;!-- Descrever um botão que só tem ícone --&gt;</span>\n&lt;<span class=\"t-tag\">button</span> <span class=\"t-attr\">aria-label</span>=<span class=\"t-str\">\"Fechar modal\"</span>&gt;×&lt;/<span class=\"t-tag\">button</span>&gt;\n\n<span class=\"t-com\">&lt;!-- Avisar que algo mudou dinamicamente --&gt;</span>\n&lt;<span class=\"t-tag\">div</span> <span class=\"t-attr\">role</span>=<span class=\"t-str\">\"alert\"</span> <span class=\"t-attr\">aria-live</span>=<span class=\"t-str\">\"polite\"</span>&gt;Item adicionado ao carrinho&lt;/<span class=\"t-tag\">div</span>&gt;\n\n<span class=\"t-com\">&lt;!-- Esconder decoração de leitores de tela --&gt;</span>\n&lt;<span class=\"t-tag\">span</span> <span class=\"t-attr\">aria-hidden</span>=<span class=\"t-str\">\"true\"</span>&gt;🎉&lt;/<span class=\"t-tag\">span</span>&gt;</code></pre></figure>\n<p>Teste rápido: navegue seu site inteiro <strong>só com Tab e Enter</strong>, sem mouse. Se você não consegue chegar em algum lugar, um usuário de teclado também não consegue.</p>","ancoras":[],"minutos":4},{"id":"a1-8","codigo":"1.8","titulo":"SEO básico e metadados","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"html\"><figcaption>HTML<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>&lt;<span class=\"t-tag\">head</span>&gt;\n    &lt;<span class=\"t-tag\">title</span>&gt;Bolos Artesanais | Confeitaria Silva&lt;/<span class=\"t-tag\">title</span>&gt;\n    &lt;<span class=\"t-tag\">meta</span> <span class=\"t-attr\">name</span>=<span class=\"t-str\">\"description\"</span> <span class=\"t-attr\">content</span>=<span class=\"t-str\">\"Bolos sob encomenda em Fortaleza. Entrega em 24h.\"</span>&gt;\n\n    <span class=\"t-com\">&lt;!-- Como aparece quando compartilhado no WhatsApp/Facebook --&gt;</span>\n    &lt;<span class=\"t-tag\">meta</span> <span class=\"t-attr\">property</span>=<span class=\"t-str\">\"og:title\"</span> <span class=\"t-attr\">content</span>=<span class=\"t-str\">\"Bolos Artesanais\"</span>&gt;\n    &lt;<span class=\"t-tag\">meta</span> <span class=\"t-attr\">property</span>=<span class=\"t-str\">\"og:description\"</span> <span class=\"t-attr\">content</span>=<span class=\"t-str\">\"Bolos sob encomenda em Fortaleza.\"</span>&gt;\n    &lt;<span class=\"t-tag\">meta</span> <span class=\"t-att
