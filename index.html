d><tbody><tr><td>Back-end corporativo</td><td><strong>Spring Boot</strong>, JPA/Hibernate, PostgreSQL</td><td>A maior fatia de vagas do Brasil</td></tr><tr><td>Android</td><td>Kotlin, Jetpack Compose</td><td>Aplicativo de celular</td></tr><tr><td>Big Data</td><td>Spark, Kafka</td><td>Dados em escala</td></tr></tbody></table></div>\n<p>Se o objetivo é emprego, <strong>Spring Boot</strong> é a resposta. É o framework dominante no mercado corporativo brasileiro — abra qualquer site de vagas, filtre por Java e conte quantos anúncios não pedem Spring; vão sobrar poucos. Mas não pule para o Spring sem os projetos abaixo — framework em cima de base fraca produz gente que sabe anotar <code>@Service</code> e não sabe explicar o que acontece por baixo.</p>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[{"titulo":"Sistema de biblioteca (orientação a objetos)","rotulo":"Projeto 1","resumo":"<p>Classes <code>Livro</code>, <code>Usuario</code> e <code>Emprestimo</code>. Cadastrar, emprestar, devolver, listar atrasados. Use herança para tipos de usuário com prazos diferentes, e interface para o que é multável. Sem banco de dados ainda — guarde em <code>List</code> na memória.</p>","requisitos":[],"criterio":""},{"titulo":"Processador de arquivos (collections e streams)","rotulo":"Projeto 2","resumo":"<p>Leia um CSV de vendas com algumas centenas de linhas e produza um relatório: total por vendedor, produto mais vendido, média por mês. Faça tudo com Streams, sem um único <code>for</code>. É o exercício que fixa a Aula 5.11.</p>","requisitos":[],"criterio":""},{"titulo":"API REST com Spring Boot (integração)","rotulo":"Projeto 3","resumo":"<p>CRUD completo, banco H2 ou PostgreSQL, validação de entrada, tratamento de erro devolvendo status HTTP correto e testes com JUnit. Depois <strong>conecte o front-end do Módulo 3 nessa API</strong> — a mesma que você fez em Python no Módulo 4, agora em Java, e você entende de verdade o que muda entre as duas.</p>\n<hr>","requisitos":[],"criterio":""}],"checklist":["Explico por que <code>==</code> não serve para comparar String","Sei a diferença entre primitivo e objeto, e o que é autoboxing","Escolho entre <code>List</code>, <code>Set</code> e <code>Map</code> sem consultar","Sei por que <code>equals</code> e <code>hashCode</code> andam sempre juntos","Explico herança contra interface com um exemplo meu","Escrevo um pipeline de Stream com <code>filter</code>, <code>map</code> e <code>collect</code>","Sei a diferença entre exceção checked e unchecked","Tenho uma API em Spring Boot que meu front-end consome"],"quiz":[{"p":"Por que <code>==</code> não serve para comparar duas <code>String</code> em Java?","o":["Porque <code>==</code> só funciona com tipos primitivos numéricos","Porque <code>==</code> pergunta se são o mesmo objeto na memória, não se têm o mesmo conteúdo","Porque <code>String</code> é imutável e não pode ser comparada","Porque <code>==</code> compara os tamanhos, não os caracteres"],"c":1,"e":"Em objetos, <code>==</code> compara referências. O que confunde é que ele <em>parece</em> funcionar com literais, porque Java os guarda num <em>pool</em> e reaproveita — mas quebra com <code>new String(\"oi\")</code> ou com texto vindo do usuário. Use <code>.equals()</code> sempre e o problema não existe."},{"p":"Quanto vale <code>double x = 7 / 2;</code> em Java?","o":["<code>3.5</code>","<code>3.0</code>","<code>3</code>","Erro de compilação"],"c":1,"e":"Os dois lados são <code>int</code>, então a divisão é inteira e dá <code>3</code>. Só depois esse <code>3</code> vira <code>3.0</code> ao ser guardado no <code>double</code> — a parte decimal já tinha sido descartada. Para acertar: <code>7 / 2.0</code>."},{"p":"Você adiciona duas <code>Pessoa(\"Ana\")</code> a um <code>HashSet</code> e o tamanho dá 2. Por quê?","o":["<code>HashSet</code> aceita repetidos; quem não aceita é o <code>TreeSet</code>","Faltou chamar <code>distinct()</code> no conjunto","A classe <code>Pessoa</code> não sobrescreve <code>equals()</code> e <code>hashCode()</code>","O construtor precisa ser <code>private</code> para a deduplicação funcionar"],"c":2,"e":"Sem esses dois métodos, o <code>HashSet</code> compara pela identidade do objeto — e são dois objetos distintos. <code>equals</code> e <code>hashCode</code> andam sempre juntos: o primeiro decide igualdade, o segundo decide em que balde o item cai."},{"p":"O que há de errado neste código?<br><code>Stream&lt;String&gt; s = nomes.stream();<br>s.filter(n -&gt; n.length() &gt; 3);<br>s.toList();</code>","o":["Nada — devolve os nomes com mais de três letras","O <code>filter</code> não roda sem operação terminal, e reusar o stream lança <code>IllegalStateException</code>","Falta importar <code>java.util.Stream</code>","<code>toList()</code> não existe em <code>Stream</code>"],"c":1,"e":"Stream é preguiçoso: nada acontece até chegar uma operação terminal como <code>toList</code>, <code>sum</code> ou <code>collect</code>. E é de uso único — depois de consumido, morre. O certo é encadear: <code>nomes.stream().filter(...).toList()</code>."},{"p":"Qual a diferença entre exceção <em>checked</em> e <em>unchecked</em>?","o":["A <em>checked</em> o compilador obriga a tratar ou declarar; a <em>unchecked</em> não","A <em>checked</em> só acontece em tempo de compilação","A <em>unchecked</em> encerra o programa; a <em>checked</em> apenas avisa","São nomes diferentes para a mesma coisa"],"c":0,"e":"<code>IOException</code> e <code>SQLException</code> são <em>checked</em>: ou você usa <code>try</code>, ou declara <code>throws</code>, ou não compila. <code>NullPointerException</code> e <code>IllegalArgumentException</code> são <em>unchecked</em>. Essa divisão não existe em Python nem em JavaScript."}]},{"num":6,"nome":"C","id":"m6","dificuldade":4,"tempo":"10 a 12 semanas","prereq":"Módulos 0, 3 e 4","faixa":{"nome":"Avançado","cor":"f4"},"objetivo":"entender como o computador realmente funciona. Memória, ponteiros, tipos, compilação.","intro":"<p>Aqui as rodinhas saem. Python e JavaScript escondiam de você a memória, os tipos e o gerenciamento de recursos. C não esconde nada — e é exatamente por isso que ele vale a pena.</p>\n<p><strong>Você não vai usar C no trabalho</strong> (provavelmente). Você vai usar o <strong>entendimento</strong> que C te dá em todas as outras linguagens. Depois de C, você entende por que uma lista em Python é lenta, por que passar objeto para função em JS modifica o original, o que é vazamento de memória.</p>\n<p><strong>Ferramentas:</strong> compilador GCC. No Windows, instale via MSYS2 ou use WSL. Compile com avisos ligados sempre:</p>\n<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>gcc -Wall -Wextra -g programa.c -o programa\n./programa</code></pre></figure>\n<hr>","aulas":[{"id":"a6-1","codigo":"6.1","titulo":"Estrutura e compilação","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;stdio.h&gt;      <span class=\"t-com\">// inclui a biblioteca de entrada/saída</span>\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Olá, mundo!\\n\"</span>);\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;           <span class=\"t-com\">// 0 significa \"terminou sem erro\"</span>\n}</code></pre></figure>\n<p>Diferença fundamental: JavaScript e Python são <strong>interpretados</strong> — outro programa lê e executa seu código na hora. C é <strong>compilado</strong> — um compilador traduz tudo para linguagem de máquina antes, gerando um executável.</p>\n<p>Consequências:</p>\n<ul><li>C é muito mais rápido</li><li>Erros de sintaxe aparecem antes de rodar, não durante</li><li>O executável só funciona no sistema para o qual foi compilado</li></ul>","ancoras":[],"minutos":4},{"id":"a6-2","codigo":"6.2","titulo":"Tipos e declaração obrigatória","nivel":"Básico","quando":"","html":"<p>Em C você <strong>declara o tipo</strong> de toda variável, e ele nunca muda.</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> idade = <span class=\"t-num\">25</span>;\n<span class=\"t-tipo\">float</span> altura = <span class=\"t-num\">1.75</span>;\n<span class=\"t-tipo\">double</span> preciso = <span class=\"t-num\">3.14159265358979</span>;\n<span class=\"t-tipo\">char</span> letra = <span class=\"t-str\">'A'</span>;           <span class=\"t-com\">// aspas simples, um único caractere</span>\n_Bool ligado = <span class=\"t-num\">1</span>;\n\n<span class=\"t-com\">// Modificadores mudam o tamanho e o alcance</span>\n<span class=\"t-tipo\">unsigned</span> <span class=\"t-tipo\">int</span> positivo = <span class=\"t-num\">300</span>;    <span class=\"t-com\">// só valores positivos, dobra o alcance</span>\n<span class=\"t-tipo\">long</span> <span class=\"t-tipo\">int</span> grande = <span class=\"t-num\">2147483648</span>L;</code></pre></figure>\n<div class=\"tab-rolo\"><table><thead><tr><th>Tipo</th><th>Tamanho típico</th><th>Alcance</th></tr></thead><tbody><tr><td><code>char</code></td><td>1 byte</td><td>-128 a 127</td></tr><tr><td><code>int</code></td><td>4 bytes</td><td>-2.147.483.648 a 2.147.483.647</td></tr><tr><td><code>float</code></td><td>4 bytes</td><td>~7 dígitos de precisão</td></tr><tr><td><code>double</code></td><td>8 bytes</td><td>~15 dígitos</td></tr></tbody></table></div>\n<p>Isso importa: se você somar 1 ao maior <code>int</code> possível, ele <strong>vira negativo</strong>. Chama-se <em>overflow</em> e já derrubou foguete.</p>","ancoras":[],"minutos":4},{"id":"a6-3","codigo":"6.3","titulo":"Entrada e saída","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;stdio.h&gt;\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    <span class=\"t-tipo\">int</span> idade;\n    <span class=\"t-tipo\">float</span> altura;\n    <span class=\"t-tipo\">char</span> nome[<span class=\"t-num\">50</span>];\n\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Nome: \"</span>);\n    <span class=\"t-fn\">scanf</span>(<span class=\"t-str\">\"%49s\"</span>, nome);        <span class=\"t-com\">// limite o tamanho — sem isso há falha de segurança</span>\n\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Idade: \"</span>);\n    <span class=\"t-fn\">scanf</span>(<span class=\"t-str\">\"%d\"</span>, &amp;idade);        <span class=\"t-com\">// o &amp; é obrigatório: passa o ENDEREÇO da variável</span>\n\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%s tem %d anos e %.2f de altura\\n\"</span>, nome, idade, altura);\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;\n}</code></pre></figure>\n<p><strong>Especificadores de formato</strong> — decore:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Código</th><th>Tipo</th></tr></thead><tbody><tr><td><code>%d</code></td><td>int</td></tr><tr><td><code>%f</code></td><td>float</td></tr><tr><td><code>%.2f</code></td><td>float com 2 casas</td></tr><tr><td><code>%c</code></td><td>char</td></tr><tr><td><code>%s</code></td><td>string</td></tr><tr><td><code>%p</code></td><td>ponteiro (endereço)</td></tr><tr><td><code>%lu</code></td><td>unsigned long</td></tr></tbody></table></div>\n<p>O <code>&amp;</code> no <code>scanf</code> é sua primeira aparição de ponteiros. Ele significa \"o endereço de\". O <code>scanf</code> precisa saber <em>onde</em> guardar, não <em>o que</em> está guardado.</p>","ancoras":[],"minutos":4},{"id":"a6-4","codigo":"6.4","titulo":"Controle de fluxo","nivel":"Básico","quando":"","html":"<p>Praticamente igual ao JavaScript:</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">if</span> (idade &gt;= <span class=\"t-num\">18</span>) {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Maior\\n\"</span>);\n} <span class=\"t-chave\">else</span> <span class=\"t-chave\">if</span> (idade &gt;= <span class=\"t-num\">16</span>) {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Pode votar\\n\"</span>);\n} <span class=\"t-chave\">else</span> {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Menor\\n\"</span>);\n}\n\n<span class=\"t-chave\">for</span> (<span class=\"t-tipo\">int</span> i = <span class=\"t-num\">0</span>; i &lt; <span class=\"t-num\">10</span>; i++) {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%d \"</span>, i);\n}\n\n<span class=\"t-chave\">while</span> (condicao) { }\n<span class=\"t-chave\">do</span> { } <span class=\"t-chave\">while</span> (condicao);\n\n<span class=\"t-chave\">switch</span> (opcao) {\n    <span class=\"t-chave\">case</span> <span class=\"t-num\">1</span>: <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Um\"</span>); <span class=\"t-chave\">break</span>;\n    default: <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Inválido\"</span>);\n}</code></pre></figure>\n<hr>","ancoras":[],"minutos":4},{"id":"a6-5","codigo":"6.5","titulo":"Vetores e strings","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> numeros[<span class=\"t-num\">5</span>] = {<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">4</span>, <span class=\"t-num\">5</span>};\n<span class=\"t-tipo\">int</span> matriz[<span class=\"t-num\">3</span>][<span class=\"t-num\">4</span>];                    <span class=\"t-com\">// 3 linhas, 4 colunas</span>\n\n<span class=\"t-chave\">for</span> (<span class=\"t-tipo\">int</span> i = <span class=\"t-num\">0</span>; i &lt; <span class=\"t-num\">5</span>; i++) {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%d \"</span>, numeros[i]);\n}</code></pre></figure>\n<p><strong>C não verifica limites.</strong> Se você escrever <code>numeros[10]</code>, o programa não reclama — ele grava numa região de memória que não é sua. Pode não dar erro na hora e corromper outra variável. Este é o tipo de bug mais difícil que existe, e é por isso que linguagens modernas fazem essa checagem.</p>\n<p><strong>String em C é um vetor de char terminado em <code>\\0</code>:</strong></p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">char</span> nome[] = <span class=\"t-str\">\"Ana\"</span>;\n<span class=\"t-com\">// Na memória: ['A']['n']['a']['\\0']  — 4 posições, não 3</span></code></pre></figure>\n<p>O <code>\\0</code> (caractere nulo) marca onde a string acaba. Sem ele, funções como <code>printf</code> continuam lendo memória alheia até encontrar um zero por acaso.</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;string.h&gt;\n\n<span class=\"t-fn\">strlen</span>(nome);              <span class=\"t-com\">// comprimento (não conta o \\0)</span>\n<span class=\"t-fn\">strcpy</span>(destino, origem);   <span class=\"t-com\">// copia</span>\n<span class=\"t-fn\">strcat</span>(destino, origem);   <span class=\"t-com\">// concatena</span>\n<span class=\"t-fn\">strcmp</span>(a, b);              <span class=\"t-com\">// compara: 0 se iguais</span></code></pre></figure>","ancoras":[],"minutos":4},{"id":"a6-6","codigo":"6.6","titulo":"Ponteiros","nivel":"Intermediário","quando":"","html":"<p><strong>O conceito central de C.</strong> Leia esta seção três vezes.</p>\n<p>Toda variável mora num endereço de memória. Um <strong>ponteiro</strong> é uma variável que guarda um endereço.</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> idade = <span class=\"t-num\">25</span>;\n<span class=\"t-tipo\">int</span> *ptr = &amp;idade;      <span class=\"t-com\">// ptr guarda o ENDEREÇO de idade</span>\n\n<span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%d\\n\"</span>, idade);   <span class=\"t-com\">// 25       — o valor</span>\n<span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%p\\n\"</span>, &amp;idade);  <span class=\"t-com\">// 0x7ffd… — o endereço</span>\n<span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%p\\n\"</span>, ptr);     <span class=\"t-com\">// 0x7ffd… — o mesmo endereço</span>\n<span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%d\\n\"</span>, *ptr);    <span class=\"t-com\">// 25       — o valor NAQUELE endereço</span></code></pre></figure>\n<p>Dois operadores, e eles são opostos:</p>\n<ul><li><code>&amp;</code> = \"o endereço de\" (pega o endereço)</li><li><code>*</code> = \"o valor no endereço\" (segue o endereço) — chamado <em>desreferenciar</em></li></ul>\n<p>Analogia: <code>idade</code> é uma casa. <code>&amp;idade</code> é o endereço escrito no papel. <code>ptr</code> é o papel. <code>*ptr</code> é entrar na casa.</p>\n<p><strong>Para que serve na prática:</strong></p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// SEM ponteiro: a função recebe uma CÓPIA, não muda nada fora</span>\n<span class=\"t-tipo\">void</span> <span class=\"t-fn\">tentarDobrar</span>(<span class=\"t-tipo\">int</span> n) {\n    n = n * <span class=\"t-num\">2</span>;\n}\n\n<span class=\"t-com\">// COM ponteiro: a função recebe o endereço e muda o original</span>\n<span class=\"t-tipo\">void</span> <span class=\"t-fn\">dobrar</span>(<span class=\"t-tipo\">int</span> *n) {\n    *n = *n * <span class=\"t-num\">2</span>;\n}\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    <span class=\"t-tipo\">int</span> x = <span class=\"t-num\">5</span>;\n    <span class=\"t-fn\">tentarDobrar</span>(x);\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%d\\n\"</span>, x);    <span class=\"t-com\">// 5  — não mudou</span>\n\n    <span class=\"t-fn\">dobrar</span>(&amp;x);\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%d\\n\"</span>, x);    <span class=\"t-com\">// 10 — mudou</span>\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;\n}</code></pre></figure>\n<p>Este é o conceito de <strong>passagem por valor vs. passagem por referência</strong>. Quando você entender isso, você vai entender de uma vez por que em JavaScript modificar um objeto dentro de uma função afeta o original mas modificar um número não afeta. É a mesma coisa, escondida.</p>\n<p><strong>Ponteiros e vetores</strong> são quase a mesma coisa em C:</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> v[<span class=\"t-num\">5</span>] = {<span class=\"t-num\">10</span>, <span class=\"t-num\">20</span>, <span class=\"t-num\">30</span>, <span class=\"t-num\">40</span>, <span class=\"t-num\">50</span>};\n<span class=\"t-tipo\">int</span> *p = v;          <span class=\"t-com\">// o nome do vetor JÁ É um ponteiro para o primeiro elemento</span>\n\n*p;        <span class=\"t-com\">// 10  — igual a v[0]</span>\n*(p + <span class=\"t-num\">1</span>);  <span class=\"t-com\">// 20  — igual a v[1]</span></code></pre></figure>\n<p>Agora você entende por que o índice começa em zero: <code>v[0]</code> significa \"ande zero posições a partir do início\".</p>","ancoras":[],"minutos":4},{"id":"a6-7","codigo":"6.7","titulo":"Funções","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Protótipo: avisa ao compilador que a função existe</span>\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">somar</span>(<span class=\"t-tipo\">int</span> a, <span class=\"t-tipo\">int</span> b);\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%d\\n\"</span>, <span class=\"t-fn\">somar</span>(<span class=\"t-num\">3</span>, <span class=\"t-num\">4</span>));\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;\n}\n\n<span class=\"t-com\">// Definição</span>\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">somar</span>(<span class=\"t-tipo\">int</span> a, <span class=\"t-tipo\">int</span> b) {\n    <span class=\"t-chave\">return</span> a + b;\n}</code></pre></figure>\n<p>O protótipo é necessário porque o compilador C lê o arquivo de cima para baixo, uma vez só. Se <code>main</code> chama <code>somar</code> antes de conhecê-la, dá erro.</p>","ancoras":[],"minutos":4},{"id":"a6-8","codigo":"6.8","titulo":"Structs","nivel":"Intermediário","quando":"","html":"<p>Agrupam dados relacionados. É o ancestral direto dos objetos:</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">struct</span> Pessoa {\n    <span class=\"t-tipo\">char</span> nome[<span class=\"t-num\">50</span>];\n    <span class=\"t-tipo\">int</span> idade;\n    <span class=\"t-tipo\">float</span> altura;\n};\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    <span class=\"t-tipo\">struct</span> Pessoa p1;\n    <span class=\"t-fn\">strcpy</span>(p1.nome, <span class=\"t-str\">\"Ana\"</span>);\n    p1.idade = <span class=\"t-num\">30</span>;\n\n    <span class=\"t-tipo\">struct</span> Pessoa p2 = {<span class=\"t-str\">\"Carlos\"</span>, <span class=\"t-num\">25</span>, <span class=\"t-num\">1.80</span>};\n\n    <span class=\"t-tipo\">struct</span> Pessoa *ptr = &amp;p1;\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%s\\n\"</span>, ptr-&gt;nome);      <span class=\"t-com\">// -&gt; acessa campo através de ponteiro</span>\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;\n}</code></pre></figure>\n<p>O <code>-&gt;</code> é atalho para <code>(*ptr).nome</code>. Você vai ver muito.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a6-9","codigo":"6.9","titulo":"Memória dinâmica","nivel":"Avançado","quando":"","html":"<p>Até agora todo vetor tinha tamanho fixo, decidido na hora de escrever o código. E se você só souber o tamanho durante a execução?</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;stdlib.h&gt;\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    <span class=\"t-tipo\">int</span> n;\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Quantos números? \"</span>);\n    <span class=\"t-fn\">scanf</span>(<span class=\"t-str\">\"%d\"</span>, &amp;n);\n\n    <span class=\"t-com\">// Aloca espaço para n inteiros</span>\n    <span class=\"t-tipo\">int</span> *vetor = (<span class=\"t-tipo\">int</span> *) <span class=\"t-fn\">malloc</span>(n * <span class=\"t-chave\">sizeof</span>(<span class=\"t-tipo\">int</span>));\n\n    <span class=\"t-chave\">if</span> (vetor == <span class=\"t-chave\">NULL</span>) {              <span class=\"t-com\">// SEMPRE verifique</span>\n        <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Memória insuficiente\\n\"</span>);\n        <span class=\"t-chave\">return</span> <span class=\"t-num\">1</span>;\n    }\n\n    <span class=\"t-chave\">for</span> (<span class=\"t-tipo\">int</span> i = <span class=\"t-num\">0</span>; i &lt; n; i++) {\n        vetor[i] = i * <span class=\"t-num\">10</span>;\n    }\n\n    <span class=\"t-com\">// Redimensiona</span>\n    vetor = <span class=\"t-fn\">realloc</span>(vetor, (n * <span class=\"t-num\">2</span>) * <span class=\"t-chave\">sizeof</span>(<span class=\"t-tipo\">int</span>));\n\n    <span class=\"t-fn\">free</span>(vetor);         <span class=\"t-com\">// OBRIGATÓRIO: devolve a memória</span>\n    vetor = <span class=\"t-chave\">NULL</span>;        <span class=\"t-com\">// evita usar ponteiro solto por acidente</span>\n\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;\n}</code></pre></figure>\n<div class=\"tab-rolo\"><table><thead><tr><th>Função</th><th>Faz</th></tr></thead><tbody><tr><td><code>malloc</code></td><td>Aloca memória (com lixo dentro)</td></tr><tr><td><code>calloc</code></td><td>Aloca e zera</td></tr><tr><td><code>realloc</code></td><td>Redimensiona</td></tr><tr><td><code>free</code></td><td>Libera</td></tr></tbody></table></div>\n<p><strong>Toda alocação precisa de um <code>free</code> correspondente.</strong> Se você esquecer, o programa vai consumindo memória até o sistema travar — é o <strong>vazamento de memória</strong> (<em>memory leak</em>). Python e JavaScript fazem isso automaticamente com o <em>garbage collector</em>; em C, o responsável é você.</p>\n<p>Os três erros clássicos:</p>\n<ol><li><strong>Memory leak</strong> — alocou e não liberou</li><li><strong>Dangling pointer</strong> — usou depois do <code>free</code></li><li><strong>Double free</strong> — liberou duas vezes</li></ol>\n<p>Use <code>valgrind ./programa</code> para detectar todos os três.</p>","ancoras":[],"minutos":4},{"id":"a6-10","codigo":"6.10","titulo":"Stack e Heap","nivel":"Avançado","quando":"","html":"<p>Duas regiões de memória, e entender a diferença explica metade dos bugs de C:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th></th><th>Stack (pilha)</th><th>Heap (monte)</th></tr></thead><tbody><tr><td>O que guarda</td><td>Variáveis locais</td><td>O que você aloca com <code>malloc</code></td></tr><tr><td>Gerenciamento</td><td>Automático</td><td>Manual (<code>free</code>)</td></tr><tr><td>Velocidade</td><td>Muito rápida</td><td>Mais lenta</td></tr><tr><td>Tamanho</td><td>Pequeno e limitado</td><td>Grande</td></tr><tr><td>Tempo de vida</td><td>Morre ao sair da função</td><td>Vive até você liberar</td></tr></tbody></table></div>\n<p>Erro clássico — devolver endereço de variável local:</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span>* <span class=\"t-fn\">errado</span>() {\n    <span class=\"t-tipo\">int</span> x = <span class=\"t-num\">42</span>;\n    <span class=\"t-chave\">return</span> &amp;x;      <span class=\"t-com\">// x morre quando a função acaba. Ponteiro inválido.</span>\n}\n\n<span class=\"t-tipo\">int</span>* <span class=\"t-fn\">certo</span>() {\n    <span class=\"t-tipo\">int</span> *x = <span class=\"t-fn\">malloc</span>(<span class=\"t-chave\">sizeof</span>(<span class=\"t-tipo\">int</span>));\n    *x = <span class=\"t-num\">42</span>;\n    <span class=\"t-chave\">return</span> x;       <span class=\"t-com\">// vive no heap, sobrevive. Quem chamou precisa dar free.</span>\n}</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a6-11","codigo":"6.11","titulo":"Arquivos e múltiplos arquivos","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>FILE *arquivo = <span class=\"t-fn\">fopen</span>(<span class=\"t-str\">\"dados.txt\"</span>, <span class=\"t-str\">\"r\"</span>);   <span class=\"t-com\">// \"r\" ler, \"w\" escrever, \"a\" acrescentar</span>\n\n<span class=\"t-chave\">if</span> (arquivo == <span class=\"t-chave\">NULL</span>) {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"Erro ao abrir\\n\"</span>);\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">1</span>;\n}\n\n<span class=\"t-tipo\">char</span> linha[<span class=\"t-num\">100</span>];\n<span class=\"t-chave\">while</span> (<span class=\"t-fn\">fgets</span>(linha, <span class=\"t-chave\">sizeof</span>(linha), arquivo) != <span class=\"t-chave\">NULL</span>) {\n    <span class=\"t-fn\">printf</span>(<span class=\"t-str\">\"%s\"</span>, linha);\n}\n\n<span class=\"t-fn\">fclose</span>(arquivo);       <span class=\"t-com\">// sempre feche</span></code></pre></figure>\n<p>Organizando projeto grande:</p>\n<figure class=\"cod\" data-lang=\"c\"><figcaption>C<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">/* matematica.h — a interface */</span>\n#ifndef MATEMATICA_H\n#define MATEMATICA_H\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">somar</span>(<span class=\"t-tipo\">int</span> a, <span class=\"t-tipo\">int</span> b);\n#endif\n\n<span class=\"t-com\">/* matematica.c — a implementação */</span>\n#include <span class=\"t-str\">\"matematica.h\"</span>\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">somar</span>(<span class=\"t-tipo\">int</span> a, <span class=\"t-tipo\">int</span> b) { <span class=\"t-chave\">return</span> a + b; }\n\n<span class=\"t-com\">/* main.c */</span>\n#include <span class=\"t-str\">\"matematica.h\"</span></code></pre></figure>\n<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>gcc -Wall main.c matematica.c -o programa</code></pre></figure>\n<p>O <code>#ifndef / #define / #endif</code> é a <em>include guard</em> — evita que o mesmo cabeçalho seja incluído duas vezes.</p>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[{"titulo":"Sistema de cadastro com structs e arquivos","rotulo":"Projeto 1","resumo":"<p>Cadastro de alunos: adicionar, listar, buscar, editar, remover, salvar e carregar de arquivo binário. Memória alocada dinamicamente conforme cresce.</p>","requisitos":[],"criterio":""},{"titulo":"Lista encadeada do zero","rotulo":"Projeto 2","resumo":"<p>Implemente uma lista ligada com inserção no início, no fim e no meio, remoção e busca. Este projeto é o exame final de ponteiros. Se você conseguir, você entendeu memória.</p>","requisitos":[],"criterio":""},{"titulo":"Algoritmos clássicos","rotulo":"Projeto 3","resumo":"<p>Implemente bubble sort, insertion sort, selection sort, quick sort, busca linear e busca binária. Meça o tempo de cada um com vetores de 1.000, 10.000 e 100.000 elementos e compare.</p>\n<hr>","requisitos":[],"criterio":""}],"checklist":["Explico a diferença entre <code>&amp;x</code> e <code>*p</code>","Explico passagem por valor vs. por referência com exemplo próprio","Sei por que string em C precisa do <code>\\0</code>","Uso <code>malloc</code> e <code>free</code> sem vazar (confirmado com valgrind)","Explico a diferença entre stack e heap","Minha lista encadeada funciona e não vaza memória"],"quiz":[{"p":"Em C, o que fazem <code>&amp;</code> e <code>*</code>?","o":["<code>&amp;</code> pega o endereço de uma variável; <code>*</code> pega o valor naquele endereço","<code>&amp;</code> é o E lógico; <code>*</code> é multiplicação, sempre","<code>&amp;</code> desreferencia; <code>*</code> pega o endereço","Os dois copiam o valor da variável"],"c":0,"e":"São opostos. Se <code>idade</code> é uma casa, <code>&amp;idade</code> é o endereço escrito no papel, <code>ptr</code> é o papel e <code>*ptr</code> é entrar na casa."},{"p":"Por que esta função está errada?<br><code>int* f() { int x = 42; return &amp;x; }</code>","o":["Falta <code>malloc</code> para o valor 42","<code>x</code> vive na stack e morre ao sair da função — o ponteiro devolvido é inválido","Não se pode retornar ponteiro de <code>int</code> em C","Falta um <code>free(x)</code> antes do return"],"c":1,"e":"Variável local vive na stack e é destruída quando a função acaba. Para sobreviver, precisa nascer no heap: <code>int *x = malloc(sizeof(int));</code> — e quem chamou fica responsável pelo <code>free</code>."},{"p":"Quais são os três erros clássicos de memória dinâmica em C?","o":["Overflow, underflow e segmentation fault","Memory leak, dangling pointer e double free","Null pointer, cast inválido e stack overflow","Alocação, realocação e liberação"],"c":1,"e":"Alocou e não liberou (leak); usou depois do <code>free</code> (dangling); liberou duas vezes (double free). O <code>valgrind ./programa</code> detecta os três."},{"p":"Onde vivem as variáveis locais e onde vive o que você aloca com <code>malloc</code>?","o":["As duas na stack","As duas no heap","Locais na stack; <code>malloc</code> no heap","Locais no heap; <code>malloc</code> na stack"],"c":2,"e":"A stack é automática, rápida, pequena, e morre ao sair da função. O heap é manual, mais lento, grande, e vive até você dar <code>free</code>."},{"p":"Dado <code>int v[5]</code> e <code>int *p = v;</code>, a que equivale <code>*(p + 1)</code>?","o":["<code>v[0]</code>","<code>v[1]</code>","<code>v[2]</code>","O endereço de <code>v</code>"],"c":1,"e":"O nome do vetor já é um ponteiro para o primeiro elemento, e somar 1 anda uma posição. É exatamente por isso que o índice começa em zero: <code>v[0]</code> significa \"ande zero posições a partir do início\"."}]},{"num":7,"nome":"C++","id":"m7","dificuldade":5,"tempo":"12 a 16 semanas","prereq":"Módulo 6","faixa":{"nome":"Profundo","cor":"f5"},"objetivo":"dominar orientação a objetos de verdade, gerenciamento moderno de recursos e abstrações de alto nível sem perder desempenho.","intro":"<p>C++ é a linguagem mais complexa deste material. Ela contém C inteiro dentro dela, mais orientação a objetos, mais templates, mais uma biblioteca padrão enorme. Ninguém sabe C++ inteiro — nem quem o criou.</p>\n<p><strong>Estratégia:</strong> aprenda <strong>C++ moderno</strong> (a partir do padrão C++11). Muito material antigo ensina práticas dos anos 90 que hoje são consideradas erradas.</p>\n<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>g++ -std=c++<span class=\"t-num\">17</span> -Wall -Wextra programa.cpp -o programa</code></pre></figure>\n<hr>","aulas":[{"id":"a7-1","codigo":"7.1","titulo":"O que muda em relação a C","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    std::string nome;\n\n    std::cout &lt;&lt; <span class=\"t-str\">\"Seu nome: \"</span>;\n    std::cin &gt;&gt; nome;\n    std::cout &lt;&lt; <span class=\"t-str\">\"Olá, \"</span> &lt;&lt; nome &lt;&lt; std::endl;\n\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;\n}</code></pre></figure>\n<p>Diferenças imediatas:</p>\n<ul><li><code>std::cout</code> e <code>std::cin</code> em vez de <code>printf</code>/<code>scanf</code> — sem especificadores de formato, sem <code>&amp;</code></li><li><code>std::string</code> em vez de <code>char[]</code> — cresce sozinha, não precisa de <code>\\0</code></li><li><code>&lt;&lt;</code> e <code>&gt;&gt;</code> são operadores sobrecarregados</li></ul>\n<p>Sobre o <code>using namespace std;</code> que você vai ver em todo tutorial: <strong>não use em arquivo de cabeçalho</strong> e evite em projetos grandes. Ele traz milhares de nomes para o escopo global e causa conflitos difíceis de rastrear. Escrever <code>std::</code> é chato mas é o certo.</p>","ancoras":[],"minutos":4},{"id":"a7-2","codigo":"7.2","titulo":"Referências","nivel":"Básico","quando":"","html":"<p>C++ adiciona um terceiro jeito de passar dados, mais seguro que ponteiro:</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">void</span> <span class=\"t-fn\">dobrar</span>(<span class=\"t-tipo\">int</span> &amp;n) {      <span class=\"t-com\">// &amp; no parâmetro = referência</span>\n    n = n * <span class=\"t-num\">2</span>;\n}\n\n<span class=\"t-tipo\">int</span> x = <span class=\"t-num\">5</span>;\n<span class=\"t-fn\">dobrar</span>(x);                 <span class=\"t-com\">// sem &amp; na chamada — mais limpo que C</span>\n<span class=\"t-com\">// x agora é 10</span></code></pre></figure>\n<p>Referência é um <strong>apelido</strong> para a variável original. Diferenças para ponteiro:</p>\n<ul><li>Não pode ser nula</li><li>Não pode ser reapontada</li><li>Não precisa de <code>*</code> para usar</li></ul>\n<p><strong>Passe objetos grandes por referência constante</strong> — evita a cópia e garante que a função não modifica:</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">void</span> <span class=\"t-fn\">mostrar</span>(<span class=\"t-tipo\">const</span> std::string &amp;texto) {\n    std::cout &lt;&lt; texto;\n}</code></pre></figure>","ancoras":[],"minutos":4},{"id":"a7-3","codigo":"7.3","titulo":"Sobrecarga e valores padrão","nivel":"Básico","quando":"","html":"<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-tipo\">int</span> <span class=\"t-fn\">somar</span>(<span class=\"t-tipo\">int</span> a, <span class=\"t-tipo\">int</span> b) { <span class=\"t-chave\">return</span> a + b; }\n<span class=\"t-tipo\">double</span> <span class=\"t-fn\">somar</span>(<span class=\"t-tipo\">double</span> a, <span class=\"t-tipo\">double</span> b) { <span class=\"t-chave\">return</span> a + b; }        <span class=\"t-com\">// mesmo nome, tipos diferentes</span>\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">somar</span>(<span class=\"t-tipo\">int</span> a, <span class=\"t-tipo\">int</span> b, <span class=\"t-tipo\">int</span> c) { <span class=\"t-chave\">return</span> a + b + c; }\n\n<span class=\"t-tipo\">void</span> <span class=\"t-fn\">desenhar</span>(<span class=\"t-tipo\">int</span> largura, <span class=\"t-tipo\">int</span> altura = <span class=\"t-num\">10</span>) { }</code></pre></figure>\n<p>C não permite isso. C++ escolhe a função certa pelos tipos dos argumentos.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a7-4","codigo":"7.4","titulo":"Classes e os quatro pilares","nivel":"Intermediário","quando":"","html":"<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">class</span> ContaBancaria {\n<span class=\"t-chave\">private</span>:\n    std::string titular;\n    <span class=\"t-tipo\">double</span> saldo;\n\n<span class=\"t-chave\">public</span>:\n    <span class=\"t-com\">// Construtor com lista de inicialização</span>\n    <span class=\"t-fn\">ContaBancaria</span>(std::string t, <span class=\"t-tipo\">double</span> s = <span class=\"t-num\">0</span>)\n        : <span class=\"t-fn\">titular</span>(t), <span class=\"t-fn\">saldo</span>(s) {}\n\n    <span class=\"t-com\">// Destrutor: chamado quando o objeto morre</span>\n    ~<span class=\"t-fn\">ContaBancaria</span>() {}\n\n    <span class=\"t-tipo\">void</span> <span class=\"t-fn\">depositar</span>(<span class=\"t-tipo\">double</span> valor) {\n        <span class=\"t-chave\">if</span> (valor &lt;= <span class=\"t-num\">0</span>) <span class=\"t-chave\">throw</span> std::<span class=\"t-fn\">invalid_argument</span>(<span class=\"t-str\">\"Valor inválido\"</span>);\n        saldo += valor;\n    }\n\n    <span class=\"t-tipo\">double</span> <span class=\"t-fn\">getSaldo</span>() <span class=\"t-tipo\">const</span> { <span class=\"t-chave\">return</span> saldo; }   <span class=\"t-com\">// const = não modifica o objeto</span>\n};</code></pre></figure>\n<p><strong>Os quatro pilares da orientação a objetos:</strong></p>\n<p><strong>1. Encapsulamento</strong> — esconder o interior, expor só o necessário.</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">private</span>:    <span class=\"t-com\">// só a própria classe acessa</span>\n<span class=\"t-chave\">protected</span>:  <span class=\"t-com\">// a classe e suas filhas</span>\n<span class=\"t-chave\">public</span>:     <span class=\"t-com\">// qualquer um</span></code></pre></figure>\n<p>O saldo é <code>private</code> justamente para ninguém fazer <code>conta.saldo = 1000000</code>. Toda mudança passa por <code>depositar</code>, que valida.</p>\n<p><strong>2. Herança</strong> — uma classe aproveita outra.</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">class</span> ContaPoupanca : <span class=\"t-chave\">public</span> ContaBancaria {\n<span class=\"t-chave\">private</span>:\n    <span class=\"t-tipo\">double</span> taxaJuros;\n<span class=\"t-chave\">public</span>:\n    <span class=\"t-fn\">ContaPoupanca</span>(std::string t, <span class=\"t-tipo\">double</span> s, <span class=\"t-tipo\">double</span> taxa)\n        : <span class=\"t-fn\">ContaBancaria</span>(t, s), <span class=\"t-fn\">taxaJuros</span>(taxa) {}\n\n    <span class=\"t-tipo\">void</span> <span class=\"t-fn\">renderJuros</span>() { <span class=\"t-fn\">depositar</span>(<span class=\"t-fn\">getSaldo</span>() * taxaJuros); }\n};</code></pre></figure>\n<p><strong>3. Polimorfismo</strong> — o mesmo comando produz comportamentos diferentes.</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">class</span> Animal {\n<span class=\"t-chave\">public</span>:\n    <span class=\"t-chave\">virtual</span> <span class=\"t-tipo\">void</span> <span class=\"t-fn\">falar</span>() <span class=\"t-tipo\">const</span> { std::cout &lt;&lt; <span class=\"t-str\">\"...\"</span>; }\n    <span class=\"t-chave\">virtual</span> ~<span class=\"t-fn\">Animal</span>() = default;      <span class=\"t-com\">// destrutor virtual: obrigatório na classe base</span>\n};\n\n<span class=\"t-chave\">class</span> Cachorro : <span class=\"t-chave\">public</span> Animal {\n<span class=\"t-chave\">public</span>:\n    <span class=\"t-tipo\">void</span> <span class=\"t-fn\">falar</span>() <span class=\"t-tipo\">const</span> <span class=\"t-chave\">override</span> { std::cout &lt;&lt; <span class=\"t-str\">\"Au au!\"</span>; }\n};\n\n<span class=\"t-chave\">class</span> Gato : <span class=\"t-chave\">public</span> Animal {\n<span class=\"t-chave\">public</span>:\n    <span class=\"t-tipo\">void</span> <span class=\"t-fn\">falar</span>() <span class=\"t-tipo\">const</span> <span class=\"t-chave\">override</span> { std::cout &lt;&lt; <span class=\"t-str\">\"Miau!\"</span>; }\n};\n\n<span class=\"t-tipo\">void</span> <span class=\"t-fn\">fazerFalar</span>(<span class=\"t-tipo\">const</span> Animal &amp;a) { a.<span class=\"t-fn\">falar</span>(); }\n<span class=\"t-com\">// A mesma função funciona com qualquer animal, e cada um fala do seu jeito</span></code></pre></figure>\n<p>A palavra <code>virtual</code> é o que ativa isso. Sem ela, <code>fazerFalar</code> chamaria sempre a versão de <code>Animal</code>. O <code>override</code> não é obrigatório mas peça ao compilador para conferir que você realmente sobrescreveu algo — pega erro de digitação.</p>\n<p><strong>4. Abstração</strong> — definir o \"o quê\" sem o \"como\".</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">class</span> Forma {\n<span class=\"t-chave\">public</span>:\n    <span class=\"t-chave\">virtual</span> <span class=\"t-tipo\">double</span> <span class=\"t-fn\">area</span>() <span class=\"t-tipo\">const</span> = <span class=\"t-num\">0</span>;    <span class=\"t-com\">// = 0 torna a função PURA</span>\n    <span class=\"t-chave\">virtual</span> ~<span class=\"t-fn\">Forma</span>() = default;\n};\n<span class=\"t-com\">// Forma agora é abstrata: não dá para criar um objeto Forma.</span>\n<span class=\"t-com\">// Toda classe filha é OBRIGADA a implementar area().</span></code></pre></figure>","ancoras":[],"minutos":4},{"id":"a7-5","codigo":"7.5","titulo":"A STL (biblioteca padrão)","nivel":"Intermediário","quando":"","html":"<p>Aqui C++ recompensa você por ter sofrido com C. Tudo que você implementou na mão já vem pronto e otimizado.</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;vector&gt;\n#include &lt;map&gt;\n#include &lt;set&gt;\n#include &lt;algorithm&gt;\n\n<span class=\"t-com\">// vector — array que cresce sozinho</span>\nstd::vector&lt;<span class=\"t-tipo\">int</span>&gt; nums = {<span class=\"t-num\">5</span>, <span class=\"t-num\">3</span>, <span class=\"t-num\">8</span>, <span class=\"t-num\">1</span>};\nnums.<span class=\"t-fn\">push_back</span>(<span class=\"t-num\">10</span>);\nnums.<span class=\"t-fn\">size</span>();\n<span class=\"t-chave\">for</span> (<span class=\"t-tipo\">int</span> n : nums) { }                    <span class=\"t-com\">// for range-based</span>\n\n<span class=\"t-com\">// map — dicionário ordenado por chave</span>\nstd::map&lt;std::string, <span class=\"t-tipo\">int</span>&gt; idades;\nidades[<span class=\"t-str\">\"Ana\"</span>] = <span class=\"t-num\">30</span>;\n<span class=\"t-chave\">if</span> (idades.<span class=\"t-fn\">count</span>(<span class=\"t-str\">\"Ana\"</span>)) { }\n\n<span class=\"t-com\">// unordered_map — mais rápido, sem ordem</span>\nstd::unordered_map&lt;std::string, <span class=\"t-tipo\">int</span>&gt; rapido;\n\n<span class=\"t-com\">// set — sem repetidos</span>\nstd::set&lt;<span class=\"t-tipo\">int</span>&gt; unicos = {<span class=\"t-num\">1</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>};      <span class=\"t-com\">// fica {1,2,3}</span>\n\n<span class=\"t-com\">// algorithms</span>\nstd::<span class=\"t-fn\">sort</span>(nums.<span class=\"t-fn\">begin</span>(), nums.<span class=\"t-fn\">end</span>());\nstd::<span class=\"t-fn\">sort</span>(nums.<span class=\"t-fn\">begin</span>(), nums.<span class=\"t-fn\">end</span>(), [](<span class=\"t-tipo\">int</span> a, <span class=\"t-tipo\">int</span> b) { <span class=\"t-chave\">return</span> a &gt; b; });  <span class=\"t-com\">// decrescente</span>\n<span class=\"t-tipo\">auto</span> it = std::<span class=\"t-fn\">find</span>(nums.<span class=\"t-fn\">begin</span>(), nums.<span class=\"t-fn\">end</span>(), <span class=\"t-num\">8</span>);\n<span class=\"t-tipo\">int</span> total = std::<span class=\"t-fn\">accumulate</span>(nums.<span class=\"t-fn\">begin</span>(), nums.<span class=\"t-fn\">end</span>(), <span class=\"t-num\">0</span>);</code></pre></figure>\n<p>Aquele <code>[](int a, int b) { return a &gt; b; }</code> é uma <strong>lambda</strong> — função anônima, igual à arrow function do JavaScript e ao <code>lambda</code> do Python. Repare como os conceitos se repetem entre linguagens; só muda a roupa.</p>\n<hr>","ancoras":[],"minutos":4},{"id":"a7-6","codigo":"7.6","titulo":"Templates","nivel":"Avançado","quando":"","html":"<p>Escrever código que funciona com qualquer tipo, sem duplicar:</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">template</span> &lt;<span class=\"t-chave\">typename</span> T&gt;\nT <span class=\"t-fn\">maximo</span>(T a, T b) {\n    <span class=\"t-chave\">return</span> (a &gt; b) ? a : b;\n}\n\n<span class=\"t-fn\">maximo</span>(<span class=\"t-num\">3</span>, <span class=\"t-num\">7</span>);          <span class=\"t-com\">// funciona com int</span>\n<span class=\"t-fn\">maximo</span>(<span class=\"t-num\">2.5</span>, <span class=\"t-num\">1.8</span>);      <span class=\"t-com\">// funciona com double</span>\nmaximo&lt;std::string&gt;(<span class=\"t-str\">\"a\"</span>, <span class=\"t-str\">\"b\"</span>);</code></pre></figure>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">template</span> &lt;<span class=\"t-chave\">typename</span> T&gt;\n<span class=\"t-chave\">class</span> Caixa {\n<span class=\"t-chave\">private</span>:\n    T conteudo;\n<span class=\"t-chave\">public</span>:\n    <span class=\"t-tipo\">void</span> <span class=\"t-fn\">guardar</span>(<span class=\"t-tipo\">const</span> T &amp;item) { conteudo = item; }\n    T <span class=\"t-fn\">pegar</span>() <span class=\"t-tipo\">const</span> { <span class=\"t-chave\">return</span> conteudo; }\n};\n\nCaixa&lt;<span class=\"t-tipo\">int</span>&gt; caixaInt;\nCaixa&lt;std::string&gt; caixaTexto;</code></pre></figure>\n<p>O <code>std::vector&lt;int&gt;</code> que você usou é exatamente isso: um template instanciado com <code>int</code>. A STL inteira é feita de templates.</p>","ancoras":[],"minutos":4},{"id":"a7-7","codigo":"7.7","titulo":"Gerenciamento moderno de memória","nivel":"Avançado","quando":"","html":"<p>Este é o assunto mais importante do C++ moderno.</p>\n<p><strong>RAII</strong> (<em>Resource Acquisition Is Initialization</em>): o recurso é adquirido no construtor e liberado no destrutor. Como o destrutor é chamado automaticamente quando o objeto sai de escopo, o recurso nunca vaza — nem se der exceção.</p>\n<p><strong>Ponteiros inteligentes</strong> aplicam RAII à memória:</p>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;memory&gt;\n\n<span class=\"t-com\">// unique_ptr — um único dono. Libera sozinho.</span>\nstd::unique_ptr&lt;<span class=\"t-tipo\">int</span>&gt; p1 = std::make_unique&lt;<span class=\"t-tipo\">int</span>&gt;(<span class=\"t-num\">42</span>);\n<span class=\"t-com\">// não precisa de delete</span>\n\n<span class=\"t-com\">// shared_ptr — vários donos, conta referências. Libera quando o último sai.</span>\nstd::shared_ptr&lt;<span class=\"t-tipo\">int</span>&gt; p2 = std::make_shared&lt;<span class=\"t-tipo\">int</span>&gt;(<span class=\"t-num\">42</span>);\nstd::shared_ptr&lt;<span class=\"t-tipo\">int</span>&gt; p3 = p2;      <span class=\"t-com\">// agora são 2 donos</span>\n\n<span class=\"t-com\">// weak_ptr — observa sem contar como dono. Quebra referência circular.</span>\nstd::weak_ptr&lt;<span class=\"t-tipo\">int</span>&gt; p4 = p2;</code></pre></figure>\n<aside class=\"destaque destaque-regra\"><strong>Regra do C++ moderno:</strong> você não deve escrever <code>new</code> nem <code>delete</code> no seu código de aplicação. Use <code>make_unique</code>, <code>make_shared</code> e containers da STL. Isso elimina de uma vez a categoria inteira de bugs que você penou para evitar em C.</aside>\n<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// Estilo antigo, propenso a vazamento</span>\nAnimal *a = <span class=\"t-chave\">new</span> <span class=\"t-fn\">Cachorro</span>();\n<span class=\"t-chave\">delete</span> a;                      <span class=\"t-com\">// se der exceção antes daqui, vazou</span>\n\n<span class=\"t-com\">// Estilo moderno</span>\n<span class=\"t-tipo\">auto</span> a = std::make_unique&lt;Cachorro&gt;();\n<span class=\"t-com\">// libera sozinho, aconteça o que acontecer</span></code></pre></figure>","ancoras":[],"minutos":4},{"id":"a7-8","codigo":"7.8","titulo":"Exceções","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>#include &lt;stdexcept&gt;\n\n<span class=\"t-tipo\">double</span> <span class=\"t-fn\">dividir</span>(<span class=\"t-tipo\">double</span> a, <span class=\"t-tipo\">double</span> b) {\n    <span class=\"t-chave\">if</span> (b == <span class=\"t-num\">0</span>) <span class=\"t-chave\">throw</span> std::<span class=\"t-fn\">runtime_error</span>(<span class=\"t-str\">\"Divisão por zero\"</span>);\n    <span class=\"t-chave\">return</span> a / b;\n}\n\n<span class=\"t-tipo\">int</span> <span class=\"t-fn\">main</span>() {\n    <span class=\"t-chave\">try</span> {\n        std::cout &lt;&lt; <span class=\"t-fn\">dividir</span>(<span class=\"t-num\">10</span>, <span class=\"t-num\">0</span>);\n    }\n    <span class=\"t-chave\">catch</span> (<span class=\"t-tipo\">const</span> std::runtime_error &amp;e) {\n        std::cerr &lt;&lt; <span class=\"t-str\">\"Erro: \"</span> &lt;&lt; e.<span class=\"t-fn\">what</span>() &lt;&lt; std::endl;\n    }\n    <span class=\"t-chave\">catch</span> (<span class=\"t-tipo\">const</span> std::exception &amp;e) {\n        std::cerr &lt;&lt; <span class=\"t-str\">\"Erro genérico: \"</span> &lt;&lt; e.<span class=\"t-fn\">what</span>() &lt;&lt; std::endl;\n    }\n    <span class=\"t-chave\">return</span> <span class=\"t-num\">0</span>;\n}</code></pre></figure>\n<p>Capture sempre por <strong>referência constante</strong> (<code>const &amp;</code>) — capturar por valor faz cópia e pode fatiar o objeto de exceção.</p>","ancoras":[],"minutos":4},{"id":"a7-9","codigo":"7.9","titulo":"Recursos que valem conhecer","nivel":"Avançado","quando":"","html":"<figure class=\"cod\" data-lang=\"cpp\"><figcaption>C++<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// auto — o compilador deduz o tipo</span>\n<span class=\"t-tipo\">auto</span> x = <span class=\"t-num\">42</span>;\n<span class=\"t-tipo\">auto</span> it = vetor.<span class=\"t-fn\">begin</span>();\n\n<span class=\"t-com\">// Move semantics — transfere em vez de copiar (rápido para objetos grandes)</span>\nstd::vector&lt;<span class=\"t-tipo\">int</span>&gt; v2 = std::<span class=\"t-fn\">move</span>(v1);   <span class=\"t-com\">// v1 fica vazio, nada foi copiado</span>\n\n<span class=\"t-com\">// constexpr — calculado em tempo de compilação</span>\n<span class=\"t-tipo\">constexpr</span> <span class=\"t-tipo\">int</span> <span class=\"t-fn\">quadrado</span>(<span class=\"t-tipo\">int</span> n) { <span class=\"t-chave\">return</span> n * n; }\n<span class=\"t-tipo\">constexpr</span> <span class=\"t-tipo\">int</span> resultado = <span class=\"t-fn\">quadrado</span>(<span class=\"t-num\">5</span>);   <span class=\"t-com\">// já vale 25 no executável</span>\n\n<span class=\"t-com\">// Estruturas com nome (C++17)</span>\n<span class=\"t-tipo\">auto</span> [chave, valor] = *mapa.<span class=\"t-fn\">begin</span>();     <span class=\"t-com\">// igual à desestruturação do JS</span></code></pre></figure>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[{"titulo":"Sistema com hierarquia de classes","rotulo":"Projeto 1","resumo":"<p>Sistema de biblioteca ou de folha de pagamento. Classe base abstrata, no mínimo três classes derivadas, polimorfismo real, uso de STL, ponteiros inteligentes, exceções para regras de negócio.</p>","requisitos":[],"criterio":""},{"titulo":"Estruturas de dados genéricas com template","rotulo":"Projeto 2","resumo":"<p>Implemente sua própria <code>Pilha&lt;T&gt;</code>, <code>Fila&lt;T&gt;</code> e <code>ListaLigada&lt;T&gt;</code>. Compare com as versões da STL. Aqui você entende o que a STL faz por você.</p>","requisitos":[],"criterio":""},{"titulo":"Aplicação de porte real","rotulo":"Projeto 3","resumo":"<p>Um jogo simples (tabuleiro, batalha naval) ou um interpretador de calculadora com precedência de operadores. Múltiplos arquivos, compilado com Makefile ou CMake, com testes.</p>\n<hr>","requisitos":[],"criterio":""}],"checklist":["Explico os quatro pilares com exemplo em código meu","Sei por que a classe base precisa de destrutor virtual","Sei a diferença entre <code>unique_ptr</code> e <code>shared_ptr</code>","Escrevo função e classe template","Explico RAII e por que ele elimina vazamento","Não escrevo <code>new</code>/<code>delete</code> no meu código","Uso <code>vector</code>, <code>map</code> e <code>sort</code> sem consultar"],"quiz":[{"p":"Qual a diferença entre referência e ponteiro em C++?","o":["Referência não pode ser nula, não pode ser reapontada e dispensa o <code>*</code>","Referência é mais lenta porque faz cópia","Ponteiro só funciona com tipos primitivos","Não há diferença prática — a sintaxe é que muda"],"c":0,"e":"Referência é um apelido para a variável original. As três garantias — nunca nula, nunca reapontada, sem desreferência explícita — a tornam mais segura que ponteiro para passar dados."},{"p":"O que é RAII?","o":["Um padrão para nomear classes em C++","O recurso é adquirido no construtor e liberado no destrutor, que roda sozinho ao sair de escopo","Uma biblioteca de alocação da STL","Um modo de compilação que checa vazamentos"],"c":1,"e":"<em>Resource Acquisition Is Initialization</em>. Como o destrutor é chamado automaticamente quando o objeto sai de escopo, o recurso nunca vaza — nem se der exceção no meio."},{"p":"Qual a regra do C++ moderno para memória?","o":["Sempre parear cada <code>new</code> com um <code>delete</code>","Usar <code>malloc</code> e <code>free</code>, como em C","Não escrever <code>new</code> nem <code>delete</code> no código de aplicação — usar <code>make_unique</code>, <code>make_shared</code> e containers da STL","Alocar tudo na stack e nunca usar heap"],"c":2,"e":"Isso elimina de uma vez a categoria inteira de bugs que você penou para evitar em C. No estilo antigo, uma exceção lançada entre o <code>new</code> e o <code>delete</code> já era um vazamento."},{"p":"Qual ponteiro inteligente usar quando vários donos compartilham o mesmo objeto?","o":["<code>unique_ptr</code>","<code>shared_ptr</code>","<code>weak_ptr</code>","Ponteiro cru mesmo"],"c":1,"e":"<code>shared_ptr</code> conta referências e libera quando o último dono sai. <code>unique_ptr</code> tem um único dono; <code>weak_ptr</code> observa sem contar como dono, e serve para quebrar referência circular."},{"p":"Como passar um <code>std::string</code> grande para uma função sem copiá-lo?","o":["<code>void f(std::string texto)</code>","<code>void f(const std::string &amp;texto)</code>","<code>void f(std::string *texto)</code>","<code>void f(auto texto)</code>"],"c":1,"e":"Referência constante evita a cópia e ainda garante ao leitor — e ao compilador — que a função não modifica o argumento."}]},{"num":8,"nome":"O que atravessa todas as linguagens","id":"m8","dificuldade":0,"tempo":"em paralelo","prereq":"nenhum","faixa":{"nome":"Transversal","cor":"ft"},"objetivo":"","intro":"<aside class=\"destaque destaque-nota\">Estude em paralelo aos módulos, não depois. Marquei em qual módulo faz sentido começar cada um.</aside>\n<p>Linguagem é vocabulário. O que segue é gramática — e é o que decide se você é programador ou digitador de sintaxe.</p>","aulas":[{"id":"a8-1","codigo":"8.1","titulo":"Git e GitHub","nivel":"Base","quando":"comece junto com o Módulo 1","html":"<p>Não é opcional. Toda vaga exige, e é o seu portfólio.</p>\n<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">git</span> init\n<span class=\"t-chave\">git</span> add .\n<span class=\"t-chave\">git</span> commit -m <span class=\"t-str\">\"Descrição do que mudou\"</span>\n<span class=\"t-chave\">git</span> remote add origin https://github.com/usuario/repo.<span class=\"t-chave\">git</span>\n<span class=\"t-chave\">git</span> push -u origin main\n\n<span class=\"t-chave\">git</span> branch minha-feature\n<span class=\"t-chave\">git</span> checkout minha-feature\n<span class=\"t-chave\">git</span> merge minha-feature\n<span class=\"t-chave\">git</span> log --oneline\n<span class=\"t-chave\">git</span> status</code></pre></figure>\n<p>Comece a usar no seu primeiro projeto de HTML. Um GitHub com commits regulares há dois anos vale mais numa entrevista que um certificado.</p>","ancoras":[],"minutos":4},{"id":"a8-2","codigo":"8.2","titulo":"Estruturas de dados","nivel":"Base","quando":"comece no Módulo 4, aprofunde no 6","html":"<div class=\"tab-rolo\"><table><thead><tr><th>Estrutura</th><th>Para que serve</th><th>Custo de busca</th></tr></thead><tbody><tr><td>Array</td><td>Acesso por posição</td><td>O(1) por índice, O(n) por valor</td></tr><tr><td>Lista ligada</td><td>Inserção/remoção frequente</td><td>O(n)</td></tr><tr><td>Pilha (LIFO)</td><td>Desfazer, chamadas de função</td><td>O(n)</td></tr><tr><td>Fila (FIFO)</td><td>Processamento em ordem</td><td>O(n)</td></tr><tr><td>Tabela hash</td><td>Busca por chave</td><td>O(1) em média</td></tr><tr><td>Árvore binária de busca</td><td>Dados ordenados</td><td>O(log n)</td></tr><tr><td>Grafo</td><td>Relações, rotas, redes</td><td>Depende</td></tr></tbody></table></div>","ancoras":[],"minutos":4},{"id":"a8-3","codigo":"8.3","titulo":"Algoritmos e complexidade","nivel":"Base","quando":"Módulo 4 em diante","html":"<p><strong>Notação Big-O</strong> descreve como o tempo cresce conforme os dados crescem:</p>\n<div class=\"tab-rolo\"><table><thead><tr><th>Notação</th><th>Nome</th><th>Exemplo</th><th>1.000 itens</th></tr></thead><tbody><tr><td>O(1)</td><td>Constante</td><td>Acessar <code>v[5]</code></td><td>1 operação</td></tr><tr><td>O(log n)</td><td>Logarítmica</td><td>Busca binária</td><td>~10</td></tr><tr><td>O(n)</td><td>Linear</td><td>Percorrer uma lista</td><td>1.000</td></tr><tr><td>O(n log n)</td><td>Linearítmica</td><td>Merge sort, quick sort</td><td>~10.000</td></tr><tr><td>O(n²)</td><td>Quadrática</td><td>Dois laços aninhados</td><td>1.000.000</td></tr><tr><td>O(2ⁿ)</td><td>Exponencial</td><td>Força bruta</td><td>inviável</td></tr></tbody></table></div>\n<p>A lição prática: <strong>dois laços aninhados sobre o mesmo dado é sinal de alerta</strong>. Com 100 itens é instantâneo, com 100 mil o programa morre.</p>\n<p>Algoritmos para implementar você mesmo pelo menos uma vez: busca linear, busca binária, bubble sort, insertion sort, merge sort, quick sort, recursão (fatorial, Fibonacci, Torre de Hanói).</p>","ancoras":[],"minutos":4},{"id":"a8-4","codigo":"8.4","titulo":"Banco de dados","nivel":"Base","quando":"Módulo 4 em diante","html":"<figure class=\"cod\" data-lang=\"sql\"><figcaption>SQL<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">SELECT</span> nome, preco <span class=\"t-chave\">FROM</span> produtos <span class=\"t-chave\">WHERE</span> preco &gt; <span class=\"t-num\">100</span> <span class=\"t-chave\">ORDER</span> <span class=\"t-chave\">BY</span> preco <span class=\"t-chave\">DESC</span>;\n<span class=\"t-chave\">INSERT</span> <span class=\"t-chave\">INTO</span> <span class=\"t-fn\">produtos</span> (nome, preco) <span class=\"t-chave\">VALUES</span> (<span class=\"t-str\">'Café'</span>, <span class=\"t-num\">18.00</span>);\n<span class=\"t-chave\">UPDATE</span> produtos <span class=\"t-chave\">SET</span> preco = <span class=\"t-num\">20.00</span> <span class=\"t-chave\">WHERE</span> id = <span class=\"t-num\">1</span>;\n<span class=\"t-chave\">DELETE</span> <span class=\"t-chave\">FROM</span> produtos <span class=\"t-chave\">WHERE</span> id = <span class=\"t-num\">1</span>;\n\n<span class=\"t-chave\">SELECT</span> p.nome, c.nome <span class=\"t-chave\">AS</span> categoria\n<span class=\"t-chave\">FROM</span> produtos p\n<span class=\"t-chave\">JOIN</span> categorias c <span class=\"t-chave\">ON</span> p.categoria_id = c.id;</code></pre></figure>\n<p>Aprenda SQL antes de qualquer ORM. Comece com SQLite (não exige instalar servidor), depois PostgreSQL.</p>","ancoras":[],"minutos":4},{"id":"a8-5","codigo":"8.5","titulo":"Como a web funciona","nivel":"Base","quando":"Módulo 3 em diante","html":"<ul><li>Cliente e servidor; o que roda em cada um</li><li>HTTP: métodos GET, POST, PUT, DELETE</li><li>Códigos de status: 200, 201, 301, 400, 401, 403, 404, 500</li><li>JSON como formato de troca</li><li>API REST: recursos e endpoints</li><li>Autenticação: sessão, token, JWT</li><li>DNS e como o navegador acha o servidor</li></ul>","ancoras":[],"minutos":4},{"id":"a8-6","codigo":"8.6","titulo":"Boas práticas","nivel":"Base","quando":"sempre","html":"<ul><li><strong>DRY</strong> (<em>Don't Repeat Yourself</em>): copiou e colou código? Vira função.</li><li><strong>KISS</strong> (<em>Keep It Simple</em>): a solução esperta que ninguém entende é pior que a óbvia.</li><li><strong>YAGNI</strong> (<em>You Aren't Gonna Need It</em>): não construa para um futuro imaginário.</li><li><strong>Nomes claros</strong>: <code>calcularImpostoRenda()</code> vale mais que qualquer comentário.</li><li><strong>Comente o porquê, não o quê</strong>: o código já diz o que faz. Escreva por que faz assim.</li><li><strong>Commits pequenos e frequentes</strong>, com mensagem que descreve a mudança.</li></ul>","ancoras":[],"minutos":4},{"id":"a8-7","codigo":"8.7","titulo":"Testes","nivel":"Base","quando":"Módulo 4 em diante","html":"<figure class=\"cod\" data-lang=\"python\"><figcaption>Python<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\"># Python: pytest</span>\n<span class=\"t-chave\">def</span> <span class=\"t-fn\">test_calcular_media</span>():\n    <span class=\"t-chave\">assert</span> <span class=\"t-fn\">calcular_media</span>([<span class=\"t-num\">8</span>, <span class=\"t-num\">6</span>]) == <span class=\"t-num\">7</span>\n    <span class=\"t-chave\">assert</span> <span class=\"t-fn\">calcular_media</span>([]) == <span class=\"t-num\">0</span></code></pre></figure>\n<figure class=\"cod\" data-lang=\"javascript\"><figcaption>JavaScript<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-com\">// JavaScript: Jest</span>\n<span class=\"t-fn\">test</span>(<span class=\"t-str\">'soma dois números'</span>, () =&gt; {\n    <span class=\"t-fn\">expect</span>(<span class=\"t-fn\">somar</span>(<span class=\"t-num\">2</span>, <span class=\"t-num\">3</span>)).<span class=\"t-fn\">toBe</span>(<span class=\"t-num\">5</span>);\n});</code></pre></figure>\n<p>Teste automatizado é o que separa código de estimação de código profissional. Nenhuma empresa séria aceita código sem teste.</p>","ancoras":[],"minutos":4},{"id":"a8-8","codigo":"8.8","titulo":"Terminal e ambiente","nivel":"Base","quando":"Módulo 1 em diante","html":"<figure class=\"cod\" data-lang=\"bash\"><figcaption>Terminal<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code><span class=\"t-chave\">cd</span> pasta          <span class=\"t-chave\">ls</span> -la          <span class=\"t-chave\">pwd</span>\n<span class=\"t-chave\">mkdir</span> nova        <span class=\"t-chave\">rm</span> -rf pasta    <span class=\"t-chave\">cp</span> origem destino\n<span class=\"t-chave\">cat</span> arquivo       <span class=\"t-chave\">grep</span> <span class=\"t-str\">\"texto\"</span> arquivo</code></pre></figure>\n<p>E, em algum momento depois do Módulo 4: noções de Linux, Docker e integração contínua.</p>\n<hr>","ancoras":[],"minutos":4}],"exercicios":[],"exerciciosNota":"","projetos":[],"checklist":[],"quiz":[{"p":"Você vê dois laços aninhados percorrendo o mesmo dado. Qual a complexidade e por que isso é um alerta?","o":["O(n log n) — aceitável em qualquer escala","O(n²) — com 100 itens é instantâneo, com 100 mil o programa morre","O(n) — laços aninhados não mudam a ordem","O(2ⁿ) — inviável sempre"],"c":1,"e":"Big-O descreve como o tempo cresce conforme os dados crescem. O(n²) com mil itens já são um milhão de operações. É o sinal de alerta mais útil de aprender cedo."},{"p":"Qual algoritmo tem complexidade O(log n)?","o":["Busca linear","Busca binária","Bubble sort","Força bruta"],"c":1,"e":"A busca binária corta o espaço pela metade a cada passo: mil itens em cerca de dez operações. Busca linear é O(n), bubble sort é O(n²), força bruta é O(2ⁿ)."},{"p":"O que diz o princípio YAGNI?","o":["Copiou e colou código? Vira função","A solução esperta que ninguém entende é pior que a óbvia","Não construa para um futuro imaginário","Comente o porquê, não o quê"],"c":2,"e":"<em>You Aren't Gonna Need It</em>. O primeiro é DRY, o segundo é KISS, e o último é a regra de comentários — todos do mesmo conjunto de boas práticas."},{"p":"Por que aprender SQL antes de qualquer ORM?","o":["Porque ORMs estão em desuso","Porque o ORM gera SQL — sem entender o que ele gera, você não sabe depurar nem otimizar","Porque SQL é mais rápido de escrever","Porque ORMs não suportam JOIN"],"c":1,"e":"Comece com SQLite, que não exige instalar servidor, e depois PostgreSQL. O ORM é uma camada sobre o SQL — não um substituto para entendê-lo."},{"p":"O que um comentário deve explicar?","o":["O que o código faz, linha por linha","Por que o código faz assim","Quem escreveu e quando","Qual a complexidade do trecho"],"c":1,"e":"O código já diz o <em>que</em> faz. Escreva o <em>porquê</em> — a decisão, a restrição, o motivo de não ser do jeito óbvio. E prefira nomes claros: <code>calcularImpostoRenda()</code> vale mais que qualquer comentário."}]}],"paginas":[{"id":"erros-que-quase-todo-iniciante-comete","titulo":"Erros que quase todo iniciante comete","html":"<p><strong>Pular a lógica.</strong> É a causa raiz de 90% das dificuldades depois. Se você está travando em JavaScript, o problema quase nunca é JavaScript — é lógica.</p>\n<p><strong>Só assistir aula.</strong> Assistir dá a sensação de aprender sem o aprendizado. Se você não fechou o vídeo e escreveu sozinho, não aprendeu.</p>\n<p><strong>Pular para framework cedo demais.</strong> React sem JavaScript sólido produz alguém que copia soluções sem entender e trava na primeira coisa fora do tutorial. Isso aparece na entrevista técnica em cinco minutos.</p>\n<p><strong>Estudar quatro linguagens ao mesmo tempo.</strong> Uma de cada vez, com profundidade. Trocar de linguagem quando aperta é fuga disfarçada de estratégia.</p>\n<p><strong>Não terminar projetos.</strong> Dez projetos com 40% feitos valem zero. Um projeto terminado e publicado vale uma entrevista.</p>\n<p><strong>Achar que precisa saber tudo antes de se candidatar.</strong> Ninguém sabe tudo. Vaga júnior não espera que você saiba — espera que você aprenda rápido e não trave sozinho.</p>\n<p><strong>Copiar e colar sem entender.</strong> Funciona hoje, te derruba na próxima. Se você colou algo, leia linha por linha até saber o que cada uma faz, ou apague.</p>\n<p><strong>Comparar seu começo com o meio dos outros.</strong> Todo mundo que você admira já esteve travado numa chave que não fechava.</p>\n<hr>","ancoras":[]},{"id":"recursos-que-valem-o-tempo","titulo":"Recursos que valem o tempo","html":"<p><strong>Documentação (leia sempre a fonte primária):</strong></p>\n<ul><li><a href=\"https://developer.mozilla.org/pt-BR/\" target=\"_blank\" rel=\"noopener noreferrer\">MDN Web Docs<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — HTML, CSS, JavaScript. A melhor referência que existe</li><li><a href=\"https://docs.python.org/pt-br/3/\" target=\"_blank\" rel=\"noopener noreferrer\">Documentação oficial do Python<span class=\"ext\" aria-hidden=\"true\">↗</span></a></li><li><a href=\"https://en.cppreference.com/\" target=\"_blank\" rel=\"noopener noreferrer\">cppreference.com<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — C e C++</li></ul>\n<p><strong>Prática:</strong></p>\n<ul><li><a href=\"https://www.beecrowd.com.br/\" target=\"_blank\" rel=\"noopener noreferrer\">Beecrowd<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — exercícios em português, ótimo para lógica</li><li><a href=\"https://exercism.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Exercism<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — exercícios com correção por mentor humano, gratuito</li><li><a href=\"https://www.frontendmentor.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Frontend Mentor<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — layouts reais para implementar</li><li><a href=\"https://www.codewars.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Codewars<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — desafios por nível</li></ul>\n<p><strong>Cursos gratuitos e sérios:</strong></p>\n<ul><li><a href=\"https://www.freecodecamp.org/portuguese/\" target=\"_blank\" rel=\"noopener noreferrer\">freeCodeCamp<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — currículo completo, em português</li><li><a href=\"https://cs50.harvard.edu/x/\" target=\"_blank\" rel=\"noopener noreferrer\">CS50 (Harvard)<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — usa C, gratuito, é o melhor curso introdutório de ciência da computação que existe</li><li><a href=\"https://www.theodinproject.com/\" target=\"_blank\" rel=\"noopener noreferrer\">The Odin Project<span class=\"ext\" aria-hidden=\"true\">↗</span></a> — trilha web completa</li></ul>\n<p><strong>Livros:</strong></p>\n<ul><li><em>Entendendo Algoritmos</em> — Aditya Bhargava (ilustrado, ótimo primeiro livro)</li><li><em>Código Limpo</em> — Robert C. Martin (leia depois do Módulo 4)</li><li><em>The C Programming Language</em> — Kernighan &amp; Ritchie (o clássico de C)</li></ul>\n<hr>","ancoras":[]},{"id":"resumo-do-caminho","titulo":"Resumo do caminho","html":"<figure class=\"cod\" data-lang=\"txt\"><figcaption>Pseudocódigo<button class=\"copiar\" type=\"button\" data-copiar>Copiar</button></figcaption><pre><code>MÓDULO 0 — Lógica          3-4 sem    ●○○○○   a base de tudo\nMÓDULO 1 — HTML            3 sem      ●○○○○   estrutura\nMÓDULO 2 — CSS             5-6 sem    ●●○○○   apresentação\nMÓDULO 3 — JavaScript      12-16 sem  ●●●○○   ← ponto de empregabilidade\nMÓDULO 4 — Python          10-12 sem  ●●●○○   back-end e algoritmos\nMÓDULO 5 — Java            10-12 sem  ●●●○○   ← back-end corporativo\nMÓDULO 6 — C               10-12 sem  ●●●●○   como a máquina funciona\nMÓDULO 7 — C++             12-16 sem  ●●●●●   abstração sem perder controle\nMÓDULO 8 — Fundamentos     paralelo   —       o que realmente importa</code></pre></figure>\n<p>Três coisas para levar daqui:</p>\n<ol><li><strong>Consistência bate intensidade.</strong> Uma hora por dia, cinco dias por semana, derruba oito horas de sábado.</li><li><strong>Projeto terminado é a única prova.</strong> Ninguém contrata por horas assistidas.</li><li><strong>Travar é o processo, não uma falha nele.</strong> Quem programa há dez anos ainda passa uma tarde inteira num bug bobo. A diferença é que já sabe que isso passa.</li></ol>\n<p>Comece hoje pelo Módulo 0. No papel.</p>","ancoras":[]}]};</script>
<script>/* ============================================================
   Caminho da Programação — portal

   O conteúdo vem pronto em DADOS (gerado do markdown original).
   Este arquivo cuida de três coisas: guardar o progresso, rotear
   as telas e desenhá-las.
   ============================================================ */

const D = window.DADOS;
const MODS = D.modulos;
const porNum = new Map(MODS.map((m) => [m.num, m]));

/* Fases do cronograma — estruturais, vêm da tabela do material. */
const FASES = [
  { n: 1, mods: [0, 1, 2], tempo: '~3 meses', o: 'Montar sites estáticos. Já dá freela pequeno' },
  { n: 2, mods: [3], tempo: '~4 meses', o: 'Vaga júnior de front-end', marca: 'Ponto de empregabilidade' },
  { n: 3, mods: [4], tempo: '~3 meses', o: 'Back-end, automação, dados. Dobra seu leque de vagas' },
  { n: 4, mods: [5], tempo: '~3 meses', o: 'Vaga júnior de back-end corporativo', marca: 'Segundo ponto de empregabilidade' },
  { n: 5, mods: [6, 7], tempo: '~5 meses', o: 'Base sólida. Diferencial em entrevista técnica' },
];

const TOTAL_AULAS = MODS.reduce((s, m) => s + m.aulas.length, 0);

/* ============================================================
   Progresso
   ============================================================ */

const CHAVE = 'caminho-programacao-v2';
const CHAVE_V1 = 'caminho-programacao-v1';
const vazio = () => ({ v: 1, aulas: {}, check: {}, ex: {}, req: {}, proj: {}, quiz: {}, nome: '', t: 0 });

let E = vazio();

/**
 * Traz para a numeração nova o progresso salvo antes da entrada do Java.
 *
 * Java entrou como Módulo 5 e empurrou C, C++ e Fundamentos para 6, 7 e 8.
 * Como toda chave carrega o número do módulo na frente (`6:3`, `a6-2`), sem
 * remapear um checklist fechado no C reapareceria marcado no Java. Montar um
 * objeto novo, em vez de renomear no lugar, dispensa pensar em ordem de
 * sobrescrita.
 */
function migrarV1(velho) {
  const desloca = (n) => (n >= 5 && n <= 7 ? n + 1 : n);
  const novo = vazio();

  for (const [id, v] of Object.entries(velho.aulas || {})) {
    const m = id.match(/^a(\d+)-(.+)$/);
    novo.aulas[m ? `a${desloca(+m[1])}-${m[2]}` : id] = v;
  }
  for (const campo of ['check', 'ex', 'req', 'proj']) {
    for (const [chave, v] of Object.entries(velho[campo] || {})) {
      const [mod, ...resto] = chave.split(':');
      novo[campo][[desloca(+mod), ...resto].join(':')] = v;
    }
  }
  for (const [mod, v] of Object.entries(velho.quiz || {})) {
    novo.quiz[String(desloca(+mod))] = v;
  }
  novo.nome = velho.nome || '';
  novo.t = velho.t || 0;
  return novo;
}

/*
 * O progresso mora só no navegador de quem lê.
 *
 * O portal é feito para ser passado adiante: cada pessoa que abre o link tem
 * o próprio avanço, guardado no próprio aparelho, e ninguém enxerga o de
 * ninguém. O preço dessa escolha é que o progresso não atravessa de um
 * aparelho para outro — quem ler no celular e no computador terá duas
 * contagens separadas.
 */
function carregarLocal() {
  try {
    const cru = localStorage.getItem(CHAVE);
    if (cru) {
      E = Object.assign(vazio(), JSON.parse(cru));
      return;
    }
    const v1 = localStorage.getItem(CHAVE_V1);
    if (v1) {
      E = migrarV1(JSON.parse(v1));
      salvar();
    }
  } catch {
    /* modo privado, armazenamento bloqueado: segue com estado vazio */
  }
}

function salvar() {
  E.t = Date.now();
  try {
    localStorage.setItem(CHAVE, JSON.stringify(E));
  } catch {
    /* sem armazenamento: o progresso vale só por esta sessão */
  }
}

/* ---- consultas de progresso ---- */

const lida = (id) => !!E.aulas[id];
const lidasDo = (m) => m.aulas.filter((a) => lida(a.id)).length;
const checkDo = (m) => m.checklist.filter((_, i) => E.check[`${m.num}:${i}`]).length;

function pctDo(m) {
  return m.aulas.length ? Math.round((lidasDo(m) / m.aulas.length) * 100) : 0;
}

/** Um módulo só está concluído quando as aulas acabaram E o checklist fechou. */
function concluido(m) {
  const semChecklist = m.checklist.length === 0;
  return lidasDo(m) === m.aulas.length && (semChecklist || checkDo(m) === m.checklist.length);
}

function estadoDo(m) {
  if (concluido(m)) return { t: 'ok', r: 'Concluído' };
  if (lidasDo(m) > 0 || checkDo(m) > 0) return { t: 'and', r: 'Em andamento' };
  return { t: '', r: 'Não iniciado' };
}
